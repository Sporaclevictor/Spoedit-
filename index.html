{t:"Charts, dashboards and your final report",
learn:[
["Choose the right chart","A chart should make one point quickly. Use a **bar or column chart** to compare categories, a **line chart** for change over time, a **pie chart** only for a few parts of one whole, and a **table** when exact numbers matter. Avoid 3D effects and too many colours.",["Compare: bar chart","Trend over time: line chart","Parts of a whole: pie (max 4 slices)","Remove clutter and label clearly"]],
["Build a dashboard","A dashboard puts the most important charts on one page. Looker Studio (lookerstudio.google.com) is free and connects to Google Sheets. Click Create > Report, choose Google Sheets as the data source, add your sheet, then insert charts and scorecards. Give each chart a clear title that states the message, such as 'Lagos earns the most revenue'.",["Add a scorecard for the big number","Use the same colours throughout","One message per chart"]],
["Tell the story","Numbers only matter when people understand and act on them. Share your results in this order: the question, the answer, the evidence (charts), and the recommendation. Keep language simple, avoid jargon, and always be honest about limits, like a small sample or missing data.",["Question, answer, evidence, recommendation","Be honest about limits","Make one clear recommendation"]]
],
tip:"If a chart needs a long explanation, simplify the chart. The title should state the finding.",
practical:{t:"Final project: Spoiad Shop sales report",goal:"Produce a short report with a dashboard and written recommendations.",
steps:["Make sure your Sales sheet is clean and your Pivots and Analysis sheets are ready.","Create a column chart of revenue by product and a line chart of revenue by month. Give each a title that states the finding.","Open Looker Studio, create a report from your Google Sheet and add a scorecard for Total revenue plus the two charts.","Write a one-page summary in Docs: the question, the answer, three findings and one recommendation (for example which product or city to focus on).","Add a short note about limits: the data covers only two months and three cities.","Export the dashboard as PDF (File > Download as PDF) and share it with a friend for feedback."],
check:["I have at least two charts with clear message titles","My dashboard has a scorecard and charts","My summary has a question, findings and a recommendation","I stated one limit of the data"]},
quiz:[["Which chart is best to show change over time?",["Line chart","Pie chart","Scorecard"],0],["A good chart title should...",["State the finding","Be as short as possible with no meaning","Be missing"],0],["What order should a report follow?",["Question, answer, evidence, recommendation","Recommendation, then data collection","Charts only"],0]]}
]});

COURSES.push({id:"backend",cat:"Tech and creative",title:"Backend Web Development",color:"#1D4ED8",price:15000,level:"Beginner to Intermediate",hours:16,
blurb:"Build real servers and APIs with Node.js, Express and a database, then put them online.",
outcome:"Build a working REST API with Node.js and Express, connect it to a database, protect it with login, and deploy it online.",
modules:[
{t:"How the web and APIs work, and your setup",
learn:[
["Clients, servers and requests","Think of a restaurant. You (the **client**) look at the menu and tell the waiter what you want. The waiter takes your order to the kitchen (the **server**) and brings back your food. On the web, your browser or app sends a **request** to a server and the server sends back a **response**. The backend is the kitchen: the code that runs on the server, stores data and applies the rules.",["Client: a browser or phone app","Server: a computer running your backend code","Request goes in, response comes out"]],
["APIs, JSON and HTTP methods","An **API** is a menu of things a server will do for you. Apps usually talk to APIs using **JSON**, a simple text format for data. Each request has a **method** that says what you want: GET (read), POST (create), PUT (update), DELETE (remove). Each response has a **status code**: 200 means OK, 201 created, 400 bad request, 401 not logged in, 404 not found and 500 server error.",["GET read, POST create, PUT update, DELETE remove","200 OK, 201 Created, 400 Bad request, 404 Not found, 500 Server error","JSON looks like { \"name\": \"Ada\", \"age\": 20 }"]],
["Install your tools","You will use **Node.js**, which lets you run JavaScript outside the browser, and **VS Code** as your editor. Download the LTS version of Node.js from nodejs.org and install it with the default options. Then open a terminal (in VS Code choose Terminal > New Terminal) and check that it works.",["node -v shows the Node version","npm -v shows the package manager version","npm installs libraries for you"]]
],
tip:"If the terminal says 'node is not recognised', close and reopen VS Code after installing Node.js.",
practical:{t:"Install Node.js and call your first API",goal:"Set up your tools, run a JavaScript file and read data from a public API.",
code:`console.log('Hello from my first Node.js program!');

const name = 'Spoiad learner';
console.log('Welcome, ' + name);`,
steps:["Install VS Code (code.visualstudio.com) and Node.js LTS (nodejs.org).","Create a folder called backend-lab, open it in VS Code and create a file named hello.js.","Paste the code on the left into hello.js and save.","Open the terminal and run: node hello.js. You should see two lines of text.","Open this link in your browser: https://jsonplaceholder.typicode.com/todos/1 and read the JSON you get back. This is a real API response.","Change the 1 to 2, 3 and 4 in the link and see how the data changes. Write down which method and status code this request used."],
check:["node -v and npm -v both show version numbers","hello.js printed my message in the terminal","I opened the JSON from the public API in my browser","I can explain what a request and response are"]},
quiz:[["Which HTTP method reads data?",["GET","POST","DELETE"],0],["What does the status code 404 mean?",["Not found","OK","Server error"],0],["What does Node.js let you do?",["Run JavaScript outside the browser","Edit photos","Send emails only"],0]]},

{t:"JavaScript for the server",
learn:[
["Variables, functions and objects","You write backend code in JavaScript. Use `const` for values that do not change and `let` for values that do. A **function** is a named set of steps you can reuse. An **object** stores related details together, and an **array** is a list. Most API data is arrays of objects.",["const student = { name: 'Ada', age: 20 }","const list = [1, 2, 3]","function add(a, b) { return a + b; }"],`const students = [
  { name: 'Ada', score: 80 },
  { name: 'Musa', score: 45 },
  { name: 'Funke', score: 92 }
];

function isPass(s) {
  return s.score >= 50;
}

console.log(students.filter(isPass));`],
["Array methods you will use daily","`filter` keeps items that match, `map` changes every item into something new, and `find` returns the first match. `forEach` runs code for each item. These methods are the heart of working with data in a backend.",["filter: keep some items","map: transform every item","find: get one item"]],
["Files, modules and npm","Split your code into files. Use `module.exports` to share a function and `require` to use it elsewhere. **npm** is the world's biggest library store. Run `npm init -y` once to create a `package.json` file that records your project and its libraries, and `npm install name` to add a library. Never edit the `node_modules` folder.",["require('./file') imports your own file","npm init -y creates package.json","npm install express adds a library"]]
],
tip:"Read error messages from the bottom up: the first line usually tells you what and where.",
practical:{t:"A tiny grade-book module",goal:"Practise functions, arrays and modules, and start a real npm project.",
code:`// gradebook.js
const students = [
  { name: 'Ada', score: 80 },
  { name: 'Musa', score: 45 },
  { name: 'Funke', score: 92 },
  { name: 'Chidi', score: 61 }
];

function passed() {
  return students.filter(function (s) { return s.score >= 50; });
}

function names() {
  return students.map(function (s) { return s.name; });
}

module.exports = { students, passed, names };

// app.js (a separate file)
// const g = require('./gradebook');
// console.log(g.passed());
// console.log(g.names());`,
steps:["In your backend-lab folder run npm init -y to create package.json.","Create gradebook.js and paste the first part of the code. Create app.js with the three lines from the comments (remove the // marks).","Run node app.js and read the output.","Add a function average() to gradebook.js that returns the average score, export it and print it from app.js.","Add a function find(name) using the find array method. Print Funke's record.","Check that everything runs again after your changes."],
check:["package.json exists in my folder","app.js prints the students who passed and the names","My average and find functions work","I understand how require and module.exports connect files"]},
quiz:[["Which array method keeps only the items that match a rule?",["filter","map","push"],0],["What does npm init -y create?",["package.json","A website","A database"],0],["What does require do?",["Imports code from another file","Deletes a file","Starts the internet"],0]]},

{t:"Your first Express server",
learn:[
["What Express is","Express is the most popular framework for building servers in Node.js. It lets you say: when someone visits this address, run this code. Install it inside your project with `npm install express`. An address like `/hello` is called a **route**.",["Framework = ready-made tools for common jobs","Route = an address your server responds to","Port = the door number your server listens on"]],
["Routes, parameters and JSON","`app.get('/path', handler)` responds to GET requests. The handler gets `req` (the request) and `res` (the response). Use `res.send()` for text and `res.json()` for JSON. A **route parameter** like `/hello/:name` captures a value from the address, available as `req.params.name`. Add `app.use(express.json())` so your server can read JSON sent to it.",["req.params for values in the address","req.query for ?key=value","res.json() sends data back as JSON"]],
["Testing your API","The browser can test GET routes. To test POST, PUT and DELETE, use a tool such as the **Thunder Client** extension in VS Code, or Postman. You choose the method, type the address, add a JSON body if needed and click Send. Restart the server (Ctrl+C then node server.js) after you change your code, or use `npx nodemon server.js` to restart automatically.",["Thunder Client: free VS Code extension","Ctrl+C stops the server","nodemon restarts it for you"]]
],
tip:"If the browser says 'cannot GET /something', you have not created that route yet.",
practical:{t:"Run a welcome server",goal:"Create an Express server with three routes and test them.",
code:`const express = require('express');
const app = express();
const PORT = 3000;

app.use(express.json());

app.get('/', function (req, res) {
  res.send('Welcome to my API');
});

app.get('/hello/:name', function (req, res) {
  res.json({ message: 'Hello, ' + req.params.name });
});

app.get('/time', function (req, res) {
  res.json({ now: new Date().toISOString() });
});

app.listen(PORT, function () {
  console.log('Server running on http://localhost:' + PORT);
});`,
steps:["In backend-lab run npm install express.","Create server.js and paste the code on the left. Save.","Run node server.js. You should see the 'Server running' message.","Open http://localhost:3000 in your browser. Then try /hello/Ada and /time.","Add a new route /about that returns JSON with your name and the course you are taking.","Stop the server with Ctrl+C, restart it and test your new route."],
check:["The server starts without errors","/, /hello/Ada and /time all respond","My own /about route works","I can explain what req and res are"]},
quiz:[["What does app.listen do?",["Starts the server on a port","Creates a database","Deletes routes"],0],["How do you read :name from /hello/:name?",["req.params.name","res.name","app.name"],0],["Which method sends JSON back?",["res.json","res.listen","req.send"],0]]},

{t:"Build a REST API (CRUD)",
learn:[
["What CRUD means","Almost every app does four things with data: **C**reate, **R**ead, **U**pdate, **D**elete. A **REST API** maps these onto HTTP methods and clean addresses: POST /tasks creates a task, GET /tasks lists them, PUT /tasks/1 updates task 1 and DELETE /tasks/1 removes it.",["POST /tasks: create","GET /tasks and GET /tasks/1: read","PUT /tasks/1: update","DELETE /tasks/1: delete"]],
["Validation and good responses","Never trust what clients send. Check that required fields exist before using them and reply with 400 if they do not. Reply with 404 when something does not exist, 201 when you create something and 200 for success. Clear error messages help the people using your API.",["400: the request is wrong","404: not found","201: created"]],
["Practising with in-memory data","Before using a real database, store data in a JavaScript array. It disappears when the server restarts, but it lets you learn all the routes quickly. In the next modules you will swap the array for a real database.",["Array = temporary storage","Each item needs a unique id","The logic stays the same with a real database"]]
],
tip:"Build one route at a time. Test each in Thunder Client before moving on.",
practical:{t:"A tasks API in memory",goal:"Write five routes that create, read, update and delete tasks.",
code:`const express = require('express');
const app = express();
app.use(express.json());

let tasks = [
  { id: 1, title: 'Learn Express', done: false },
  { id: 2, title: 'Build an API', done: false }
];
let nextId = 3;

app.get('/tasks', function (req, res) {
  res.json(tasks);
});

app.get('/tasks/:id', function (req, res) {
  const task = tasks.find(function (t) { return t.id === Number(req.params.id); });
  if (!task) return res.status(404).json({ error: 'Task not found' });
  res.json(task);
});

app.post('/tasks', function (req, res) {
  const title = (req.body.title || '').trim();
  if (!title) return res.status(400).json({ error: 'title is required' });
  const task = { id: nextId++, title: title, done: false };
  tasks.push(task);
  res.status(201).json(task);
});

app.put('/tasks/:id', function (req, res) {
  const task = tasks.find(function (t) { return t.id === Number(req.params.id); });
  if (!task) return res.status(404).json({ error: 'Task not found' });
  if (typeof req.body.title === 'string') task.title = req.body.title.trim();
  if (typeof req.body.done === 'boolean') task.done = req.body.done;
  res.json(task);
});

app.delete('/tasks/:id', function (req, res) {
  const before = tasks.length;
  tasks = tasks.filter(function (t) { return t.id !== Number(req.params.id); });
  if (tasks.length === before) return res.status(404).json({ error: 'Task not found' });
  res.json({ message: 'Deleted' });
});

app.listen(3000, function () {
  console.log('Tasks API on http://localhost:3000');
});`,

{t:"Databases and SQL basics",

["Why you need a database","Data in an array disappears when the server restarts. A **database** stores data safely on disk, can hold millions of records and lets many users read and write at once. Most backends use a **relational database** (like PostgreSQL) which stores data in tables with rows and columns, just like a spreadsheet but with strict rules.",["Table: like a sheet","Row: one record","Primary key: a unique id for each row"]],
["SQL in four commands","You talk to a relational database using SQL. `INSERT` adds a row, `SELECT` reads rows, `UPDATE` changes rows and `DELETE` removes them. Always use `WHERE` with UPDATE and DELETE, or you will change every row.",["INSERT INTO tasks (title) VALUES ('Learn SQL')","SELECT * FROM tasks","UPDATE tasks SET done = true WHERE id = 1","DELETE FROM tasks WHERE id = 1"]],

learn:[
["Keys, secrets and environment variables","To connect your server to Supabase you need your project URL and a **secret key**. The secret key has full power over your data, so it must live **only on your server**, never in a website, never on GitHub. Store secrets in a file named `.env` and read them with the `dotenv` library. Add `.env` to a `.gitignore` file so it is never uploaded.",["Never put secret keys in frontend code","Store them in a .env file","Add .env to .gitignore"]],
["Using the Supabase library","Install `@supabase/supabase-js` and `dotenv`. Create a client with `createClient(url, key)`. Then `supabase.from('tasks').select('*')` reads rows, `.insert({...})` adds a row, `.update({...}).eq('id', 1)` changes rows and `.delete().eq('id', 1)` removes them. Each call returns `{ data, error }`.",["from('table') picks the table","select, insert, update, delete","Always check error"]],
["async and await","Talking to a database takes time, so the calls are **asynchronous**. Put `async` before your handler function and `await` before the database call, so the code waits for the answer. Wrap the result: if there is an `error`, send a 500 response; otherwise send the `data`.",["async function handler()","await waits for the result","Check error before using data"]]
],

code:`# .env (create this file, one line each, no quotes)
SUPABASE_URL=https://your-project.supabase.co
SUPABASE_KEY=your-secret-key

# .gitignore
node_modules
.env

// db-api.js
require('dotenv').config();
const express = require('express');
const { createClient } = require('@supabase/supabase-js');

const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
const app = express();
app.use(express.json());

app.get('/tasks', async function (req, res) {
  const result = await supabase.from('tasks').select('*').order('id');
  if (result.error) return res.status(500).json({ error: result.error.message });
  res.json(result.data);
});

app.post('/tasks', async function (req, res) {
  const title = (req.body.title || '').trim();
  if (!title) return res.status(400).json({ error: 'title is required' });
  const result = await supabase.from('tasks').insert({ title: title }).select().single();
  if (result.error) return res.status(500).json({ error: result.error.message });
  res.status(201).json(result.data);
});

app.put('/tasks/:id', async function (req, res) {
  const result = await supabase.from('tasks')
    .update({ done: !!req.body.done }).eq('id', req.params.id).select().single();
  if (result.error) return res.status(500).json({ error: result.error.message });
  res.json(result.data);
});

app.delete('/tasks/:id', async function (req, res) {
  const result = await supabase.from('tasks').delete().eq('id', req.params.id);
  if (result.error) return res.status(500).json({ error: result.error.message });
  res.json({ message: 'Deleted' });
});

app.listen(3000, function () {
  console.log('Database API on http://localhost:3000');
});`,

{t:"Login, passwords and security",
learn:[
["Never store plain passwords","If your database leaks, plain passwords are a disaster. Instead store a **hash**, a scrambled fingerprint of the password that cannot be turned back into the original. Use the `bcryptjs` library: `bcrypt.hash(password, 10)` creates the hash and `bcrypt.compare(password, hash)` checks a login attempt.",["Hash on register, compare on login","Never log or email passwords","Minimum 6 to 8 characters, longer is better"]],
["Tokens and protected routes","After a successful login the server gives the user a **token** (a signed JWT) with `jsonwebtoken`. The app sends it with every request in the header `Authorization: Bearer TOKEN`. A small function called **middleware** checks the token before allowing access to protected routes. No valid token, no entry (status 401).",["Login returns a token","Middleware checks the token","401 means not logged in"]],
["Security habits that matter","Validate all input. Keep secrets in environment variables. Use HTTPS in production (most hosts give you this free). Limit what each user can do. Keep libraries up to date. Be careful with **SQL injection** (never build queries by joining user text; use the library's safe methods) and with **CORS**, which controls which websites may call your API.",["Validate everything","Secrets in .env","HTTPS in production","Use library methods, not string-joined queries"]]
],

practical:{t:"Register, login and a protected route",goal:"Build secure registration and login with hashed passwords and tokens.",
code:`// run first: npm install express bcryptjs jsonwebtoken dotenv
// .env  ->  JWT_SECRET=choose-a-long-random-phrase-here

require('dotenv').config();
const express = require('express');
const bcrypt = require('bcryptjs');
const jwt = require('jsonwebtoken');

const app = express();
app.use(express.json());

const users = [];
const SECRET = process.env.JWT_SECRET || 'change-me';

app.post('/register', async function (req, res) {
  const email = (req.body.email || '').trim().toLowerCase();
  const password = req.body.password || '';
  if (!email || password.length < 6) {
    return res.status(400).json({ error: 'email and a password of 6+ characters are required' });
  }
  if (users.find(function (u) { return u.email === email; })) {
    return res.status(409).json({ error: 'email already used' });
  }
  const hash = await bcrypt.hash(password, 10);
  users.push({ id: users.length + 1, email: email, hash: hash });
  res.status(201).json({ message: 'registered' });
});

app.post('/login', async function (req, res) {
  const email = (req.body.email || '').trim().toLowerCase();
  const user = users.find(function (u) { return u.email === email; });
  const ok = user && (await bcrypt.compare(req.body.password || '', user.hash));
  if (!ok) return res.status(401).json({ error: 'wrong email or password' });
  const token = jwt.sign({ id: user.id, email: user.email }, SECRET, { expiresIn: '1h' });
  res.json({ token: token });
});

function auth(req, res, next) {
  const header = req.headers.authorization || '';
  const token = header.startsWith('Bearer ') ? header.slice(7) : null;
  if (!token) return res.status(401).json({ error: 'missing token' });
  try {
    req.user = jwt.verify(token, SECRET);
    next();
  } catch (e) {
    res.status(401).json({ error: 'invalid token' });
  }
}

app.get('/profile', auth, function (req, res) {
  res.json({ user: req.user });
});

app.listen(3000, function () {
  console.log('Auth API on http://localhost:3000');
});`,

["Use tags that describe the content","Semantic HTML means choosing tags for their meaning, not their looks. Use `<header>` for the top, `<nav>` for menus, `<main>` for the main content, `<section>` for groups of related content, `<article>` for standalone items and `<footer>` for the bottom. Search engines and screen readers rely on this structure, so it helps everybody.",["One h1 per page, then h2, h3 in order","nav for menus, main for content","Avoid using <div> for everything"]],
["Links, images, lists and forms","Links use `<a href>`. Images need an `alt` text that describes them. Lists use `<ul>` and `<li>`. Forms collect input with `<form>`, `<label>`, `<input>`, `<textarea>` and `<button>`. Always connect a label to its input using `for` and `id`, so clicking the label focuses the field and screen readers announce it.",["alt describes the image","label for = input id","Choose the right input type: email, tel, number"]],
["Accessibility basics","About one in five people use accessibility features, such as screen readers, keyboard-only navigation, zoom or high contrast. Make sure you can reach every link and button with the **Tab** key, text has enough colour contrast, images have alt text and the page works when zoomed to 200 percent. Accessibility is not extra work; it is good work.",["Test with the Tab key","Strong contrast between text and background","Descriptive link text, not 'click here'"]]

{t:"Layout and responsive design",
learn:[
["Flexbox: lay things in a row","Add `display: flex;` to a container and its children line up in a row. Use `gap` for spacing, `justify-content` to space items along the row, `align-items` to align them across it and `flex-wrap: wrap` so items drop to a new line on small screens. Flexbox is perfect for navigation bars and rows of cards.",["display: flex on the parent","gap for spacing","flex-wrap: wrap for small screens"],`.row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: space-between;
}`],
["Grid: lay things in rows and columns","CSS Grid lays out items in rows and columns. The magic line `grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));` creates as many columns as fit, and each is at least 240px wide, so a card grid becomes responsive without any extra code.",["display: grid on the parent","repeat(auto-fit, minmax(240px, 1fr)) is a responsive grid","Use Grid for 2D layouts and Flexbox for 1D"],`.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}`],
["Mobile-first and media queries","Most visitors use phones, so design for small screens first and then enlarge. Always include the viewport meta tag. A **media query** applies styles only when the screen is wide enough, such as `@media (min-width: 768px) { ... }`. Make images flexible with `max-width: 100%; height: auto;`.",["Design for phones first","@media (min-width: 768px) adds tablet styles","img { max-width: 100%; height: auto; }"]]
],
tip:"Test responsiveness by dragging the browser window narrower or using the phone icon in DevTools.",
practical:{t:"A responsive navigation and card grid",goal:"Build a mobile-friendly header and a card grid that adapts to any screen.",

{t:"JavaScript essentials",
learn:[
["Variables, types and conditions","JavaScript stores information in **variables**. Use `const` when the value will not change and `let` when it will. Common types are text (strings), numbers, booleans (true or false), arrays (lists) and objects (groups of details). Use `if` and `else` to make decisions.",["const price = 2500;","let count = 0;","if (score >= 50) { ... } else { ... }"],`const name = 'Ada';
let score = 72;

if (score >= 50) {
  console.log(name + ' passed');
} else {
  console.log(name + ' needs to retry');
}`],
["Functions, arrays and loops","A **function** is a reusable set of steps. Arrays hold lists and objects hold related details. Loops repeat code. The array methods `forEach`, `map`, `filter` and `find` handle most real-life tasks neatly.",["function greet(name) { return 'Hello ' + name; }","array.filter(...) keeps matches","array.map(...) transforms items"],`function greet(name) {
  return 'Hello ' + name;
}

const scores = [45, 72, 88, 50];
const passed = scores.filter(function (s) { return s >= 50; });
const doubled = scores.map(function (s) { return s * 2; });

console.log(greet('Ada'), passed, doubled);`],
["Debugging with the Console","When your code does not work, do not panic. Open the **Console** (F12). The red error message tells you the file and line number. Use `console.log(value)` to print values as your code runs and see where things go wrong. Fix one error at a time, then refresh and test again.",["console.log shows values","Red errors give the file and line","Fix one problem at a time"]]
],
tip:"Typing code by hand, rather than copying, is the fastest way to learn. Your fingers remember patterns.",
practical:{t:"Practice lab: five small programs",goal:"Write and run small JavaScript programs in the Console and a script file.",
code:`// script.js  (add to your frontend-lab project and open the Console)
const students = [
  { name: 'Ada', score: 80 },
  { name: 'Musa', score: 45 },
  { name: 'Funke', score: 92 },
  { name: 'Chidi', score: 61 }
];

// 1. Print a grade for each student
students.forEach(function (s) {
  let grade = 'F';
  if (s.score >= 70) grade = 'A';
  else if (s.score >= 60) grade = 'B';
  else if (s.score >= 50) grade = 'C';
  console.log(s.name + ': ' + grade);
});

// 2. Names of students who passed
const passed = students
  .filter(function (s) { return s.score >= 50; })
  .map(function (s) { return s.name; });
console.log('Passed:', passed);

// 3. Class average
let total = 0;
for (let i = 0; i < students.length; i++) {
  total = total + students[i].score;
}
console.log('Average:', total / students.length);`,

check:["The Console prints grades, passed names and the average","I added a function of my own","I found the highest score","I read an error message and fixed it"]},

{t:"The DOM and events: build a to-do app",
learn:[
["What the DOM is","The **DOM** (Document Object Model) is the page as JavaScript sees it: a tree of elements you can find and change. `document.getElementById('id')` and `document.querySelector('.class')` find elements. You can change their text with `textContent`, their style with `classList` and even create new elements with `document.createElement`.",["querySelector finds an element","textContent changes text safely","createElement + appendChild adds new items"]],
["Events make pages respond","An **event** is something that happens: a click, a key press or a form submit. Use `addEventListener('click', function)` to run code when it happens. In a form, call `event.preventDefault()` so the page does not reload. Always read user input with `.value` and `trim()` it.",["click, submit, input, keydown","preventDefault stops the page reloading","Use event listeners, not inline onclick"]],
["Saving data in the browser","`localStorage` saves small amounts of text in the visitor's browser so data survives a refresh. It only stores strings, so convert lists with `JSON.stringify()` when saving and `JSON.parse()` when loading. Never store passwords or private information in localStorage.",["localStorage.setItem(key, value)","JSON.stringify to save lists","JSON.parse to load them back"]]
],
tip:"Use textContent instead of innerHTML when showing text a user typed. It protects you from malicious input.",
practical:{t:"A to-do app that remembers your tasks",goal:"Build a working to-do list with add, complete and delete, saved in the browser.",
code:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; font-size: 1rem; }
    button { padding: 12px 16px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         padding: 10px 0; border-bottom: 1px solid #ddd; }
    li.done span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <form id="form">
    <label for="task" hidden>New task</label>
    <input id="task" type="text" placeholder="What do you need to do?" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p id="count"></p>

  <script>
    var tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    var form = document.getElementById('form');
    var input = document.getElementById('task');
    var list = document.getElementById('list');
    var count = document.getElementById('count');

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      list.innerHTML = '';
      tasks.forEach(function (t, i) {
        var li = document.createElement('li');
        if (t.done) li.className = 'done';
        var span = document.createElement('span');
        span.textContent = t.text;
        span.style.cursor = 'pointer';
        span.addEventListener('click', function () {
          tasks[i].done = !tasks[i].done; save(); render();
        });
        var del = document.createElement('button');
        del.textContent = 'Delete';
        del.addEventListener('click', function () {
          tasks.splice(i, 1); save(); render();
        });
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
      var left = tasks.filter(function (t) { return !t.done; }).length;
      count.textContent = left + ' task(s) left';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      tasks.push({ text: text, done: false });
      input.value = '';
      save(); render();
    });

    render();
  <\/script>
</body>
</html>`,
steps:["Create a new file called todo.html and paste the code on the left. Open it with Live Server.","Add three tasks. Click a task to cross it out. Click Delete to remove one.","Refresh the page. Your tasks should still be there. Open DevTools > Application > Local Storage and find your saved data.","Add a feature: a button 'Clear completed' that removes all done tasks.","Add a check that stops the user adding the same task twice.","Style the app with your own colours and fonts. Take a screenshot of your finished version."],
check:["I can add, complete and delete tasks","Tasks remain after refreshing the page","I added the Clear completed feature","I understand why textContent is safer than innerHTML"]},
quiz:[["What does event.preventDefault() do in a form?",["Stops the page from reloading","Deletes the form","Changes the colour"],0],["Which method finds an element by its id?",["getElementById","getEvent","makeElement"],0],["What does localStorage let you do?",["Save small data in the browser","Host a website","Send email"],0]]},

{t:"Working with APIs and publishing your project",
learn:[
["What fetch does","Websites often load live data from an **API**: weather, news, users, products. The `fetch(url)` function asks for data, and it returns a **promise**, a placeholder for an answer that is coming. Use `async` and `await` to wait for it in a readable way, then call `.json()` to turn the response into a JavaScript object.",["fetch(url) asks for data","await waits for the answer","response.json() converts to an object"],`async function loadUsers() {
  const response = await fetch('https://jsonplaceholder.typicode.com/users');
  if (!response.ok) throw new Error('Request failed');
  const users = await response.json();
  console.log(users);
}
loadUsers();`],
["Loading and error states","Real connections fail and slow down. Always show a **loading message** while waiting and a friendly **error message** if something goes wrong. Use `try` and `catch` to handle failures without crashing the page. This is what separates a beginner project from a professional one.",["Show Loading... first","try/catch for errors","Never leave users guessing"]],
["Publish your project","Your site must be on the internet for others to see it. Upload your project folder to **Netlify Drop** (app.netlify.com/drop) for a live link in seconds, or use **GitHub Pages** after pushing to GitHub. Test the live link on your phone, then add it to your CV and your social profiles.",["Netlify Drop: drag and drop the folder","GitHub Pages: free hosting from a repo","Test the live link on a phone"]]
],
tip:"A project you can open on a phone and share by link is worth ten that only live on your laptop.",
practical:{t:"Final project: a live users directory",goal:"Fetch real data from an API, show loading and error states, and publish the finished site.",
code:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People Directory</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
    header { background: #7c3aed; color: white; padding: 24px; text-align: center; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    input { width: 100%; padding: 12px; font-size: 1rem; margin-bottom: 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: white; padding: 16px; border-radius: 12px; border: 1px solid #e5e7eb; }
    .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .status { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <header><h1>People Directory</h1></header>
  <main>
    <label for="search" hidden>Search people</label>
    <input id="search" type="search" placeholder="Search by name">
    <p id="status" class="status">Loading...</p>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    var people = [];
    var grid = document.getElementById('grid');
    var statusBox = document.getElementById('status');
    var search = document.getElementById('search');

    function show(list) {
      grid.innerHTML = '';
      statusBox.textContent = list.length ? '' : 'No people match your search.';
      list.forEach(function (p) {
        var card = document.createElement('div');
        card.className = 'card';
        var h = document.createElement('h2');
        h.textContent = p.name;
        var e = document.createElement('p');
        e.textContent = p.email;
        var c = document.createElement('p');
        c.textContent = p.company.name + ' - ' + p.address.city;
        card.appendChild(h); card.appendChild(e); card.appendChild(c);
        grid.appendChild(card);
      });
    }

    async function load() {
      try {
        var res = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!res.ok) throw new Error('Bad response');
        people = await res.json();
        show(people);
      } catch (err) {
        statusBox.textContent = 'Sorry, we could not load the data. Please try again later.';
      }
    }

    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      show(people.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; }));
    });

    load();
  <\/script>
</body>
</html>`,
steps:["Create directory.html in your project and paste the code on the left. Open it with Live Server and confirm the cards appear.","Try the search box. Type part of a name and watch the list filter live.","Turn off your internet for a moment and refresh. Do you see the friendly error message? Turn it back on.","Improve the page: add a second field to each card (for example the phone number) and restyle it with your own colours.","Rename the file to index.html in a clean folder together with any other files it needs.","Publish the folder on Netlify Drop. Open the live link on your phone and share it with a friend."],
check:["The page loads live data and shows cards","Search filters the list as I type","A loading state and an error message are working","My site is published and I have a live link"]},
quiz:[["What does fetch return?",["A promise of data","A finished image","A database"],0],["Why show a loading message?",["So users know something is happening","To make code longer","It is required by browsers"],0],["Which service lets you drag a folder to publish it?",["Netlify Drop","Notepad","Calculator"],0]]}
]});

COURSES.push({id:"corel",cat:"Tech and creative",title:"CorelDRAW Tutorial",color:"#15803D",price:8000,level:"Beginner",hours:10,
blurb:"Learn vector design in CorelDRAW: logos, flyers, business cards and print-ready artwork.",
outcome:"Design logos, business cards and flyers in CorelDRAW and export print-ready files with confidence.",
modules:[
{t:"Meet CorelDRAW and set up your workspace",
learn:[
["Vector vs bitmap images","CorelDRAW makes **vector** graphics. A vector image is built from lines, shapes and maths, so you can make it as small as a business card or as large as a billboard and it stays perfectly sharp. A **bitmap** (photo) is made of tiny dots called pixels, and gets blurry when enlarged. That is why logos, signs and printed designs are made as vectors.",["Vector: sharp at any size (logos, signs)","Bitmap: made of pixels (photos)","CorelDRAW saves its own files as .cdr"]],
["A tour of the screen","When you start a new document you will see the **toolbox** on the left (your tools), the **property bar** at the top (options for the selected tool or object), the **drawing page** in the centre (the paper), the **colour palette** on the right and **dockers** (extra panels such as Object Properties). Menus differ slightly between versions, but the main tools are the same.",["Toolbox: select, shape, rectangle, ellipse, text and more","Property bar: changes with what you select","Colour palette: click for fill, right-click for outline"]],
["Create and save a document","Choose File > New. Set a name, the page size (A4 is 210 x 297 mm), the orientation, and the **colour mode** (CMYK for printing, RGB for screens). Set the units to millimetres. Save often with Ctrl+S as a .cdr file. If you need to share the design, use File > Export instead.",["Ctrl+N new, Ctrl+S save","CMYK for print, RGB for screens","Zoom with the mouse wheel; hold the middle button to pan"]]
],
tip:"Do not worry if your menus look slightly different. Use the Help menu or the search box and type the name of the tool you need.",
practical:{t:"Set up and explore the workspace",goal:"Create your first document, draw simple shapes and save the file.",
steps:["Install CorelDRAW Graphics Suite (you can start the free trial from coreldraw.com).","Choose File > New. Name it My-First-Design, choose A4, set units to millimetres and colour mode to CMYK.","Select the Rectangle tool from the toolbox and drag on the page to draw a rectangle. Then draw an ellipse and a polygon.","Click a shape, then click a colour in the palette to fill it. Right-click a colour to change the outline.","Use the Zoom tool to zoom in on a shape and notice that the lines stay sharp.","Press Ctrl+S and save the file as My-First-Design.cdr."],
check:["My document is A4 in CMYK with millimetre units","I drew a rectangle, an ellipse and a polygon","I used the palette to fill shapes and change outlines","The file is saved as a .cdr"]},
quiz:[["Why are logos made as vectors?",["They stay sharp at any size","They are always black","They use fewer colours"],0],["Which colour mode should you use for printing?",["CMYK","RGB only","Black and white only"],0],["Where do options for the selected tool appear?",["The property bar","The colour palette","The status bar only"],0]]},

{t:"Basic shapes and working with objects",
learn:[
["Drawing and selecting","Use the Rectangle (F6), Ellipse (F7) and Polygon tools to draw basic shapes. Hold **Ctrl** while dragging to make a perfect square or circle, and **Shift** to draw from the centre. The **Pick tool** (the arrow at the top of the toolbox) selects objects. Click an object to select it, drag a box around several or hold Shift to add to a selection.",["F6 rectangle, F7 ellipse","Ctrl: perfect square or circle","Shift: draw from the centre"]],
["Move, size, rotate and duplicate","With an object selected, the property bar shows its exact size and position, so you can type numbers for accuracy. Drag the corner handles to resize (hold Ctrl to keep proportions). Click an object again to show rotation handles. **Ctrl+D** duplicates an object and **Ctrl+C then Ctrl+V** copies it.",["Type exact sizes in the property bar","Click twice to rotate","Ctrl+D duplicates quickly"]],
["Align, group and arrange","Select several objects and open **Object > Align and Distribute** to line them up neatly. **Ctrl+G** groups objects so they move as one and **Ctrl+U** ungroups. Objects sit in layers, and you can send one forward or back: **Ctrl+Page Up** and **Ctrl+Page Down**. Use guides (drag from the ruler) and snapping to place things precisely.",["Align and Distribute for neat layouts","Ctrl+G group, Ctrl+U ungroup","Ctrl+Page Up and Down to change the order"]]
],
tip:"Always group finished parts of a design. You will never accidentally pull a design apart.",
practical:{t:"Build a simple scene from shapes",goal:"Use only basic shapes, align, group and arrange to build a small illustration.",
steps:["Create a new A4 document in CMYK. Draw a large rectangle for the ground and a larger one for the sky behind it.","Use the Ellipse tool with Ctrl held to draw a perfect circle for the sun. Fill it yellow.","Build a house: a square for the walls, a triangle (polygon with 3 sides) for the roof and a small rectangle for the door.","Use Align and Distribute to centre the door on the wall and the roof over the house.","Select all parts of the house and group them with Ctrl+G. Duplicate the house with Ctrl+D and make it smaller for a second house.","Use Ctrl+Page Down to send the sky to the back if it covers other objects. Save as Scene.cdr."],
check:["My scene uses only basic shapes","The door and roof are neatly aligned","The house is grouped and duplicated","Objects are in the right order"]},
quiz:[["Which key draws a perfect circle with the Ellipse tool?",["Ctrl","Alt","Tab"],0],["What does Ctrl+G do?",["Groups objects","Deletes objects","Prints the design"],0],["Where do you type an exact size for an object?",["The property bar","The ruler only","The status bar"],0]]},

{t:"Shaping tools and drawing with curves",
learn:[
["Combine shapes into new ones","Many professional designs are just simple shapes combined. Select two overlapping shapes and use the buttons on the property bar. **Weld** joins them into one shape. **Trim** cuts the bottom shape using the top one. **Intersect** keeps only the overlapping part. **Front Minus Back** removes the back shape from the front. These tools turn circles and squares into leaves, shields, speech bubbles and logos.",["Weld: join into one","Trim: cut one with another","Intersect: keep the overlap","Practise on circles and rectangles"]],
["The Shape tool and nodes","Every vector line is made of **nodes** (points) joined by **segments**. The **Shape tool** (F10) lets you click a node and move it, add nodes (double-click on a line) or delete them. You can turn a straight line into a curve and drag the little handles to bend it smoothly. This gives you total control over any outline.",["F10: Shape tool","Double-click a line to add a node","Delete a node to simplify"]],
["Drawing with the Pen and Bezier tools","The **Pen tool** draws exact straight and curved lines. Click to place a point and click again to draw straight segments. Click and drag to create a curve. Double-click or press Enter to finish. It takes practice, so start by tracing simple shapes, such as a heart or a leaf, and adjust nodes afterwards with the Shape tool.",["Click: straight line","Click and drag: curve","Finish with Enter or double-click"]]
],
tip:"Use as few nodes as possible. Smooth curves come from fewer, well-placed nodes.",
practical:{t:"Create a leaf, a shield and a speech bubble",goal:"Use Weld, Trim, Intersect and the Shape tool to make three useful shapes.",
steps:["Draw two overlapping circles. Select both and click Intersect. Delete the original circles to leave a leaf-like shape. Fill it green.","Draw a rectangle and a circle larger than the rectangle's width, overlapping its bottom edge. Use Intersect to keep the curved bottom, then weld a triangle to the top corners to create a shield.","Draw a rounded rectangle and a small triangle at the bottom. Weld them to make a speech bubble.","Use the Shape tool (F10) to move a node on one of your shapes and see how the outline changes.","Use the Pen tool to draw a simple heart or star by clicking points, then adjust with the Shape tool.","Save as Shapes.cdr and compare how many of the three shapes you could create without drawing any line by hand."],
check:["I created a leaf, a shield and a speech bubble with shaping tools","I moved at least one node with the Shape tool","I drew one shape with the Pen tool","The file is saved as Shapes.cdr"]},
quiz:[["Which tool joins two shapes into one?",["Weld","Trim","Zoom"],0],["What are the points on a vector line called?",["Nodes","Pixels","Layers"],0],["Which key selects the Shape tool?",["F10","F6","F7"],0]]},

{t:"Colour, fills and outlines",
learn:[
["Fills and outlines","Every closed shape has a **fill** (inside colour) and an **outline** (the border). Click a palette colour to fill and right-click to colour the outline. Change outline thickness in the property bar. Use the **Interactive Fill tool** to add gradients (a smooth blend between colours) and patterns. A gradient can make a button look shiny and modern.",["Click: fill. Right-click: outline","Outline width in the property bar","Gradient: smooth blend of colours"]],
["CMYK, RGB and colour harmony","Screens mix **R**ed, **G**reen and **B**lue light (RGB). Printers mix **C**yan, **M**agenta, **Y**ellow and blac**K** inks (CMYK). Bright screen colours can look duller in print, so choose CMYK from the start when you are designing for print. Pick one main colour, one accent and neutral shades, and use them consistently.",["Screens: RGB","Print: CMYK","Stick to a limited palette"]],
["Colour tools that save time","The **Eyedropper tool** copies a colour from any object. Save your brand colours in a custom palette or as **colour styles** so you can change a colour once and update every object that uses it. Use the **Object Properties** docker to type exact colour values.",["Eyedropper copies colours","Save custom palettes","Use styles for brand consistency"]]
],
tip:"Look at how colours behave next to each other. A colour can look very different on a dark or light background.",
practical:{t:"Recolour and polish an icon",goal:"Apply a limited palette, gradients and outlines to your scene or shapes.",
steps:["Open Scene.cdr or Shapes.cdr from the previous modules.","Choose four colours for your palette (one main, one accent, two neutrals). Write down their CMYK values.","Fill each object using exactly those colours. Use the Eyedropper to make sure colours match.","Use the Interactive Fill tool to add a gradient to the sky or to one shape.","Change outline widths so important objects have a thicker outline and small details have none.","Duplicate the design and make a second version in a different palette to see how colour changes the mood. Save both."],
check:["The design uses a limited palette of four colours","At least one gradient is used","Outline widths are consistent","I made a second colour version"]},
quiz:[["Which colour mode do printers use?",["CMYK","RGB","Pixels"],0],["What does the Eyedropper do?",["Copies a colour from an object","Draws shapes","Deletes colours"],0],["Why use a limited palette?",["It looks professional and consistent","It saves ink only","It is a software rule"],0]]},

{t:"Text and typography",
learn:[
["Artistic text and paragraph text","Use the **Text tool** (F8). Click once and type for **artistic text**, which is perfect for headings, logos and short phrases. Drag a box and type for **paragraph text**, which wraps inside the box and suits longer information. You can change font, size, alignment, spacing and style in the property bar.",["Click and type: artistic text","Drag a box: paragraph text","Change font and size in the property bar"]],
["Fonts, hierarchy and spacing","Pair one bold font for headings with one simple font for details. Use size and weight to show importance: the headline is largest, then the subheading, then the details. Adjust **kerning** (space between letters) and line spacing for neat results, and avoid using more than two fonts in one design.",["Two fonts maximum","Bigger and bolder means more important","Leave white space around text"]],
["Text effects and converting to curves","**Text on a path** makes words follow a curve or circle (useful for badges and stamps). Before sending a design to a printer, use **Convert to Curves** (Ctrl+Q) so the text becomes shapes and does not change if the printer does not have your font. Save a copy of the editable version first.",["Ctrl+Q: convert text to curves","Keep an editable copy","Text on a path for round badges"]]
],
tip:"Always keep an editable copy before converting text to curves. You cannot edit the words afterwards.",
practical:{t:"Create a poster headline and a circular badge",goal:"Practise hierarchy and text on a path.",
steps:["Create an A4 document. Type a headline in a bold font and a subheading in a lighter font using artistic text.","Add a paragraph text box with three lines of details (date, time, place). Align it neatly under the subheading.","Make sure the three levels clearly show importance: headline, subheading and details.","Draw a circle. Type a short phrase (for example 'LEARN DIGITAL SKILLS') and use Text > Fit Text to Path to place it around the circle. Add a simple icon in the middle.","Save the file as Poster.cdr. Then duplicate the design and convert the text in the copy to curves with Ctrl+Q. Save it as Poster-curves.cdr.","Zoom in and check that nothing overlaps or touches the page edge."],
check:["The poster has a clear hierarchy of three levels","My badge has text following a circle","I kept an editable copy and a converted copy","Only two fonts are used"]},
quiz:[["What does Ctrl+Q do to text?",["Converts it to curves","Makes it bold","Deletes it"],0],["Which tool draws text?",["Text tool","Pick tool","Pen tool"],0],["How many fonts should one design normally use?",["One or two","Six","As many as possible"],0]]},

{t:"Design a logo from start to finish",
learn:[
["Plan before you draw","A great logo begins on paper, not on the computer. Write the business name and what it does. Sketch ten rough ideas quickly, including simple icons, initials or the name in a special style. Pick the best two and build them in CorelDRAW. A good logo is **simple, memorable and works at any size and in one colour**.",["Sketch ten ideas first","Simple shapes beat complicated drawings","Test it very small and in black and white"]],
["Build the logo with shapes","Use the shapes and shaping tools you have learned. Keep the logo symmetrical or balanced. Use your limited colour palette. Place the name next to or below the symbol and choose a font that matches the personality of the brand (friendly, serious, modern). Check spacing carefully: equal gaps look professional.",["Use Align and Distribute","Balance symbol and text","Match the font to the brand personality"]],
["Make logo versions and export","Prepare a full-colour version, a black and white version and a version for dark backgrounds. Export the logo as **PNG with a transparent background** for websites and social media, **PDF** or **SVG** for printing and **CDR** as your master file. Name files clearly, e.g. SpoiadLogo-colour.png.",["Colour, black and white, reversed","PNG for screens, PDF or SVG for print","Always keep the .cdr master"]]
],
tip:"If you cannot recognise your logo when it is the size of a thumbnail, it is too complicated.",
practical:{t:"Design and export a logo for a made-up business",goal:"Create a complete logo and export it in three formats.",
steps:["Invent a small business (for example 'Fresh Bite Foods' or 'Bright Minds Tutorials') and write one sentence about who it serves.","Sketch at least eight logo ideas on paper. Circle your favourite two.","Open CorelDRAW and build your best idea using shapes, shaping tools and a font that fits. Use no more than three colours.","Create a black and white version and a version suitable for a dark background.","Export a PNG with transparent background (File > Export, choose PNG and enable transparency) and a PDF. Save the master .cdr.","Shrink the logo to about 2 cm wide and check if it is still clear. Improve it if needed."],
check:["I sketched eight or more ideas before drawing","My logo uses a limited palette","I have colour, black and white and reversed versions","I exported PNG, PDF and CDR files"]},
quiz:[["What should you do first when designing a logo?",["Sketch ideas on paper","Choose a random font","Export the file"],0],["Which export format keeps a transparent background?",["PNG","JPG","BMP"],0],["A good logo should work...",["At any size and in one colour","Only in colour","Only on white paper"],0]]},

{t:"Print projects: business card and flyer",
learn:[
["Print basics: bleed, margins and resolution","Printers cannot print right to the edge of the paper, so designs extend slightly beyond the cut line. This extra area is called **bleed** (usually 3 mm). Keep important text inside a **safe margin** (about 5 mm from the edge) so nothing is cut off. Photos should be at least **300 dpi** at the printed size, and colours should be in **CMYK**.",["Bleed: 3 mm beyond the edge","Safe margin: 5 mm inside the edge","300 dpi for photos, CMYK for colour"]],
["Design a business card","A standard business card is 90 x 50 mm. Include only what matters: your name, your role, phone or WhatsApp, email and perhaps a logo. Keep the layout simple, leave white space and make sure text is at least 7 to 8 points so it can be read. Set the page size in CorelDRAW and add a bleed in Document settings.",["90 x 50 mm is a common size","Name, role, phone, email, logo","Text no smaller than 7 to 8 pt"]],
["Export a print-ready PDF","Convert text to curves in a copy, or embed the fonts. Choose **File > Publish to PDF**, set the preset to Prepress or Print, and include bleed. Check the PDF carefully by zooming in. Give the print shop the PDF, tell them the paper type and quantity and ask for a proof if the job is large.",["Publish to PDF with bleed","Zoom in and check spelling","Ask for a proof for large jobs"]]
],
tip:"Spelling mistakes and wrong phone numbers are the most expensive printing errors. Check them three times.",
practical:{t:"Final project: business card and A5 flyer",goal:"Design and export a print-ready business card and a flyer using your logo.",
steps:["Create a new document 90 x 50 mm (page size) with 3 mm bleed. Place your logo from Module 6 and add name, role, phone and email.","Make sure nothing important is closer than 5 mm to the edge and that the background colour extends into the bleed.","Create a second document A5 (148 x 210 mm) for a flyer. Add a headline, a short description, three key details and a call to action such as 'Call or WhatsApp us today'.","Use your palette, at most two fonts and clear hierarchy.","Export both as print PDFs with bleed (File > Publish to PDF). Open each PDF and check every word and number.","Show the result to a friend and ask: what is this for, who is it for and what should I do next? Improve if they are unsure."],
check:["The business card is 90 x 50 mm with bleed and safe margins","The flyer has a clear headline and call to action","Both files are exported as print PDFs","A friend understood the message quickly"]},
quiz:[["What is bleed?",["Extra design area beyond the cut line","A printer error","A colour"],0],["What resolution should photos have for print?",["300 dpi","30 dpi","10 dpi"],0],["What is a standard business card size?",["90 x 50 mm","10 x 10 cm","A3"],0]]}
]});

COURSES.push({id:"ai",cat:"Data and AI",title:"AI Automation",color:"#9333EA",price:12000,level:"Beginner",hours:12,
blurb:"Use AI tools and no-code automation to save hours of work every week.",
outcome:"Write effective AI prompts, build no-code automations, add AI steps to your workflows and use AI safely and honestly.",
modules:[
{t:"What AI and automation really are",
learn:[
["AI in plain words","Artificial intelligence (AI) is software that can do tasks that normally need human thinking, such as writing, summarising, translating, recognising pictures and answering questions. The AI tools you will use, such as ChatGPT, Claude and Gemini, are called **generative AI** because they generate new text from the instructions you give them. They are powerful assistants, but they are not magic and they are not always right.",["Generative AI creates text, images and more","You give instructions (called prompts)","Quality of the answer depends on the quality of your prompt"]],
["Automation in plain words","**Automation** means making a repeated task happen by itself. A simple example: when a customer fills in your form, their details are saved in a spreadsheet and you receive an email, without you touching anything. Automation follows rules you set. **AI** is good at fuzzy tasks like understanding text. Automation is good at repeating steps. Together they are very powerful.",["Automation = steps that run by themselves","AI = handles messy, human-style information","Together: AI inside an automation"]],
["What AI can and cannot do","AI is great at drafting, rewriting, summarising, brainstorming, explaining and organising. It can also **make mistakes with confidence**, which is called a hallucination: it may invent a fact, a name or a link that sounds real. You must always check important information. Never trust AI blindly for medical, legal, money or safety decisions.",["Great for drafts and ideas","Can invent facts: always verify","You are responsible for what you use"]]
],
tip:"Treat AI like a very fast intern: helpful, hard-working and in need of checking.",
practical:{t:"Meet three AI tools and test them",goal:"Try AI tools, compare their answers and spot mistakes.",
steps:["Create free accounts on at least two AI assistants (for example ChatGPT, Claude or Gemini).","Ask each the same question: 'Explain what a spreadsheet is to a 12-year-old in five sentences.' Compare the answers.","Ask each: 'Give me three facts about Nigeria with the year each happened.' Check each fact on a trusted website. Did any tool make a mistake?","Ask one of them to rewrite your answer from the first step in a simpler style, then in a more formal style.","Write down three tasks from your own school, work or home life that AI could help with.","Note one thing the AI did very well and one thing it got wrong."],
check:["I used at least two AI tools","I fact-checked at least three claims","I wrote three tasks I could use AI for","I found at least one weakness or mistake"]},
quiz:[["What is a hallucination in AI?",["Confident but wrong or invented information","A picture feature","A slow response"],0],["What is automation?",["Making repeated tasks run by themselves","Deleting files","Using a calculator"],0],["Who is responsible for AI-generated work you use?",["You are","The AI only","Nobody"],0]]},

{t:"Prompting basics: how to ask AI properly",
learn:[
["Why prompts matter","A **prompt** is the instruction you give AI. Vague prompts get vague answers. 'Write about marketing' gives you something generic. 'Write a friendly 100-word WhatsApp message to my customers announcing a 10 percent discount this Friday' gives you something useful. The AI cannot read your mind, so tell it what you need.",["Be specific about the task","Give context about who and why","State the format you want"]],
["The simple prompt formula","Use this memory aid: **Role, Task, Context, Format, Rules**. Tell the AI who it should act as, what to do, the background, how the answer should look and any limits. You do not need all five every time, but the more you give, the better the result.",["Role: 'You are a friendly customer support agent'","Task: 'Reply to this complaint'","Context: the background facts","Format: 'In three short paragraphs'","Rules: 'No more than 80 words, polite tone'"]],
["Iterate: talk back and improve","Your first answer is a draft. Follow up with instructions such as 'Make it shorter', 'Use simpler words', 'Add a call to action' or 'Give me three different versions'. Paste examples of the style you like and ask the AI to match it. Keep refining until it is right.",["Ask for changes, not a restart","Give examples of your style","Ask for several versions and pick the best"]]
],
tip:"Add the sentence 'Ask me questions if you need more information.' The AI will help you fill the gaps.",
practical:{t:"Turn a bad prompt into a great one",goal:"Practise the Role, Task, Context, Format, Rules formula and refine through three rounds.",
code:`Role: You are a friendly assistant for a small business.
Task: Write a WhatsApp message announcing a discount.
Context: We sell school bags in Lagos. Discount is 10% this Friday only.
Format: Two short paragraphs, then a clear call to action.
Rules: Under 80 words, friendly tone, no emojis, include our number [your number].`,
steps:["Start with a weak prompt: 'Write an advert.' Send it to an AI tool and save the answer.","Rewrite it using the template on the left for a real or made-up business. Send it and compare the quality.","Ask a follow-up: 'Make it shorter and more exciting.' Save the new version.","Ask for three different versions in different tones (professional, funny, warm). Pick your favourite.","Change one rule (for example 'add Pidgin English flavour') and see how the answer changes.","Write down the three biggest differences between your first weak prompt and your final prompt."],
check:["I wrote a prompt with role, task, context, format and rules","I iterated at least three times","I compared a weak prompt and a strong one","I can explain why specific prompts work better"]},
quiz:[["Which prompt is better?",["Write a 100-word friendly message announcing Friday's 10 percent discount","Write something","Do marketing"],0],["What should you do if the first answer is not right?",["Ask for changes","Give up","Start with a different topic"],0],["What does the F in the formula stand for here?",["Format","Fun","Free"],0]]},

{t:"AI for everyday work",
learn:[
["Writing, summarising and rewriting","AI saves time on the tasks that eat your day. Paste a long article and ask for a five-point summary. Paste your rough notes and ask for a clear email. Ask it to fix grammar, shorten text or translate between languages. Always read the result and adjust it so it sounds like you.",["Summarise long text","Draft emails and messages","Rewrite for tone and length"]],
["Planning, learning and ideas","Ask AI to build a study plan, explain a hard topic step by step, give practice questions or make a weekly schedule. Use it for brainstorming: 20 business name ideas, 10 social media post topics or a checklist for an event. A great trick is to say 'Explain this like I am a beginner, then test me with three questions.'",["Study plans and quizzes","Brainstorming lists of ideas","Explain like I am a beginner"]],
["Helping with data and spreadsheets","AI can explain spreadsheet formulas, suggest the right function, clean messy lists and turn messy notes into tidy tables. Describe what you want in plain words. Never paste private data like passwords, ID numbers, bank details or customers' personal information into an AI tool.",["Ask for formulas and explanations","Turn messy text into tables","Never paste private information"]]
],
tip:"Ask AI to show its working: 'Explain how you got this answer.' It helps you catch errors.",
practical:{t:"Build your own prompt library",goal:"Create eight reusable prompts that save you time.",
code:`1. Summary: Summarise the text below in 5 bullet points for a busy reader: [paste text]
2. Email: Turn these notes into a polite, clear email: [notes]. Keep it under 120 words.
3. Study: Explain [topic] step by step as if I am a beginner, then ask me three questions.
4. Ideas: Give me 15 ideas for [goal]. Group them by easy, medium and hard.
5. Rewrite: Rewrite the text below to be shorter and friendlier: [text]
6. Spreadsheet: Explain what this formula does and how to fix errors: [formula]
7. Plan: Create a one-week plan for [goal] with 30 minutes each day.
8. Check: Review my text for spelling, grammar and unclear sentences. List the changes: [text]`,
steps:["Open a document or notes app and create a page called My Prompt Library.","Copy the eight starter prompts on the left and edit each so they fit your real life (school, work, business).","Test every prompt with an AI tool using real content (but nothing private).","Improve any prompt that gave a weak answer by adding role, format or rules.","Add two prompts of your own for tasks you do every week.","Save the library where you can find it easily and use at least one prompt today."],
check:["My library has at least eight tested prompts","Each prompt has clear placeholders in brackets","I improved at least two weak prompts","I added two of my own prompts"]},
quiz:[["Which information should NOT be pasted into an AI tool?",["Passwords and private details","A public article","A general question"],0],["What is a good way to check AI work?",["Ask it to show its working and verify facts","Trust it blindly","Delete the answer"],0],["What can AI help with in spreadsheets?",["Explaining formulas","Making computers","Printing"],0]]},

{t:"Automation thinking: find and map tasks",
learn:[
["Triggers, actions and conditions","Every automation has three parts. A **trigger** is what starts it (a new form response, a new email, a time of day). An **action** is what happens next (add a row to a sheet, send a message). A **condition** decides whether to continue (only if the amount is above 10,000). Think: 'When this happens, do that, but only if...'.",["Trigger: when this happens","Action: do this","Condition: only if this is true"]],
["Which tasks are worth automating?","Good candidates are tasks that are **repetitive** (every day or week), **rule-based** (the same steps each time) and **time-consuming**. Poor candidates are tasks that need deep judgement or empathy, or happen rarely. Start with small, simple tasks and build confidence.",["Repetitive","Rule-based","Takes real time","Low risk if it goes wrong"]],
["No-code tools you can use","You do not need to write code. Tools like **Zapier**, **Make** and **n8n** connect apps visually. Google also offers built-in tools in Sheets and Forms. Most have a free plan for beginners. Menus change over time, but the idea is always the same: pick a trigger app, pick an action app and test.",["Zapier and Make: visual workflow builders","Free plans are enough to start","Always test with fake data first"]]
],
tip:"Draw the process on paper first. If you cannot explain it step by step, a tool cannot automate it.",
practical:{t:"Map three processes and choose one",goal:"Break down real tasks into triggers, actions and conditions and pick the best to automate.",
code:`Process name:
Trigger (what starts it):
Steps (in order):
1.
2.
3.
Condition (if any):
Time it takes per week:
Risk if it goes wrong (low / medium / high):`,
steps:["List ten tasks you or a small business do every week, such as confirming orders, collecting contact details or posting reminders.","For three of them, fill in the template on the left.","Estimate how many minutes each task takes per week and the risk if it goes wrong.","Choose the task with the best score: repetitive, rule-based, time-consuming and low risk.","Draw the chosen process as a flowchart with boxes and arrows on paper or in a free tool such as Canva or draw.io.","Write one sentence describing the benefit, for example 'This will save me 2 hours every week.'"],
check:["I mapped three processes using the template","I chose one process with clear reasons","I drew a flowchart with trigger, steps and condition","I wrote the expected benefit"]},
quiz:[["What starts an automation?",["A trigger","A condition","A report"],0],["Which task is best to automate first?",["A repetitive, rule-based, low-risk task","A rare, complex decision","A task that needs empathy"],0],["Do you need to code to use Zapier or Make?",["No","Always","Only on Mondays"],0]]},

{t:"Build your first automation",
learn:[
["Our example: form to sheet to email","You will build a classic automation. When someone fills in a Google Form (a trigger), their answers appear in a Google Sheet (data), and an email is sent to confirm receipt (action). It works for event sign-ups, order requests, course enquiries and more.",["Google Form collects the information","Google Sheet stores it automatically","A tool sends a confirmation email"]],
["How the connection works","In Zapier or Make you create a workflow (called a Zap or Scenario). Choose **Google Sheets: New Row** as the trigger, connect your Google account when asked, pick your sheet, then add an action such as **Gmail: Send Email**. You map fields: the email address column becomes the recipient and the name column is inserted into the message.",["Trigger app and action app","Connect accounts securely using the login screen","Map columns into the message"]],
["Test, switch on and check","Always test with a fake submission before switching the automation on. Check the email arrives and the details are correct. Keep a log of what the automation does and look at the history page regularly. If something fails, read the error message and fix the step that failed.",["Test with fake data","Check the history or run log","Switch on only when it works"]]
],
tip:"Always use your own email and made-up data while testing so you never email real customers by mistake.",
practical:{t:"Automate a sign-up confirmation",goal:"Build and test a working form to sheet to email automation.",
code:`Subject: We received your registration

Hi [Name],

Thank you for registering for [Event or Course]. We have received your details and will contact you soon with next steps.

If you have questions, reply to this email.

Kind regards,
[Your name]`,
steps:["Create a Google Form with three questions: Full name, Email address and Course interest. In the Responses tab, link it to a new Google Sheet.","Sign up for a free account at zapier.com or make.com.","Create a new workflow with trigger Google Sheets: New Spreadsheet Row. Connect your Google account and choose your sheet.","Add an action Gmail: Send Email. Put the Email column in the To field. Paste the message on the left and insert the Name and Course fields where the brackets are.","Fill in the form yourself with your own email, then run the test in the tool. Check your inbox.","Switch the workflow on. Submit one more test entry and confirm everything arrives. Write down how many minutes this will save in a month."],
check:["The form responses appear in the sheet","The workflow sends me a confirmation email","The name and course are inserted correctly","I tested before switching it on"]},
quiz:[["What should you do before switching an automation on?",["Test it with fake data","Skip testing","Delete the form"],0],["What do you map in the email action?",["Sheet columns to message fields","Photos","Passwords"],0],["Which part starts the workflow here?",["A new row in the sheet","The email","The subject line"],0]]},

{t:"Add AI to your automations",
learn:[
["Why add an AI step","Basic automations move information around. Adding an AI step lets the automation **understand** text. It can summarise a long message, decide if an email is a complaint or a question, extract a name or order number, or draft a reply. This is where automation becomes intelligent.",["Summarise","Classify (complaint, question, order)","Extract details","Draft replies"]],
["Keep a human in the loop","Do not let AI send messages to customers without review at first. Instead let the AI draft a reply and save it in a sheet or as a Gmail draft. A person reads, edits and sends it. This keeps quality high and mistakes small. Increase automation only after you trust it.",["AI drafts, human approves","Save drafts, do not send immediately","Start small and expand slowly"]],
["Write a prompt your automation can reuse","Prompts inside automations must work every time. Give clear instructions and insert the changing text as a variable, such as the message from the form. Ask for a fixed format so the next step can use it (for example, 'Answer with only one word: Complaint, Question or Order').",["Use fixed formats","Insert variables for changing text","Test with different examples"]]
],
tip:"Check your tool's free plan limits. AI steps may need an API key or a paid plan, so test with a few runs first.",
practical:{t:"AI drafts a reply for review",goal:"Add an AI step that classifies a message and drafts a reply to a sheet for you to review.",
code:`You are a polite customer support assistant for a small business.
Read the customer message below.

1. On the first line write only one word: Complaint, Question or Order.
2. On the second line write a friendly reply of no more than 60 words.
3. Do not make up prices, dates or promises.

Customer message: [insert message here]`,
steps:["Create a Google Form with Name, Email and Message fields linked to a Google Sheet.","In Zapier or Make create a workflow triggered by a new row in that sheet.","Add an AI step (for example ChatGPT or an AI action in the tool). Paste the prompt on the left and insert the Message field where indicated.","Add a final step that writes the AI answer into a new column or a second sheet called Drafts.","Submit three test messages: one complaint, one question and one order enquiry. Check that the classification and replies are sensible.","Edit the prompt if any reply was wrong, then test again. Write down one risk and how you would reduce it."],
check:["The workflow adds an AI draft for each message","The AI correctly labels three different test messages","Nothing is sent to customers automatically","I wrote down one risk and a way to reduce it"]},
quiz:[["What does 'human in the loop' mean?",["A person reviews AI output before it is used","The AI works alone","The tool is switched off"],0],["Why ask for a fixed format in a prompt?",["So the next step can use the answer","To make it longer","To confuse the AI"],0],["Which is a safe first use of AI in automation?",["Draft replies for review","Send replies without checking","Delete customer data"],0]]},

{t:"Responsible AI, assistants and your final project",
learn:[
["Using AI responsibly","Protect people's privacy: never paste personal or confidential information into public AI tools. Check facts before sharing them. Be honest: say when AI helped you create something if it matters. Respect copyright and do not claim AI work as entirely your own where honesty is required, such as exams. AI can be biased because it learns from human data, so read answers with care.",["Protect private data","Verify facts","Be honest about using AI","Watch for bias"]],
["Build a simple FAQ assistant","Many AI tools let you create a custom assistant with instructions, for example custom GPTs, Claude Projects or Gemini Gems. You write instructions and give it your business information (prices, hours, location, policies). It then answers questions in a consistent way. Always tell it what to do when it does not know the answer.",["Give clear instructions","Provide your real business facts","Say what to do when unsure"]],
["Turn skills into income","People pay for results. You can offer to set up forms, spreadsheets, automations and AI assistants for small businesses, schools and churches. Start with one service, create a small demo, show before-and-after time savings and ask for testimonials. Be honest about what you can deliver and never promise magic.",["Start with one clear service","Show a demo and time saved","Collect testimonials"]]
],
tip:"The best portfolio piece is a real problem solved, with a number such as 'saves 3 hours a week'.",
practical:{t:"Final project: automate one real process end to end",goal:"Design, build, test and document a complete automation with a human review step and an FAQ assistant.",
code:`You are the FAQ assistant for [Business name].
Use only the information below. If the answer is not here, say:
"I am not sure, please contact us on [WhatsApp number]."
Keep answers short, polite and clear.

Information:
- Opening hours: [hours]
- Location: [address]
- Services and prices: [list]
- Payment: [how customers pay]
- Delivery: [policy]`,
