<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Spoiad teaches practical digital skills online: Word, Excel, PowerPoint, web development, graphic design, digital marketing and more. Pay by bank transfer and earn a certificate.">
<meta name="theme-color" content="#0E1B33">
<meta property="og:title" content="Spoiad — Learn digital skills you can use">
<meta property="og:description" content="16 practical courses with lessons, practicals and quizzes. Pay by bank transfer and earn a certificate.">
<meta property="og:type" content="website">
<title>Spoiad — Learn digital skills you can use</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1B33'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23FFB400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ink:#0E1B33; --ink-2:#34425C; --paper:#F4F7FB; --card:#FFFFFF;
  --line:#D9E0EB; --sun:#FFB400; --sun-deep:#E39C00; --teal:#0F8B8D;
  --ok:#157F4B; --warn:#B26A00; --bad:#B3261E;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em}
a{color:inherit}
button{font:inherit;cursor:pointer}
code{background:#E8EEF8;padding:.08rem .35rem;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.6rem 1rem;z-index:99}
.skip:focus{left:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}

.demo{background:var(--sun);color:var(--ink);font-size:.88rem;text-align:center;padding:.4rem 1rem}

header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
.logo{font-family:var(--display);font-weight:800;font-size:1.55rem;text-decoration:none;letter-spacing:-.03em;display:flex;align-items:center;gap:.5rem}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--sun);display:inline-block}
.navbox{display:flex;align-items:center;gap:1rem;flex:1;justify-content:space-between;margin-left:1.5rem}
nav.main,.acts{display:flex;gap:.2rem;align-items:center}
nav.main a,.acts a.lnk,.acts button.lnk{color:#fff;text-decoration:none;background:none;border:0;padding:.5rem .8rem;border-radius:8px;font-weight:500;font-size:.95rem}
nav.main a:hover,.acts .lnk:hover{background:rgba(255,255,255,.12)}
nav.main a.on,.acts a.on{background:rgba(255,255,255,.16)}
#menuBtn{display:none;background:none;border:0;color:#fff;padding:.5rem;border-radius:8px}
#menuBtn svg{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:10px;padding:.8rem 1.3rem;font-weight:600;background:var(--ink);color:#fff;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:#1c2f52}
.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sun:hover{background:var(--sun-deep)}
.btn.wa{background:#1FA855}
.btn.wa:hover{background:#178c46}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{background:#fff}
.btn.danger{background:var(--bad)}
.btn.danger:hover{background:#8f1f19}
.btn.light{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn.light:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:.5rem .9rem;font-size:.9rem}
.btn.lg{padding:1rem 1.6rem;font-size:1.05rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.hero{background:var(--ink);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center;padding-top:4.5rem;padding-bottom:4.5rem}
.hero h1{font-size:clamp(2.5rem,5.4vw,4.2rem);max-width:13ch}
.hero p.lead{color:#C5D0E4;font-size:1.15rem;max-width:46ch;margin:1.2rem 0 1.8rem}
.hero .cta{display:flex;gap:.8rem;flex-wrap:wrap}
.hero .fine{margin-top:1.1rem;color:#9FB0CD;font-size:.92rem}
.mock{position:relative;padding:1rem 0 1rem 1rem}
.mock-card{background:#fff;color:var(--ink);border-radius:18px;padding:1.3rem;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.mock-top{font-size:.85rem;color:var(--ink-2);display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem}
.mock-top i{width:9px;height:9px;border-radius:50%;background:#157F4B;display:inline-block}
.mock-card h3{font-size:1.45rem;margin-bottom:.9rem}
.mock-code{margin-top:1rem;background:var(--paper);border-radius:10px;padding:.7rem .9rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem}
.bubble{max-width:82%;padding:.65rem .9rem;border-radius:14px;font-size:.92rem;margin-top:.8rem;box-shadow:0 12px 24px -16px rgba(0,0,0,.6)}
.bubble.out{background:#D9FDD3;color:#10301c;margin-left:auto;border-bottom-right-radius:4px}
.bubble.in{background:#fff;color:var(--ink);border-bottom-left-radius:4px}

.sec{padding:4.5rem 0}
.sec.white{background:#fff;border-block:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:2rem}
.sec-head h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.sec-head p{color:var(--ink-2);margin-top:.7rem;font-size:1.05rem}
.strip{background:var(--sun);color:var(--ink)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding-top:1.4rem;padding-bottom:1.4rem}
.strip b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1}
.strip span{font-size:.92rem}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;counter-reset:s}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.3rem}
.steps li::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;margin-bottom:.9rem}
.steps h3{font-size:1.15rem;margin-bottom:.4rem}
.steps p{color:var(--ink-2);font-size:.95rem}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.feat h3{font-size:1.25rem;margin-bottom:.5rem}
.feat p{color:var(--ink-2)}
.band{background:var(--ink);color:#fff;border-radius:22px;padding:3rem 2rem;text-align:center}
.band h2{font-size:clamp(1.8rem,3.4vw,2.6rem);max-width:20ch;margin:0 auto}
.band p{color:#C5D0E4;margin:.8rem auto 1.6rem;max-width:48ch}
.certprev{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.certprev .cert{padding:1.6rem 1rem;border-width:7px;transform:rotate(-1.5deg)}
.certprev .cert h1{font-size:1.5rem}
.certprev .cert .who{font-size:1.4rem;padding:0 1rem .2rem}
.certprev .cert .seal{width:50px;height:50px;font-size:1.1rem}
.certprev ul{margin:1rem 0 1.5rem 1.2rem;color:var(--ink-2)}
.certprev li{margin-bottom:.4rem}

.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 64px)}
.auth-hero{background:var(--ink);color:#fff;padding:4rem 2.5rem 4rem max(1.25rem,calc((100vw - 1080px)/2));display:flex;flex-direction:column;justify-content:center;gap:1.5rem}
.auth-hero h1{font-size:clamp(2.2rem,4.2vw,3.3rem);max-width:15ch}
.auth-hero p.lead{color:#C5D0E4;max-width:46ch;font-size:1.08rem}
.auth-hero ul{list-style:none;padding:0;display:grid;gap:.7rem;margin-top:.5rem}
.auth-hero li{display:flex;gap:.75rem;align-items:flex-start;color:#E6ECF7}
.auth-hero li::before{content:"";flex:none;width:10px;height:10px;margin-top:.5rem;border-radius:50%;background:var(--sun)}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:2.5rem 1.25rem}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.75rem;width:100%;max-width:420px;box-shadow:0 18px 40px -22px rgba(14,27,51,.4)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:1.4rem}
.tabs a{text-align:center;text-decoration:none;padding:.65rem;border-radius:8px;font-weight:600;color:var(--ink-2)}
.tabs a[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(14,27,51,.15)}
label{display:block;font-weight:600;font-size:.92rem;margin:0 0 .35rem}
.field{margin-bottom:1rem}
input[type=text],input[type=email],input[type=password],input[type=search],textarea{width:100%;padding:.8rem .9rem;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(15,139,141,.2)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--teal);font-weight:600;padding:.4rem .6rem}
.msg{font-size:.9rem;margin:-.25rem 0 1rem;color:var(--bad);min-height:1.2em}
.msg.good{color:var(--ok)}
.switch{margin-top:1rem;text-align:center;font-size:.92rem;color:var(--ink-2)}
.switch a{color:var(--teal);font-weight:600}

main{padding:2.5rem 0 4rem}
.page-head{margin-bottom:1.75rem}
.page-head h1{font-size:clamp(1.9rem,3.8vw,2.7rem)}
.page-head p{color:var(--ink-2);margin-top:.5rem;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.25rem}
.course{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.course:hover{border-color:var(--ink-2)}
.course .art{height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:1rem;font-family:var(--display);font-size:2.2rem;font-weight:800;color:rgba(255,255,255,.95)}
.course .art small{font-family:var(--body);font-size:.8rem;font-weight:600;background:rgba(255,255,255,.2);padding:.15rem .6rem;border-radius:99px}
.course .body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.course h3{font-size:1.25rem}
.course p{color:var(--ink-2);font-size:.95rem;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--ink-2);gap:.5rem}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.badge.ok{background:#DDF3E7;color:var(--ok)}
.badge.warn{background:#FFF0D1;color:var(--warn)}
.badge.free{background:#E8EEF8;color:var(--ink-2)}
.badge.done{background:var(--teal);color:#fff}
.badge.bad{background:#FBE0DD;color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.5rem}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:1.5rem;align-items:start}
.crumb{display:inline-block;margin-bottom:1rem;color:var(--teal);font-weight:600;text-decoration:none}
.mods{list-style:none;padding:0;margin-top:1rem}
.mods li{border-top:1px solid var(--line)}
.mods li>*{display:flex;gap:.8rem;padding:.8rem 0;align-items:center;text-decoration:none}
.mods a:hover strong{text-decoration:underline}
.mods .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.mods .done .n{background:var(--teal);color:#fff}
.price{font-family:var(--display);font-size:2.2rem;font-weight:800}
.note{font-size:.88rem;color:var(--ink-2);margin-top:.8rem}
.stack{display:grid;gap:.75rem;margin-top:1rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 1.5rem}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:.45rem 1rem;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.toolbar input{max-width:340px}
.empty{padding:2rem;text-align:center;color:var(--ink-2)}
.facts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.facts span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:.25rem .8rem;font-size:.88rem;font-weight:600;color:var(--ink-2)}

.prose{max-width:68ch}
.prose h2{font-size:1.6rem;margin:2rem 0 .6rem}
.prose p,.prose li{color:var(--ink-2);margin-bottom:.9rem}
.prose ul{margin-left:1.2rem}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.8rem;max-width:760px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--teal);line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:.7rem;color:var(--ink-2)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}

/* dashboard */
.sec-title{font-size:1.4rem;margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
.sec-title small{font-family:var(--body);font-size:.85rem;color:var(--ink-2);font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:.1rem .65rem}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem}
.pcard h3{font-size:1.2rem}
.pcard .next{color:var(--ink-2);font-size:.92rem}
.pcard.finished{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.9rem;color:var(--ink-2)}

/* learning page */
.learn{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;position:sticky;top:84px}
.side h3{font-size:1.05rem;margin:.2rem .4rem .8rem}
.side a{display:flex;gap:.6rem;padding:.6rem;border-radius:10px;text-decoration:none;font-size:.95rem;align-items:center}
.side a:hover{background:var(--paper)}
.side a.cur{background:var(--ink);color:#fff}
.side a .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.side a.done .n{background:var(--teal);color:#fff}
.lesson h1{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:1.2rem}
.lesson section{margin-bottom:1.6rem}
.lesson h3{font-size:1.25rem;margin-bottom:.5rem}
.lesson h4{font-size:1rem;margin:1.1rem 0 .4rem;font-family:var(--display)}
.lesson p{margin-bottom:.8rem;max-width:68ch}
.lesson ul,.lesson ol{margin:0 0 1rem 1.3rem;max-width:66ch}
.lesson li{margin-bottom:.4rem}
.lesson .tip{background:#FFF6DC;border-left:4px solid var(--sun);padding:.9rem 1rem;border-radius:8px;margin:1.2rem 0;max-width:66ch}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:.15rem .55rem;margin-bottom:.5rem;background:var(--ink);color:#fff}
.tag.q{background:var(--teal)}
.card{border:1.5px solid var(--line);border-radius:14px;padding:1.3rem;margin-top:1.5rem;background:#FBFCFE}
.card.prac{border-color:#C9B8F0;background:#FAF7FF}
.card h2{font-size:1.4rem;margin-bottom:.5rem}
.codebox{position:relative;margin:.8rem 0 1.1rem;max-width:100%}
.codebox pre{background:#0E1B33;color:#E6ECF7;border-radius:10px;padding:1rem;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5;white-space:pre;tab-size:4}
.codebox .copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:.25rem .7rem;font-size:.8rem;font-weight:600}
.codebox .copy:hover{background:rgba(255,255,255,.28)}
.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;margin-bottom:.5rem;background:#fff;cursor:pointer;font-weight:500}
.chk input{width:20px;height:20px;margin-top:.1rem;accent-color:var(--teal);flex:none}
.chk:has(input:checked){border-color:var(--teal);background:#EAF7F7}
.qq{border:0;margin-bottom:1.1rem;padding:0}
.qq legend{font-weight:600;margin-bottom:.5rem;padding:0}
.opt{display:flex;gap:.6rem;align-items:center;padding:.55rem .8rem;border:1.5px solid var(--line);border-radius:10px;margin-bottom:.4rem;background:#fff;cursor:pointer}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt.good{border-color:var(--ok);background:#E8F6EE}
.opt.bad{border-color:var(--bad);background:#FCEBE9}
.result{margin:.6rem 0;font-weight:600}
.result.good{color:var(--ok)}
.result.bad{color:var(--bad)}
.needs{margin-top:1.3rem;font-size:.92rem;color:var(--warn);min-height:1.2em}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}

/* admin */
.tabs2{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1.5px solid var(--line)}
.tabs2 a{padding:.65rem 1rem;text-decoration:none;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs2 a.on{color:var(--ink);border-color:var(--sun)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.stat span{color:var(--ink-2);font-size:.9rem}
.sect{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.8rem 0 .8rem;flex-wrap:wrap}
.sect h2{font-size:1.4rem}
.sect input{max-width:280px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.7rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;color:var(--ink-2)}
.scroll{overflow-x:auto}
.rowacts{display:flex;gap:.4rem;flex-wrap:wrap}
.feed{list-style:none;padding:0}
.feed li{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.5rem;background:var(--ink-2)}
.feed .dot.login{background:#6B7A99}
.feed .dot.learn{background:var(--teal)}
.feed .dot.pay{background:var(--sun-deep)}
.feed .dot.acct{background:var(--bad)}
.feed .note{margin:0}
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:.6rem;padding:.5rem 0;border-top:1px solid var(--line);align-items:center;font-size:.92rem}
.mrow .n{width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.mrow.done .n{background:var(--teal);color:#fff}
.locked-box{max-width:560px;margin:2rem auto;text-align:center}
.locked-box h1{font-size:2rem;margin-bottom:.7rem}

.cert{background:#fff;border:10px double var(--ink);padding:3rem 2rem;text-align:center;max-width:820px;margin:0 auto}

/* ===== motion + responsive polish ===== */
body{overflow-x:hidden}
html{scroll-padding-top:76px}
.btn{min-height:44px}
.btn.sm{min-height:38px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
#app>*{animation:pagein .5s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}}
header.top{transition:box-shadow .3s}
header.top.scrolled{box-shadow:0 8px 24px -12px rgba(0,0,0,.7)}
nav.main a{position:relative}
nav.main a::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:.2rem;height:2px;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.main a:hover::after,nav.main a.on::after{transform:scaleX(1)}

/* hero */
.hero{position:relative;isolation:isolate}
.hero .wrap{position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.36;z-index:0;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.blob.b1{width:380px;height:380px;background:#FFB400;top:-120px;right:8%}
.blob.b2{width:320px;height:320px;background:#0F8B8D;bottom:-140px;left:-60px;animation-duration:21s;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.18)}}
.hero h1 .hl{background:linear-gradient(transparent 64%,rgba(255,180,0,.6) 64%) no-repeat;background-size:0% 100%;animation:hl 1.1s .6s ease forwards}
@keyframes hl{to{background-size:100% 100%}}
.rotline{margin:-.6rem 0 1.6rem;color:#C5D0E4;font-size:1.05rem}
.rot{color:var(--sun);font-weight:700;display:inline-block;transition:opacity .3s,transform .3s}
.rot.out{opacity:0;transform:translateY(8px)}
.mock-card{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.mock .bar span{transform:none;animation:fillloop 6s ease-in-out infinite}
@keyframes fillloop{0%{width:8%}60%,100%{width:60%}}
.mock-code::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bubble.out{animation:bub1 10s ease-in-out infinite}
.bubble.in{animation:bub2 10s ease-in-out infinite}
@keyframes bub1{0%,6%{opacity:0;transform:translateY(12px) scale(.95)}12%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes bub2{0%,28%{opacity:0;transform:translateY(12px) scale(.95)}35%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-6px)}}
.btn.pulse{animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,180,0,.55)}70%,100%{box-shadow:0 0 0 14px rgba(255,180,0,0)}}

/* marquee */
.marquee{background:var(--ink);overflow:hidden;border-top:1px solid rgba(255,255,255,.1);white-space:nowrap}
.marquee .track{display:inline-flex;gap:2.5rem;padding:.95rem 0;animation:scroll 34s linear infinite;will-change:transform}
.marquee:hover .track{animation-play-state:paused}
.marquee span{color:#C5D0E4;font-family:var(--display);font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;gap:2.5rem}
.marquee span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* cards */
.course,.pcard,.stat{transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.course:hover,.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(14,27,51,.45)}
.course .art{position:relative;overflow:hidden}
.course .art::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s}
.course:hover .art::after{transform:translateX(100%)}
.bar span{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.opt:hover,.chk:hover{border-color:var(--teal)}
.chk input:checked{animation:tick .3s}
@keyframes tick{50%{transform:scale(1.35)}}
.result{animation:popin .35s ease both}
@keyframes popin{from{opacity:0;transform:scale(.94)}}
.opt.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.wafab::after{content:"";position:absolute;inset:0;border-radius:99px;box-shadow:0 0 0 0 rgba(31,168,85,.6);animation:ring 2.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(31,168,85,.55)}70%,100%{box-shadow:0 0 0 16px rgba(31,168,85,0)}}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sun-deep);margin-right:.4rem;animation:pdot 1.6s infinite}
@keyframes pdot{0%{box-shadow:0 0 0 0 rgba(227,156,0,.6)}70%,100%{box-shadow:0 0 0 9px rgba(227,156,0,0)}}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .25s ease,box-shadow .25s ease,border-color .25s}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}

.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}

steps:["Open School-Report.docx from the last module (or any document with at least one page of text).","Set margins to Normal (Layout > Margins) and confirm the size is A4.","Insert a Page Break before the 'Conclusion' heading so it starts on page 2.","Add a header with the text 'My School Subjects Report' and a footer with automatic page numbers.","Set Different First Page so the first page has no header.","Run the spell check (F7), fix every mistake, then open File > Print and look at the preview. Do not print unless you want to. Save the file."],
check:["The Conclusion starts on page 2 using a page break","Header and page numbers appear on page 2","The first page has no header","Spell check shows no remaining errors"]},
quiz:[["Which shortcut inserts a page break?",["Ctrl+Enter","Ctrl+B","Ctrl+K"],0],["Where do you set Portrait or Landscape?",["Layout tab","Review tab","View tab"],0],["What is the safest thing to do before printing?",["Check the print preview","Change the font","Close Word"],0]]},

{t:"Project: build a professional CV",
learn:[
["What a good CV contains","A CV (curriculum vitae) tells an employer who you are in about one page. Put your name large at the top with your phone number and email. Then add a short Profile (2 to 3 lines), Education, Skills, Experience or Projects, and References. Use clear headings, consistent fonts and plenty of white space.",["Use a professional email address","One page is enough when you are starting out","Use bullet points, not long paragraphs"]],
["Writing strong points","Start each bullet with an action word: Organised, Created, Led, Typed, Designed. Say what you did and the result, for example: 'Typed and formatted 40 pages of class notes for 30 students'. Keep tenses and punctuation consistent.",["Be honest and specific","Check spelling twice, then ask someone else to check"]],
["Layout tricks","Use a table with no borders to put dates on the right of each entry. Use Heading 2 style for section titles and a thin bottom border to separate sections. Keep margins at about 2 cm so everything fits on one page. Finish by exporting a PDF.",["Table > Borders > No Border hides the grid lines","Name the file FirstName-LastName-CV.pdf"]]
],
tip:"Ask a teacher or friend to read your CV. Fresh eyes find mistakes you cannot see.",
practical:{t:"Your one-page CV",goal:"Create a complete, print-ready CV using the skills from this course.",
steps:["Open a blank document and set margins to about 2 cm (Layout > Margins > Custom).","Type your full name at the top in size 24 bold, with phone and email beneath it in size 11.","Add the section headings: Profile, Education, Skills, Projects or Experience, References. Format them with Heading 2 and add a bottom border.","Write a 2-line profile and add at least three bullet points under Skills and two under Projects.","Use a borderless two-column table to place dates on the right under Education.","Check that everything fits on one page, run the spell check, then save as a .docx and export a PDF."],
check:["My CV fits on one page","Headings are consistent and bullets start with action words","Spelling is checked","I exported a PDF copy"]},
quiz:[["How long should a first CV usually be?",["One page","Five pages","Ten pages"],0],["Which is a better bullet point?",["Did many things","Typed and formatted 40 pages of class notes","I am good"],1],["Which file type should you usually email to an employer?",["PDF","TMP","Draft"],0]]}
]});

COURSES.push({id:"excel",cat:"Office",title:"Microsoft Excel",color:"#157F4B",price:6000,level:"Beginner",hours:6,
blurb:"Organise data, use formulas and build charts for work and business.",
outcome:"Build organised spreadsheets with formulas, lookups and charts, including a working monthly budget.",
modules:[
{t:"Spreadsheet basics",
learn:[
["The Excel grid","An Excel file is a **workbook** made of **worksheets** (tabs at the bottom). Each sheet is a grid of **columns** (A, B, C) and **rows** (1, 2, 3). Where a column and row meet is a **cell**, named by its column and row, such as B3. The Name Box shows the selected cell and the Formula Bar shows what is inside it.",["Click a cell, then just type","Press Enter to move down, Tab to move right","F2 edits the selected cell"]],
["Entering and selecting data","Type text, numbers or dates into cells. Text lines up on the left and numbers on the right. Drag across cells to select a **range** such as A1:C5. Click a column letter to select the whole column. Double-click the line between two column letters to fit the width to the longest entry.",["Ctrl+Z undoes a mistake","Delete clears the selected cells","Right-click a row or column to insert or delete it"]],
["Saving and organising sheets","Save with Ctrl+S as an `.xlsx` file. Double-click a sheet tab to rename it, right-click to add colour or delete it. Use **View > Freeze Panes > Freeze Top Row** so headings stay visible when you scroll a long list.",["Name sheets clearly, e.g. January, February","Freeze the header row on long lists"]]
],
tip:"Keep one kind of information per column, and one record per row.",
practical:{t:"Shopping list sheet",goal:"Enter data, adjust column widths, freeze headings and save the workbook.",
code:`Item\tQuantity\tUnit Price
Rice (kg)\t3\t2500
Beans (kg)\t2\t1800
Vegetable oil (litre)\t1\t2400
Tomatoes (basket)\t1\t3000
Bread\t4\t900`,
steps:["Open Excel and start a Blank workbook.","Click cell A1, then paste the data above (or type it, one value per cell).","Double-click the lines between column letters A, B and C so all text fits.","Click cell A1 and use View > Freeze Panes > Freeze Top Row.","Rename Sheet1 to Shopping by double-clicking the tab.","Save as Shopping-List.xlsx."],
check:["The data sits in columns A to C with headings in row 1","All columns are wide enough to show their text","The top row is frozen","The sheet is renamed Shopping and the file is saved"]},
quiz:[["How is the cell in column C, row 4 written?",["4C","C4","C-4"],1],["What does Freeze Top Row do?",["Keeps the heading visible while scrolling","Deletes row 1","Adds a border"],0],["Which file type does Excel use by default?",[".xlsx",".docx",".pptx"],0]]},

{t:"Formulas and functions",
learn:[
["Your first formulas","Every formula starts with an equals sign. Type `=B2*C2` and press Enter to multiply two cells. Use `+`, `-`, `*` and `/` for the four operations. Excel follows normal maths order: brackets first, then multiply and divide, then add and subtract. Click cells instead of typing their names to avoid mistakes.",["=A1+A2 adds two cells","=(A1+A2)/2 averages two cells","Formulas update when the numbers change"]],
["Common functions","Functions are ready-made formulas. `=SUM(B2:B6)` adds a range. `=AVERAGE(B2:B6)` finds the mean. `=MAX()` and `=MIN()` find the largest and smallest. `=COUNT()` counts how many cells contain numbers. The AutoSum button (Home tab, the Σ symbol) inserts SUM for you.",["=SUM(B2:B6)","=AVERAGE(B2:B6)","=MAX(B2:B6) and =MIN(B2:B6)","=COUNT(B2:B6)"]],
["Copying formulas with AutoFill","Select a cell with a formula and drag the small square at its bottom-right corner (the fill handle) down. Excel copies the formula and adjusts the row numbers for each row. Double-click the fill handle to fill the whole column at once.",["Fill handle: bottom-right corner of the cell","Always check the first and last result"]]
],
tip:"If you see ####, the column is too narrow. Widen it. If you see an error, click the cell and read the formula.",
practical:{t:"Calculate your shopping total",goal:"Use formulas, SUM, AVERAGE, MAX and AutoFill on your shopping list.",
steps:["Open Shopping-List.xlsx from the last module.","In D1 type the heading Total. In D2 type =B2*C2 and press Enter.","Drag the fill handle of D2 down to D6 so every item has a total.","In C8 type Grand total. In D8 type =SUM(D2:D6).","In C9 type Average item cost and in D9 type =AVERAGE(D2:D6).","In C10 type Most expensive and in D10 type =MAX(D2:D6). Save the file."],
check:["Column D shows a total for every item","The grand total uses SUM","The average and maximum are calculated with functions","I filled formulas down using the fill handle"]},
quiz:[["How does every formula begin?",["With =","With #","With @"],0],["Which formula adds cells B2 to B6?",["=ADD(B2:B6)","=SUM(B2:B6)","=B2:B6"],1],["What is the small square at the corner of a cell used for?",["Copying formulas by dragging","Deleting data","Printing"],0]]},

{t:"Formatting and cell references",
learn:[
["Formatting numbers and cells","Use the Home tab to format. Choose **Number Format** for currency, percentage or date. Bold the heading row, add borders, fill colours and centre headings. Select a range and click **Merge & Center** for a title across columns. Formatting changes how a value looks, not its real value.",["Currency or Accounting for money","Percent Style turns 0.25 into 25%","Format Painter works in Excel too"]],
["Relative references","When you copy `=B2*C2` down, it becomes `=B3*C3`, then `=B4*C4`. This is a **relative reference**: it moves with the formula. Most of the time this is what you want.",["Relative: B2","The reference shifts when copied"]],
["Absolute references","Sometimes a cell must stay fixed, such as a tax rate. Put dollar signs around it: `$B$1`. Press **F4** after clicking a cell to add them. Now `=B5*$B$1` keeps pointing to B1 when you copy it down.",["Absolute: $B$1 stays fixed","Mixed: $B1 or B$1 fixes only column or row"]]
],
tip:"If a copied formula gives wrong answers, check whether one reference should have dollar signs.",
practical:{t:"Add VAT with an absolute reference",goal:"Format a price list and calculate VAT using a fixed cell.",
code:`VAT rate\t0.075
Product\tPrice
Notebook\t500
Pen\t150
Calculator\t4500
Ruler\t300`,
steps:["On a new sheet paste the data above starting in A1. Cell B1 holds the VAT rate.","In C2 type the heading VAT and in D2 type Price with VAT (the headings for the table are in row 2).","In C3 type =B3*$B$1 and press Enter. In D3 type =B3+C3.","Select C3:D3 and drag the fill handle down to row 6.","Format B3:D6 as Currency using the Home tab and format B1 as a percentage.","Bold and fill the heading row, add borders, and save as Price-List.xlsx."],
check:["VAT uses $B$1 and gives the right answer on every row","Prices are shown as currency","B1 is shown as a percentage","The headings are bold with a fill colour"]},
quiz:[["What does $B$1 mean?",["The reference never changes when copied","The cell contains money","The cell is hidden"],0],["Which key adds dollar signs to a reference?",["F2","F4","F5"],1],["Formatting a cell as Currency changes...",["How the value looks","The actual value","The column name"],0]]},

{t:"Logic, lookup and data tools",
learn:[
["IF, COUNTIF and SUMIF","`=IF(B2>=50,\"Pass\",\"Fail\")` checks a condition and shows one result if true and another if false. `=COUNTIF(B2:B20,\">=50\")` counts the cells that meet a rule. `=SUMIF(A2:A20,\"Rice\",C2:C20)` adds the numbers in column C where column A says Rice.",["Text inside formulas goes in quotation marks","Comparison signs: > < >= <= = <>"]],
["Sort and filter","Click inside your data and choose **Data > Sort** to arrange by a column, or **Data > Filter** to add drop-down arrows to the headings. Filters hide rows you do not need without deleting them. Turn the filter off by clicking Filter again.",["Sort A to Z or smallest to largest","Filters hide, they do not delete"]],
["Lookup functions","`=XLOOKUP(E2,A2:A10,B2:B10)` finds the value in E2 inside A2:A10 and returns the matching entry from B2:B10. Older versions use `=VLOOKUP(E2,A2:B10,2,FALSE)`. Lookup is how you pull a price or a name from a list automatically.",["XLOOKUP is in Microsoft 365 and Excel 2021","Use VLOOKUP on older Excel versions"]]
],
tip:"Test an IF formula with a value that should pass and a value that should fail.",
practical:{t:"Class mark sheet",goal:"Use IF, COUNTIF, AVERAGE, sorting and filtering on a set of scores.",
code:`Student\tMaths\tEnglish
Amina\t72\t65
Chidi\t45\t58
Ngozi\t88\t91
Tunde\t39\t47
Funke\t61\t70
Ibrahim\t55\t49`,
steps:["Paste the data into A1 on a new sheet.","In D1 type Average. In D2 type =AVERAGE(B2:C2) and fill down to D7.","In E1 type Result. In E2 type =IF(D2>=50,\"Pass\",\"Fail\") and fill down.","In G1 type Passed and in H1 type =COUNTIF(E2:E7,\"Pass\").","Click inside the table and use Data > Sort to arrange by Average, largest to smallest.","Apply Data > Filter and show only students who Failed. Clear the filter and save as Mark-Sheet.xlsx."],
check:["Averages are calculated with a formula","The Result column shows Pass or Fail using IF","COUNTIF returns the number of passes","I sorted and filtered the data"]},
quiz:[["Which function shows one result if a test is true and another if false?",["COUNT","IF","SORT"],1],["What does a filter do to rows that do not match?",["Hides them","Deletes them","Copies them"],0],["What is XLOOKUP used for?",["Finding a value and returning a matching entry","Printing","Drawing charts"],0]]},

{t:"Charts and project: monthly budget",
learn:[
["Choosing a chart","Select your data including headings, then open **Insert > Recommended Charts**. A **column chart** compares amounts, a **line chart** shows change over time and a **pie chart** shows parts of a whole (use it only with a few categories). Choose the simplest chart that makes your point clear.",["Column: compare items","Line: show trends over time","Pie: parts of one whole"]],
["Making charts clear","Click a chart and use the green plus (+) button to add a Chart Title, Axis Titles and Data Labels. Remove gridlines or legends that add clutter. Double-click the title to rename it. Right-click a chart and choose Move Chart to place it on its own sheet.",["Always give the chart a clear title","Label what the axes show"]],
["Planning a budget","A budget lists money coming in (income) and going out (expenses). Subtract expenses from income to see what is left. Review your actual spending against your plan every month, and use charts to see where your money goes.",["Income minus expenses = balance","Record every expense, even small ones"]]
],
tip:"A chart without a title is a chart nobody understands.",
practical:{t:"Monthly budget with a chart",goal:"Build a complete monthly budget with formulas and a chart.",
code:`Category\tPlanned\tActual
Pocket money / Income\t20000\t20000
Transport\t4000\t4500
Data and airtime\t3000\t3500
Food\t6000\t5500
Savings\t3000\t2000
Other\t2000\t2500`,
steps:["Paste the data into A1 of a new workbook and rename the sheet Budget.","Type Expenses total in A8, then in B8 use =SUM(B3:B7) and in C8 use =SUM(C3:C7).","In A9 type Balance and use =B2-B8 in B9 and =C2-C8 in C9.","In D1 type Difference. In D3 type =B3-C3 and fill down to D7 so you can see overspending.","Select A1:C7, choose Insert > Recommended Charts and pick a clustered column chart. Add a title 'Planned vs Actual'.","Format the money columns as currency, bold the headings and save as Monthly-Budget.xlsx."],
check:["Totals and balance use SUM and subtraction formulas","The Difference column shows overspending","A column chart with a title compares planned and actual","Currency formatting is applied"]},
quiz:[["Which chart is best for showing change over time?",["Line chart","Pie chart","None of these"],0],["How do you add a chart title?",["Use the + Chart Elements button","Press F7","Delete the chart"],0],["What is balance in a budget?",["Income minus expenses","Expenses minus income","Only savings"],0]]}
]});

COURSES.push({id:"powerpoint",cat:"Office",title:"Microsoft PowerPoint",color:"#C2410C",price:5000,level:"Beginner",hours:5,
blurb:"Design clear slides and present with confidence.",
outcome:"Design clean, readable slides with pictures and charts, and deliver a confident presentation.",
modules:[
{t:"Building your first deck",
learn:[
["Slides, layouts and the screen","A presentation is called a **deck** and is made of **slides**. The slide thumbnails sit on the left, the editing area is in the middle, and the Notes pane is under the slide. Click **New Slide** on the Home tab and choose a **layout** such as Title Slide, Title and Content, or Two Content. Layouts give you ready-made boxes so you never place text randomly.",["Title Slide: opening slide","Title and Content: most slides","Section Header: divides parts of a talk"]],
["Adding and organising content","Click inside a placeholder and type. Press Enter for a new bullet and Tab to indent a sub-point. Drag thumbnails in the left pane to reorder slides. Right-click a thumbnail to Duplicate or Delete. Use **View > Slide Sorter** to see the whole deck at once.",["One idea per slide","Aim for no more than 5 short bullets"]],
["Saving and starting a show","Save with Ctrl+S as a `.pptx` file. Press **F5** to start the slide show from the beginning, or Shift+F5 to start from the current slide. Press Esc to exit. Use the arrow keys or the spacebar to move forward.",["F5 starts from slide 1","Shift+F5 starts from the current slide"]]
],
tip:"Write your message in one sentence first. Then build slides that support only that sentence.",
practical:{t:"Create a 4-slide introduction",goal:"Build a short deck about yourself using layouts and slide sorter.",
steps:["Open PowerPoint and choose Blank Presentation.","On the title slide, type 'About Me' as the title and your name as the subtitle.","Add a Title and Content slide called 'My Skills' with three bullet points.","Add a Two Content slide called 'My Goals' with two points on each side.","Add a final slide called 'Thank You' using the Title Slide layout.","Use Slide Sorter to move 'My Goals' before 'My Skills', then press F5 to play the show. Save as About-Me.pptx."],
check:["The deck has four slides using different layouts","Each slide has one clear idea","I reordered slides in Slide Sorter","I played the show with F5"]},
quiz:[["Which key starts the slide show from the beginning?",["F5","F2","F12"],0],["What is a layout?",["A ready-made arrangement of boxes on a slide","A kind of font","A file type"],0],["How many ideas should one slide carry?",["One","Ten","As many as fit"],0]]},

{t:"Design that people can read",
learn:[
["Text size and amount","If people cannot read it from the back of the room, it is too small. Use at least **28 points** for body text and **36 points or more** for titles. Use short phrases, not sentences. If you must shrink the text to make it fit, split the content onto two slides.",["Fewer words, bigger text","Never read your slides word for word"]],
["Colour and contrast","Dark text on a light background, or light text on a dark one, is easy to read. Avoid red on green or yellow on white. Pick one main colour and one accent colour. Use the **Design** tab to choose a theme and variants, which keeps every slide consistent.",["Use the Design tab for themes","Keep fonts consistent: one for headings, one for body"]],
["Alignment and the slide master","Use **Arrange > Align** to line objects up neatly. To change something on every slide, such as a logo or font, go to **View > Slide Master**, edit the top slide, and close the master view. **Design Ideas** (Home > Designer) can also suggest layouts for a slide you have built.",["Edit the Slide Master once instead of each slide","Leave empty space: it makes slides look professional"]]
],
tip:"Squint at your slide. If the main point still stands out, the design works.",
practical:{t:"Fix a messy slide",goal:"Apply theme, contrast, font size and alignment to improve a slide.",
code:`Why Learn Computer Skills
Computer skills are very important in the modern world because almost every job now requires you to be able to use a computer to do your work every day and it can also help you to get a better salary
Word Excel PowerPoint Internet`,
steps:["Create a Title and Content slide and paste the text above: the first line as the title, the second and third lines in the content area.","Choose a theme from the Design tab and a colour variant with good contrast.","Rewrite the long paragraph into three short bullets such as 'Almost every job uses computers', 'Better pay', 'Faster work'.","Make the body text at least 28 points and the title at least 40 points.","Use View > Slide Master to change the font of the whole deck to one clean font, then close Master view.","Duplicate the slide and compare the before and after. Save as Design-Practice.pptx."],
check:["The body text is 28 points or larger","The text has strong contrast with the background","The long paragraph is now short bullets","I changed the font from the Slide Master"]},
quiz:[["What is a good minimum size for slide body text?",["12 points","28 points","8 points"],1],["Where do you change a font for the whole deck?",["Slide Master","Slide Sorter","Notes pane"],0],["Which is better for slides?",["Long paragraphs","Short phrases","Tiny text"],1]]},

{t:"Pictures, shapes and charts",
learn:[
["Pictures and icons","Use **Insert > Pictures** or **Icons**. Choose clear, relevant images; avoid blurry or stretched ones. Resize from a corner. Use **Picture Format > Crop** to remove unwanted edges and **Corrections** to adjust brightness. Only use photos you are allowed to use.",["Resize from a corner","One strong picture beats three small ones"]],
["Shapes and SmartArt","**Insert > Shapes** lets you draw boxes, arrows and callouts. Group objects with Ctrl+G so they move together. **SmartArt** turns a list into a diagram: process, cycle, hierarchy. Click a SmartArt graphic and type in the text pane on the left.",["Process: steps in order","Cycle: repeating steps","Hierarchy: who reports to whom"]],
["Charts and tables","**Insert > Chart** opens a small spreadsheet where you type your numbers. Choose a column chart to compare and a line chart for change over time. Give each chart a title that states the message, such as 'Sales doubled in 2025'. Insert > Table works like Word and Excel tables.",["Edit data: right-click the chart > Edit Data","State the message in the chart title"]]
],
tip:"Replace paragraphs with a picture, a diagram or a chart whenever you can.",
practical:{t:"Visual slide set",goal:"Create three slides using a picture, a SmartArt process and a chart.",
steps:["Create a new deck and add a Title and Content slide named 'Our Project'. Insert a relevant picture and crop it.","Add a new slide named 'How It Works'. Insert a SmartArt Basic Process with three steps: Plan, Build, Present.","Add a slide named 'Our Growth'. Insert a column chart and change the data to: 2023 = 40, 2024 = 65, 2025 = 90.","Change the chart title to 'Growth doubled in two years' and add data labels.","Draw an arrow shape on the chart slide pointing to the 2025 column and group it with a text box that says 'Best year'.","Save as Visuals.pptx."],
check:["A cropped picture sits neatly on slide 1","SmartArt shows a three-step process","The chart uses my numbers and has a message title","The arrow and text box are grouped"]},
quiz:[["Which SmartArt type shows steps in order?",["Process","Matrix","Picture"],0],["What does Ctrl+G do to selected objects?",["Groups them","Deletes them","Prints them"],0],["A good chart title should...",["State the message","Be blank","Be very long"],0]]},

{t:"Animation, transitions and media",
learn:[
["Transitions","A transition is the effect between two slides. Open the **Transitions** tab and choose a subtle one such as Fade or Push. Use **Apply To All** so the entire deck feels consistent. Flashy transitions distract from your message.",["Use one transition style for the whole deck","Fade and Push look professional"]],
["Animations","Select an object and open **Animations**. Choose Entrance effects like Appear or Fade to reveal points one at a time. Open the **Animation Pane** to change the order, timing and start (On Click, With Previous, After Previous). Animations should control attention, not decorate.",["Animate bullet points to show one at a time","Avoid spinning, bouncing or sound effects"]],
["Audio and video","**Insert > Video** or **Audio** adds media from your device. Use Playback options such as Start Automatically or Loop. Trim a video with Playback > Trim Video. Keep media short and make sure files are saved in the same folder as your deck so they play on another computer.",["Keep videos under one minute where possible","Test media on the computer you will present with"]]
],
tip:"If you are unsure about an animation, remove it. Plain and clear always wins.",
practical:{t:"Make a deck move with purpose",goal:"Apply transitions and meaningful animations to a deck.",
steps:["Open Visuals.pptx or any deck with at least three slides.","Apply the Fade transition and click Apply To All.","On a slide with bullets, select the text box and add the Fade entrance animation with effect option 'By Paragraph' so each point appears on click.","Open the Animation Pane and confirm the order of the animations. Change the second bullet to start After Previous.","If you have a short video or audio clip, insert it on a new slide and set it to play on click.","Press Shift+F5 to test. Save as Animated.pptx."],
check:["All slides use the same subtle transition","Bullets appear one at a time","I used the Animation Pane to check the order","I tested the slide show"]},
quiz:[["What does Apply To All do on the Transitions tab?",["Uses one transition on every slide","Deletes slides","Adds sound"],0],["Which tool shows the order of animations?",["Animation Pane","Slide Sorter","Notes"],0],["Why save media in the same folder as the deck?",["So it plays on another computer","To make it bigger","To change colours"],0]]},

{t:"Presenting and project: a 5-slide pitch",
learn:[
["Structure of a talk","Tell people what you will say, say it, then summarise it. A simple pitch has five slides: Title, The Problem, The Solution, How It Works, and The Ask or Next Step. Keep each slide to one message and speak to the audience, not the screen.",["Opening: say who you are and why this matters","Close: say what you want people to do"]],
["Speaker notes and rehearsal","Type your talking points in the **Notes** pane under each slide. Use **Slide Show > Rehearse Timings** to practise and time yourself. Practise out loud at least twice. Look at your audience, speak slowly and pause after important points.",["Notes are for you, not for the slide","Aim for about one minute per slide"]],
["Using Presenter View","In **Slide Show**, tick **Use Presenter View** so you can see your notes, the next slide and a timer while the audience sees only the slide. Press B to blank the screen and W to show a white screen. Save a PDF copy as a backup: **File > Export > PDF**.",["Always carry a backup copy","Arrive early and test the projector"]]
],
tip:"Nervous? Slow down and breathe. Nobody minds a pause, but everyone minds a rushed talk.",
practical:{t:"Your 5-slide pitch",goal:"Create and rehearse a five-slide pitch for an idea, a business or a school project.",
steps:["Choose an idea: a small business, a club, a school project or a community service.","Create five slides: Title, The Problem, The Solution, How It Works, Next Step. Keep text short and big.","Add at least one picture or SmartArt and one chart or number that supports your point.","Type speaker notes under every slide.","Use Rehearse Timings to practise out loud twice. Aim for under five minutes.","Export a PDF backup and save the deck as My-Pitch.pptx."],
check:["The deck has five slides with a clear message each","There is at least one visual and one number","Every slide has speaker notes","I rehearsed twice and saved a PDF backup"]},
quiz:[["Where do you type your talking points?",["Notes pane","Slide title","Footer"],0],["What does pressing B do in a slide show?",["Blanks the screen","Starts the show","Saves the file"],0],["Why export a PDF backup?",["In case the deck does not open","To add animations","To change fonts"],0]]}
]});

COURSES.push({id:"web",cat:"Tech and creative",title:"Web Development",color:"#6D28D9",price:12000,level:"Beginner",hours:8,
blurb:"Build and publish real websites with HTML, CSS and JavaScript.",
outcome:"Build a responsive personal website with HTML, CSS and JavaScript, and publish it online.",
modules:[
{t:"How the web works and your setup",
learn:[
["Browsers, servers and files","When you type a web address, your **browser** asks a **server** for files and displays them. A website is just a folder of files. **HTML** gives a page its structure and content, **CSS** controls how it looks, and **JavaScript** makes it interactive. The main file of a site is usually called `index.html`.",["HTML: the structure (headings, text, images)","CSS: the style (colours, spacing, layout)","JavaScript: the behaviour (clicks, forms, updates)"]],
["Set up your tools","Install **Visual Studio Code** (free) from code.visualstudio.com. Create a folder called `my-site` on your computer. In VS Code choose **File > Open Folder** and pick it. Create a new file named `index.html` with the New File button. You can open that file in any browser by double-clicking it.",["Use lowercase file names with no spaces","Save with Ctrl+S, then refresh the browser to see changes"]],
["Your first page","Every HTML page starts with the same skeleton. Tags come in pairs, an opening tag like `<h1>` and a closing tag like `</h1>`. Whatever is inside the `<body>` appears on the page.",[],`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Page</title>
</head>
<body>
  <h1>Hello, world!</h1>
  <p>This is my first web page.</p>
</body>
</html>`]
],
tip:"If your change does not show, you probably forgot to save. Press Ctrl+S, then refresh the browser.",
practical:{t:"Build and open your first page",goal:"Set up your folder and editor, and display a page in the browser.",
code:`<!DOCTYPE html>
<html lang="en">
<head>

{t:"CSS: styling and layout",
learn:[
["Adding CSS","Create a file called `style.css` and link it inside the `<head>` with `<link rel=\"stylesheet\" href=\"style.css\">`. A CSS rule has a **selector** (what to style) and **declarations** (how). Selectors can be a tag (`h1`), a class (`.card`) or an id (`#top`).",["Class: .name in CSS, class=\"name\" in HTML","Colours: names, #hex codes or rgb()"],`body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #0e1b33;
}
h1 { color: #6d28d9; }
.card {
  background: white;
  padding: 16px;
  border-radius: 10px;
}`],
["The box model","Every element is a box: **content**, then **padding** (space inside), then **border**, then **margin** (space outside). Add `box-sizing: border-box;` to all elements so widths behave predictably. Use `max-width` and `margin: 0 auto;` to centre a block.",["padding: space inside the box","margin: space outside the box","margin: 0 auto centres a block with a set width"],`* { box-sizing: border-box; }
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}`],
["Flexbox and responsive design","`display: flex;` places children in a row. Use `gap` for spacing, `justify-content` to space them and `flex-wrap: wrap;` so they drop to a new line on small screens. A **media query** applies styles only on certain screen widths, which makes a site work on phones.",["Always include the viewport meta tag","Design for phones first, then wider screens"],`.row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.row > div { flex: 1 1 200px; }
@media (max-width: 600px) {
  h1 { font-size: 1.6rem; }
}`]
],
tip:"Right-click anything on a web page and choose Inspect. You can test CSS live before changing your file.",

{t:"JavaScript: making pages interactive",
learn:[
["Variables, functions and console","JavaScript runs in the browser. Add it just before `</body>` with `<script src=\"script.js\"><\/script>`. Use `let` for values that change and `const` for ones that do not. A **function** is a named block of code you can run again. Use `console.log()` to see values in the browser console (F12 > Console).",["let count = 0;","const name = 'Ada';","function greet() { ... }"],`const name = 'Ada';
let count = 0;
function greet() {
  console.log('Hello ' + name);
}
greet();`],
["The DOM and events","The **DOM** is the page as JavaScript sees it. `document.getElementById('id')` finds an element. Change its text with `.textContent`. An **event listener** runs a function when something happens, such as a click. This is how buttons, menus and forms come to life.",["getElementById finds an element","addEventListener reacts to clicks","textContent changes visible text"],`const btn = document.getElementById('btn');
btn.addEventListener('click', function () {
  document.getElementById('msg').textContent = 'Thank you!';
});`],
["Decisions and loops","`if` runs code only when a condition is true. `else` runs otherwise. A `for` loop repeats code a set number of times. Combine these with the DOM to build small tools such as counters, to-do lists and calculators.",["=== checks equal values","Use if and else to make decisions"],`let score = 70;
if (score >= 50) {
  console.log('Pass');
} else {
  console.log('Fail');
}`]
],
tip:"When something breaks, open the Console (F12). It usually tells you the line number of the error.",
practical:{t:"Click counter and greeting",goal:"Build a working counter button and a greeting form using JavaScript.",
code:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Practice</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 1rem; margin: 4px 0; }
    #count { font-size: 2rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>JavaScript practice</h1>
  <p>Count: <span id="count">0</span></p>
  <button id="plus">Add one</button>
  <button id="reset">Reset</button>
  <hr>
  <label for="who">Your name</label><br>
  <input type="text" id="who">
  <button id="hello">Greet me</button>
  <p id="greeting"></p>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('plus').addEventListener('click', function () {
      count = count + 1;
      countEl.textContent = count;
    });
    document.getElementById('reset').addEventListener('click', function () {
      count = 0;
      countEl.textContent = count;
    });
    document.getElementById('hello').addEventListener('click', function () {
      const name = document.getElementById('who').value.trim();
      document.getElementById('greeting').textContent =
        name ? 'Hello, ' + name + '! Welcome to Spoiad.' : 'Please type your name first.';
    });
  <\/script>
</body>
</html>`,
steps:["Create a new file named js-practice.html and paste the code on the left.","Open it in your browser. Click Add one several times and then Reset.","Type your name and click Greet me. Then click it again with an empty box.","Edit the code so the counter goes up by 5 instead of 1. Save and test.","Add a new button with id minus that subtracts one. Write the event listener yourself, copying the pattern of the plus button.","Open the Console (F12) and add console.log(count) inside the plus function to watch the value change."],
check:["The counter increases and resets correctly","The greeting appears with my name and warns when the box is empty","I changed the counter to add 5","I added a working minus button"]},
quiz:[["Which keyword creates a value that can change?",["let","const","if"],0],["What does addEventListener do?",["Runs code when an event like a click happens","Saves a file","Changes the font"],0],["How do you see error messages while testing?",["Browser Console (F12)","Task Manager","Notepad"],0]]},

{t:"Design principles",

["Contrast, alignment, repetition, proximity","Four simple rules fix most weak designs. **Contrast**: make important things clearly different in size, weight or colour. **Alignment**: line elements up to a shared edge or centre. **Repetition**: reuse the same colours, fonts and shapes. **Proximity**: put related items close together and unrelated ones apart.",["Contrast shows what matters most","Alignment makes a layout feel neat","Repetition builds a recognisable style","Proximity groups related information"]],
["Hierarchy and white space","Hierarchy tells the eye where to look first, second and third. Make the headline biggest, supporting text smaller, and details smallest. **White space** (empty space) is not wasted: it gives your design room to breathe and makes it feel professional. Crowded designs feel cheap and are hard to read.",["Headline, then subtitle, then details","Add margins around the edges","Remove anything that does not help the message"]],
["Know your purpose and audience","Before you open any tool, answer three questions: What is this for (event, product, announcement)? Who will see it (students, parents, customers)? What one action should they take (call, visit, buy, register)? Every choice then supports that single goal.",["One design, one main message","Put the call to action where it is easy to find"]]

{t:"Colour and typography",
learn:[
["Colour basics","The **colour wheel** shows relationships. Colours opposite each other (complementary) contrast strongly. Neighbouring colours (analogous) feel calm. Choose **one main colour, one accent and neutrals** (white, grey, black). Colours carry feeling: blue for trust, green for growth, red for urgency, yellow for energy.",["Use a maximum of three main colours","Check contrast: light text on dark or dark on light","Free palette tools: coolors.co and Canva colour palettes"]],
["Choosing fonts","Fonts fall into groups: **serif** (with small feet, like Times), **sans-serif** (clean, like Arial) and **display or script** (decorative). Pair a bold heading font with a simple body font. Never use more than two fonts. Use script or decorative fonts only for a few words, never for paragraphs.",["Headline: bold and large","Body text: simple and readable","Avoid ALL CAPS for long text"]],
["Spacing and readability","**Leading** is the space between lines: about 1.4 times the font size reads well. **Tracking** is the space between letters: widen it a little for small capitals. Keep line lengths short, left-align body text and avoid centring paragraphs.",["Use text size to show importance","Keep enough contrast between text and background"]]
],
tip:"If a piece looks wrong, try fewer colours and fewer fonts before anything else.",

["Elements, text and layers","The left panel has **Elements** (shapes, lines, graphics), **Text**, **Uploads** and **Background**. Click an item to move, resize or recolour it. Use **Position > Forward/Backward** to change which items sit on top. Use **Group** (Ctrl+G) to keep items together. Lock an item so you do not move it by accident.",["Hold Shift while resizing to keep proportions","Use the alignment guides that appear while dragging","Rename and organise by grouping"]],
["Images and exporting","Upload your own photos or use Canva's library. Use **Edit image** to crop, adjust and remove backgrounds. When finished, click **Share > Download**. Choose **PNG** for sharp graphics, **JPG** for photos and small files and **PDF Print** for printing. Tick Compress file if you need to send by WhatsApp.",["PNG: sharp logos and text","JPG: photos, smaller size","PDF: printing at a shop"]]
