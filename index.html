steps:["Choose a real or realistic process from Module 4 (order requests, enquiries, sign-ups or reminders).","Build the automation from trigger to action, including an AI step that drafts or classifies, with a human review step.","Create an FAQ assistant using the template on the left in your AI tool. Fill in the real business facts and test ten questions, including two it should not know.","Write a one-page document: the problem, the workflow (with a screenshot or diagram), how you tested it, the risks and how you reduce them.","Estimate the time saved per week and per month.","Show your project to someone and ask for feedback. Make one improvement and keep the document in your portfolio."],
check:["My automation runs end to end with a human review step","My FAQ assistant answers questions and admits when it is unsure","My document includes risks and time saved","I received feedback and made one improvement"]},
quiz:[["What should an FAQ assistant do when it does not know an answer?",["Tell the customer to contact you","Make something up","Stay silent"],0],["Which is part of using AI responsibly?",["Protecting private data","Sharing passwords","Never checking facts"],0],["What makes a strong portfolio project?",["A real problem solved with a measurable result","A blank page","Only screenshots of logos"],0]]}
]});

COURSES.push({id:"va",cat:"Business",title:"Virtual Assistant and Automation",color:"#0D9488",price:9000,level:"Beginner",hours:11,
blurb:"Learn to work as a professional virtual assistant: email, calendars, projects, automation and finding clients.",
outcome:"Offer professional virtual assistant services, use tools and automation to work faster, and find and keep your first clients.",
modules:[
{t:"What a virtual assistant does",
learn:[
["The job in plain words","A **virtual assistant (VA)** helps business owners and busy professionals with tasks, remotely, from anywhere with an internet connection. Instead of hiring a full-time employee, a client pays you for the help they need. You can work for people in your own city or around the world.",["Remote work, flexible hours","Paid by the hour, by task or monthly","Client keeps control, you save their time"]],
["Services you can offer","VAs do many things. **Admin support**: email, calendar, data entry, document formatting. **Customer support**: answering messages and orders. **Social media support**: scheduling posts, replying to comments. **Research**: finding information, lists and prices. **Bookkeeping basics**: tracking invoices and expenses. You do not need to offer everything. Start with 2 or 3 services you do well.",["Admin and email management","Customer support and chat","Social media scheduling","Research and data entry"]],
["Skills that matter most","Technical skills can be learned. What clients really pay for is reliability: you reply quickly, deliver on time, communicate clearly and pay attention to detail. Add good typing, comfort with Google Workspace or Microsoft 365, and the ability to learn new tools fast.",["Reliability and honesty","Clear communication","Attention to detail","Learning new tools quickly"]]
],
tip:"Choose a niche when you can: for example 'VA for small online shops' or 'VA for coaches'. Specialists get clients and higher pay faster.",
practical:{t:"Skills audit and service menu",goal:"Discover your strengths and decide which services to offer first.",
code:`My top 5 skills:
1.
2.
3.
4.
5.

Tools I already use (email, Docs, Sheets, WhatsApp, Canva...):

Three services I will offer first:
1.
2.
3.

Ideal client (who I want to help):`,
steps:["Copy the template on the left into a document and fill in your top five skills honestly.","List every tool you already use confidently and rate each from 1 to 5.","Choose three services from the lesson that match your skills.","Describe your ideal client in one sentence, for example 'small online business owners in Lagos who need help with orders and messages'.","Write one sentence that describes what you do: 'I help [client] with [service] so they can [benefit].'","Show your list to a friend and ask if they understand what you offer."],
check:["I listed five skills and my tools","I chose three starting services","I described my ideal client","I wrote a one-sentence description of what I do"]},
quiz:[["What does a virtual assistant do?",["Helps clients remotely with tasks","Builds houses","Repairs cars only"],0],["What do clients value most?",["Reliability and clear communication","Having the most followers","The longest CV"],0],["Why choose a niche?",["It makes finding clients easier","It is a legal rule","It is cheaper"],0]]},

{t:"Email, calendar and Google Workspace",
learn:[
["Manage an inbox like a pro","A full inbox is stress. Use **labels or folders** (Urgent, Waiting, Clients, Receipts), **filters** that sort emails automatically and **templates** (canned responses) for questions you answer repeatedly. Check email at set times, reply to quick ones immediately and move longer ones to your task list.",["Labels and folders for sorting","Filters automate sorting","Templates save typing"]],
["Calendars and scheduling","Learn to schedule meetings without confusion. Always confirm the **time zone** (Nigeria is WAT, UTC+1). Use Google Calendar colours for different clients, add video call links and set reminders. Tools such as Google Calendar appointment schedules or Calendly let clients book free slots themselves, which prevents long back-and-forth messages.",["Always confirm the time zone","Colour-code calendars","Booking links save time"]],
["Docs, Sheets and Drive","Most clients use Google Workspace. Organise Drive with clear folders: Client > Year > Project. Name files clearly, such as 2026-03-Invoice-ClientName. Understand sharing: Viewer (can only read), Commenter and Editor. Never share a file with 'Anyone with the link' unless the client agrees.",["Clear folder structure","Descriptive file names","Careful sharing permissions"]]
],
tip:"When you are unsure about a client's preference, ask once and write the answer in a client notes document. Never ask the same thing twice.",
practical:{t:"Set up a VA-ready inbox and calendar",goal:"Create labels, filters, templates and a time-blocked calendar.",
code:`Template 1 - Meeting request:
Hi [Name], thank you for reaching out. Here are three times that work for me: [times, WAT]. Please let me know which suits you.

Template 2 - Received and working:
Hi [Name], thank you. I have received your message and will update you by [time].

Template 3 - Invoice reminder:
Hi [Name], a friendly reminder that invoice [number] for [amount] is due on [date]. Please let me know if you need anything from me.`,
steps:["In Gmail create four labels: Urgent, Waiting for reply, Clients, Receipts.","Create two filters (Settings > Filters and blocked addresses) that apply a label automatically, for example anything from a certain sender gets the Clients label.","Turn on Templates in Gmail (Settings > Advanced) and save the three templates on the left.","In Google Calendar create three coloured calendars: Client A, Client B and Personal. Add a weekly time block called Admin hour.","Create a Drive folder structure: Clients > Client A > 2026 > Projects, with a Notes document inside.","Take a screenshot of your organised inbox, calendar and Drive for your portfolio."],
check:["My inbox has labels and two working filters","I saved three email templates","My calendar is colour-coded with time blocks","My Drive has a clear folder structure"]},
quiz:[["What does a filter do in email?",["Sorts emails automatically","Deletes your account","Makes emails louder"],0],["Why confirm the time zone when scheduling?",["To avoid meeting confusion","To change the language","To block spam"],0],["What is a good file name?",["2026-03-Invoice-ClientName","document1 final final","untitled"],0]]},

{t:"Task and project management",
learn:[
["Why tools matter","When you handle tasks for several clients, memory is not enough. A **task manager** shows what needs doing, who is doing it and when it is due. Popular free tools are **Trello** (visual boards), **Notion** (notes and tasks together) and **Asana** (projects and teams). Pick one and learn it well.",["Trello: boards and cards","Notion: notes, tasks and databases","Asana: team projects"]],
["Kanban boards","A **Kanban** board has columns that show progress, typically To Do, Doing, Waiting and Done. Each task is a card that moves across the columns. Add a due date, a checklist and notes to every card. Limit how many cards are in Doing so you finish tasks before starting new ones.",["To Do, Doing, Waiting, Done","Cards have due dates and checklists","Finish before starting new work"]],
["Prioritising and writing SOPs","Not everything is urgent. Sort tasks into **urgent and important** (do now), **important but not urgent** (schedule), **urgent but not important** (delegate or batch) and **neither** (drop). A **Standard Operating Procedure (SOP)** is a short step-by-step guide for a repeating task, so anyone (including you in six months) can do it the same way.",["Do now, schedule, delegate, drop","SOP: step-by-step guide","Write an SOP once, use it forever"]]
],
tip:"If a task takes less than two minutes, do it immediately. Otherwise put it on the board.",
practical:{t:"Build a client board and write an SOP",goal:"Create a project board for an imaginary client and document a repeating task.",
code:`SOP: Publish a weekly social media post
Goal: Post consistently every week with approved content.
Time needed: 30 minutes
Steps:
1. Open the content calendar and find this week's approved post.
2. Download the image from the shared Drive folder.
3. Copy the caption and check spelling.
4. Schedule the post for the agreed time.
5. Mark the task Done and notify the client.
Check: Confirm the post appears at the right time.`,
steps:["Create a free Trello (or Notion) account and a board named 'Client A - Small Business'.","Add four lists: To Do, Doing, Waiting for client, Done.","Create at least eight cards for typical VA tasks: reply to enquiries, update spreadsheet, schedule posts, book meetings. Add due dates and a checklist to three of them.","Use the priority idea to mark which cards are urgent and important with a red label.","Write your own SOP using the sample on the left for another repeating task.","Move a few cards through the board and take screenshots of the board and SOP for your portfolio."],
check:["My board has four lists and eight cards","Cards have due dates, labels or checklists","I wrote an SOP with clear steps","I have screenshots for my portfolio"]},
quiz:[["What does a Kanban board show?",["The progress of tasks across columns","Only the weather","Bank balances"],0],["What is an SOP?",["A step-by-step guide for a repeating task","A kind of email","A computer virus"],0],["Which tasks should you do first?",["Urgent and important ones","The easiest ones only","None"],0]]},

{t:"Communication and professionalism",
learn:[
["Communicate clearly and quickly","Clients hire you to make life easier. Reply within your agreed time (usually within a few hours on working days). Keep messages short and specific: what you did, what you need and when. Confirm instructions in writing: 'Just to confirm, you would like me to... by Friday. Is that correct?'",["Reply within the agreed time","Short, clear, specific","Confirm instructions in writing"]],
["Reports and updates","Send a short **daily or weekly report** so the client always knows what you did. Use the same format each time: Done, In progress, Needs your input, Next steps. Clients love not having to ask 'what is happening?' and it builds trust and long contracts.",["Done, In progress, Needs input, Next","Same format every time","Short and honest"]],
["Boundaries, privacy and mistakes","Keep **client information confidential**: never share passwords, files or conversations. Use a password manager or the client's approved method. Agree working hours and holidays. When you make a mistake, tell the client quickly, explain how you will fix it and how you will prevent it next time. Honesty keeps clients.",["Protect confidentiality","Agree working hours","Own mistakes quickly and fix them"]]
],
tip:"The best VAs make their clients feel calm: 'I have it handled and I will update you at 4 pm.'",
practical:{t:"Write your client communication pack",goal:"Create a welcome message, a daily report and a professional apology you can reuse.",
code:`WELCOME MESSAGE
Hi [Name], welcome! I am excited to work with you. Here is how I work:
- I reply to messages within [X hours] on [working days].
- I send a short update every [day / Friday].
- For urgent tasks, please message me on [WhatsApp].
To start, could you share: 1) your top three priorities, 2) tools I should access, 3) your preferred way of communicating?

DAILY REPORT
Done: [list]
In progress: [list]
Needs your input: [list]
Next steps: [list]

APOLOGY
Hi [Name], I made a mistake with [task]. I have already fixed it by [action]. To prevent this in future I will [change]. Thank you for your patience.`,
steps:["Copy the template on the left into a document and replace every bracket with details for an imaginary client.","Write a clear, polite version of each message in your own words.","Role-play: ask a friend to be the client. Send them your welcome message and a daily report and ask if anything was unclear.","Write a message politely refusing an unreasonable request, for example 'a task at 11 pm every night'.","List three confidentiality rules you will follow (for example, never share passwords).","Save the pack as VA-Communication-Pack for your portfolio."],
check:["I have a welcome message, a daily report and an apology template","A friend read them and understood clearly","I wrote a polite boundary message","I listed three confidentiality rules"]},
quiz:[["What belongs in a daily report?",["Done, in progress, needs input, next steps","Only jokes","Nothing"],0],["What should you do if you make a mistake?",["Tell the client, fix it and explain prevention","Hide it","Blame the client"],0],["Why confirm instructions in writing?",["To avoid misunderstandings","To make messages longer","It is a law"],0]]},

{t:"Automation for virtual assistants",
learn:[
["Work smarter, not longer","Automation lets you handle more work without more hours. It also makes you more valuable: clients pay well for people who can build systems. Start with the **time-wasters**: copying data between apps, sending the same reminder, sorting emails and saving attachments.",["Automate repeating tasks","Fewer mistakes, more time","Clients pay for systems that save them time"]],
["Quick wins that need no extra tools","Use **templates and canned responses** for common messages. Use **text shortcuts** (such as 'tyvm' expanding into a full thank-you message). Use **scheduled send** in Gmail and **scheduled posts** on social platforms. Set **recurring tasks** and calendar reminders for monthly invoices or weekly reports.",["Email templates","Schedule send and posts","Recurring tasks and reminders"]],
["Connect apps with Zapier or Make","Tools like Zapier and Make connect apps so they pass information automatically. Examples: new Google Form answer creates a Trello card; new email attachment is saved to Drive; new order in a sheet sends a notification. Always test with fake data and tell the client exactly what you automated and how to switch it off.",["Form to Trello card","Attachments saved to Drive automatically","Always document what you automate"]]
],
tip:"Never automate something you do not understand manually first. Do it by hand a few times, then automate it.",
practical:{t:"Build a form to Trello automation",goal:"Create a working workflow that turns new requests into task cards automatically.",
steps:["Create a Google Form called Client Request with questions: Your name, What do you need help with and Deadline. Link its responses to a Google Sheet.","Use your Trello board from Module 3 and create a list called New Requests.","Sign up for a free Zapier or Make account and create a workflow with trigger Google Sheets: New Row.","Add the action Trello: Create Card. Put the request text as the card name, the name and deadline in the description and choose the New Requests list.","Submit a test request and confirm that the card appears on the board with the right information.","Write a short 'How this works' note for your imaginary client, including how to switch it off, and save it in your portfolio."],
check:["A form submission creates a Trello card automatically","The card contains the request, name and deadline","I tested the workflow before using it","I wrote a how-it-works note"]},
quiz:[["What should you do before automating a task?",["Do it manually first and understand it","Automate everything at once","Skip testing"],0],["Which of these is a quick win automation?",["Email templates and scheduled send","Buying a new phone","Changing your name"],0],["What should you tell your client about an automation?",["What it does and how to switch it off","Nothing","Only the cost"],0]]},

{t:"Finding clients and setting your prices",
learn:[
["Build a simple profile and portfolio","Clients want proof you can help. Create a clean profile on LinkedIn and a one-page portfolio (Google Docs, Notion or a free website). Include who you help, your services, screenshots of your work (hide private details), your tools and a way to contact you. Use a professional photo and email address.",["Clear headline: 'VA for small online businesses'","Samples from your practicals","Easy contact: email and WhatsApp"]],
["Where to find clients","Start with people you know: shop owners, church or school administrators and small business owners. Tell them what you offer. Then look at online platforms such as LinkedIn, Upwork, OnlineJobs.ph and Facebook groups for business owners. Follow up politely. Be careful of scams: never pay to get a job, never accept cheques from strangers and be cautious of clients who refuse a call.",["Start with people you know","Use LinkedIn and freelance platforms","Never pay to get work"]],
["Prices, proposals and payment","Choose a pricing method: **hourly** (simple but limits growth), **package** (for example 10 hours per month) or **retainer** (fixed monthly fee). Start with a fair price, and increase it as your skills grow. A proposal states the problem, your solution, the price and the next step. Agree terms in writing, including payment dates, and use trusted payment methods such as bank transfer, Payoneer or Wise for international clients.",["Hourly, package or retainer","Proposal: problem, solution, price, next step","Agree everything in writing"]]
],
tip:"Ask your first two clients for a short testimonial. Real words from real clients are your best marketing.",
practical:{t:"Create your profile, proposal and price list",goal:"Prepare everything you need to pitch your first client.",
code:`PROPOSAL TEMPLATE
Hi [Name],
I noticed [specific problem or goal in their business].
I help [type of client] with [service] so they can [benefit].
My plan: 1) ... 2) ... 3) ...
Price: [package or hourly rate]
Next step: Reply to this message and I can start on [date].

Kind regards,
[Your name] | [WhatsApp] | [Portfolio link]`,
steps:["Write a headline and a three-sentence profile for LinkedIn describing who you help and how.","Create a one-page portfolio document with your service list, your tools, two or three samples from earlier modules and your contact details.","Design a price list with three packages (for example Starter, Standard, Premium) and describe what each includes.","Write a proposal using the template for one real or imaginary business.","Make a list of ten people or businesses you could contact this week and write a short, friendly message.","Send at least three of those messages and record the responses."],
check:["My profile has a clear headline and summary","My portfolio shows samples and contact details","I have a three-package price list","I sent at least three outreach messages"]},
quiz:[["Which pricing method is a fixed monthly fee?",["Retainer","Hourly","Free"],0],["Should you pay to get a job?",["Never","Always","Sometimes"],0],["What should a proposal include?",["Problem, solution, price and next step","Only a joke","Nothing"],0]]},

{t:"Launch your VA business: final project",
learn:[
["Set up your business basics","Choose a professional name (your own name works), open a separate bank account or mobile money wallet for business income and keep records of every payment and expense in a simple spreadsheet. Check local rules about registering a business and taxes as you earn more. Keep contracts and invoices for every client.",["Professional name and email","Separate money for business","Records of income and expenses"]],
["Do a sample project","The easiest way to get your first client is to show real work. Create a **mock project** for an imaginary business: organise their inbox, build a task board, write a communication pack, create a weekly content calendar and automate one process. Present it as a case study with before and after.",["Mock project proves your skills","Show before and after","Explain what the client gains"]],
["Discovery calls and your first month","A **discovery call** is a short chat where you ask about the client's needs. Prepare questions: what takes most of your time, which tools do you use, what would success look like? Then send a proposal within 24 hours. In your first month, deliver excellent work, communicate often and ask for feedback.",["Prepare questions in advance","Send a proposal within 24 hours","Over-deliver on the first month"]]
],
tip:"Be patient. Many VAs get their first paying client in the first one to three months of consistent effort. Keep contacting people every week.",
practical:{t:"Final project: your VA launch pack",goal:"Assemble a professional portfolio and practise a discovery call.",
code:`DISCOVERY CALL QUESTIONS
1. What does a normal week look like for you?
2. Which tasks take most of your time?
3. Which tasks do you dislike or keep delaying?
4. Which tools do you use now (email, WhatsApp, spreadsheets)?
5. What would a great result look like in 30 days?
6. When would you like to start and what is your budget?`,
steps:["Create one folder called VA-Launch-Pack in Google Drive.","Add your profile, price list and proposal template from Module 6, and your communication pack from Module 4.","Add a case study for a mock client: before and after screenshots of the inbox, the Trello board, your SOP and the form-to-Trello automation, with one paragraph about the result.","Write a one-page 'How I work' document with your working hours, response times and tools.","Practise a 10-minute discovery call with a friend using the questions on the left. Ask for honest feedback.","Contact five real prospects with your best message and record your next steps in a tracking sheet."],
check:["My launch pack folder is complete and organised","My case study shows before and after results","I practised a discovery call and got feedback","I contacted five prospects and recorded the results"]},
quiz:[["What is a discovery call?",["A short chat to understand a client's needs","A phone repair","A type of invoice"],0],["Why make a mock project?",["To show real work before you have clients","To waste time","It is required by law"],0],["How soon should you send a proposal after a call?",["Within 24 hours","After one year","Never"],0]]}
]});

COURSES.push({id:"uiux",cat:"Tech and creative",title:"UI/UX Design",color:"#E11D48",price:10000,level:"Beginner",hours:12,
blurb:"Design apps and websites people love to use, from research to Figma prototypes and a portfolio case study.",
outcome:"Research users, sketch and design screens in Figma, build a clickable prototype, test it with real people and present a portfolio case study.",
modules:[
{t:"What UX and UI are, and the design process",
learn:[
["UX and UI explained","**UX (user experience)** is how an app or website works and feels to use: is it easy, fast and pleasant? **UI (user interface)** is how it looks: colours, buttons, text and icons. Think of a car: UX is how comfortable and easy it is to drive, UI is the dashboard, seats and paint. A beautiful app that confuses people is bad design. A plain app that works well can still be good design.",["UX: how it works and feels","UI: how it looks","Both are needed for great products"]],
["The design process","Designers follow a process so they solve the right problem. **Empathise**: understand the users. **Define**: state the problem clearly. **Ideate**: think of many solutions. **Prototype**: build a quick version. **Test**: try it with real people and improve. This loop repeats until the design works well.",["Empathise, Define, Ideate, Prototype, Test","It is a loop, not a straight line","Users guide every decision"]],
["What a designer does","UI/UX designers research users, sketch ideas, make screens in tools like Figma, create clickable prototypes, test them and work with developers. Some people focus on research, others on visuals. Good designers listen more than they talk and are happy to be proven wrong by users.",["Research and testing","Wireframes and prototypes","Visual design","Working with developers"]]
],
tip:"You are not the user. Whatever feels obvious to you may confuse someone else. Always test.",
practical:{t:"Critique an app you use every day",goal:"Learn to see design decisions by evaluating a real app.",
code:`App or website:
What is its main purpose?
Three things that work well (and why):
1.
2.
3.
Three things that are confusing or annoying (and why):
1.
2.
3.
One improvement I would make first:`,
steps:["Choose an app you use often, such as WhatsApp, a banking app, a food delivery app or a school portal.","Copy the template on the left into a document.","Complete one common task in the app (for example, send a message or order food). Count how many taps it takes.","Fill in three good points and three problems. Be specific: 'The button is too small' is better than 'It is bad'.","Take screenshots of the best and worst screens and mark them with arrows or notes.","Write one sentence on whether each problem is mainly UX or UI."],
check:["I completed the template for a real app","I counted the steps for one task","I included screenshots with notes","I labelled problems as UX or UI"]},
quiz:[["What does UX focus on?",["How the product works and feels to use","Only colours","Only code"],0],["Which step comes after Ideate in the design process?",["Prototype","Define","Empathise"],0],["Who guides design decisions?",["The users","Only the designer's taste","Nobody"],0]]},

{t:"User research: understand your users",
learn:[
["Why research first","Many apps fail because the team built what they imagined, not what people needed. Research helps you discover real problems before you design anything. You do not need a lab: talking to three to five real people already teaches a huge amount.",["Learn problems before solutions","5 users reveal most issues","Listen more than you speak"]],
["Interviews and surveys","In an **interview**, ask open questions that start with 'How', 'Why' or 'Tell me about the last time...'. Do not suggest answers. Listen, take notes and ask 'Why?' repeatedly. **Surveys** (for example in Google Forms) reach more people but with less depth. Combine both when you can.",["Open questions: Tell me about the last time you...","Do not ask leading questions","Surveys: more people, less depth"]],
["Personas and problem statements","A **persona** is a fictional but realistic user built from your research: name, age, goals, frustrations and habits. A **problem statement** puts the real need into one sentence: '[Persona] needs a way to [goal] because [reason].' These keep the whole project focused.",["Persona: a realistic example user","Problem statement: one sentence","Base them on real answers, not guesses"]]
],
tip:"Never ask 'Would you use an app that does X?' People say yes to be polite. Ask what they do today.",
practical:{t:"Interview three people and create a persona",goal:"Do real user research and turn it into a persona and problem statement.",
code:`INTERVIEW QUESTIONS (ordering food on campus or at work)
1. Tell me about the last time you ordered food. What happened?
2. How do you usually decide what and where to order?
3. What was the most frustrating part?
4. What do you do when an order is late or wrong?
5. What would make it much easier?

PERSONA
Name / age / job:
Goals:
Frustrations:
Habits:

PROBLEM STATEMENT
[Persona] needs a way to [goal] because [reason].`,
steps:["Pick a simple topic for the course project, such as ordering food, booking a tutor or paying school fees. Keep the same topic for all modules.","Adapt the interview questions on the left to your topic.","Interview three different people for about 10 minutes each. Take notes (ask permission first).","Underline repeated problems and surprising answers in your notes.","Create a persona using the template, based on the patterns in your notes. Add a photo or drawing.","Write your problem statement and share it with one interview participant to check that it feels true."],
check:["I interviewed three real people and kept notes","I found at least three patterns or problems","I created a persona from my findings","I wrote a clear problem statement"]},
quiz:[["Which is a good interview question?",["Tell me about the last time you ordered food","Don't you love fast apps?","Would you use my idea?"],0],["What is a persona?",["A realistic example user built from research","A logo","A colour"],0],["How many interviews already give useful insights?",["About 3 to 5","Exactly 1,000","None"],0]]},

{t:"User flows and wireframes",
learn:[
["Plan the journey with a user flow","A **user flow** shows the steps a person takes to complete a task, from start to finish, including decisions. Draw it with boxes and arrows: Open app, Search food, Choose item, Add to cart, Pay, Confirm. Spot extra or confusing steps and remove them. Fewer steps usually means a better experience.",["Boxes for screens, diamonds for decisions","Remove unnecessary steps","Start with the user's goal"]],
["Wireframes: sketch before you design","A **wireframe** is a simple black-and-white layout that shows where things go, without colours or images. Sketch on paper first. It is fast, cheap and easy to change. Techniques like **Crazy 8s** (sketch 8 ideas in 8 minutes) help you explore many solutions quickly and avoid getting stuck on the first idea.",["Paper first, always","Crazy 8s: 8 ideas in 8 minutes","Focus on layout and content, not looks"]],
["Information architecture and navigation","**Information architecture (IA)** is how content is organised and labelled. Group related things together, use words users understand and keep the main navigation to five items or fewer. On mobile, a **bottom navigation bar** is easy to reach with a thumb. Make sure users always know where they are and how to go back.",["Group similar things","Use familiar labels","Max five main navigation items","Always show a way back"]]
],
tip:"Draw with a thick marker. Thick lines stop you from adding unnecessary details.",
practical:{t:"Draw a user flow and four wireframes",goal:"Plan the journey and sketch key screens for your project.",
steps:["Write the main task for your project, for example 'A student orders lunch in under one minute'.","Draw the user flow on paper: every screen and decision from opening the app to the confirmation.","Do a Crazy 8s round for the home screen: fold a paper into eight boxes and sketch eight different layouts in eight minutes.","Choose your best home screen idea and sketch three more screens: item details, cart and confirmation.","Add short notes to each wireframe explaining what the button or section does.","Show your sketches to one person and ask them to say where they would tap first. Note any confusion and adjust."],
check:["My user flow shows every step of the main task","I did a Crazy 8s round","I sketched four connected wireframes","I tested my sketches with at least one person"]},
quiz:[["What is a wireframe?",["A simple layout sketch without colours","A finished design","A database"],0],["What is Crazy 8s?",["Sketching 8 ideas in 8 minutes","A game level","A colour code"],0],["How many main navigation items is it best to keep?",["Five or fewer","Fifteen","Fifty"],0]]},

{t:"Visual design for interfaces",
learn:[
["Layout, grids and spacing","Good UI feels calm and organised. Use a **grid** to line things up and an **8-point spacing system**: all spacing is a multiple of 8 (8, 16, 24, 32). Group related items closely and leave more space between groups. White space is not wasted: it gives the eye room to rest and makes content easier to read.",["Use an 8-point spacing system","Align everything to a grid","White space improves clarity"]],
["Type and colour for screens","Use one or two fonts. Body text should be at least **16 px** on mobile. Create a clear hierarchy with 3 to 4 text sizes. For colour, use the **60-30-10 rule**: 60 percent neutral, 30 percent secondary and 10 percent accent colour for buttons and highlights. Check **contrast**: normal text needs a contrast ratio of at least 4.5 to 1 against its background.",["Body text 16 px or bigger","60-30-10 colour rule","Contrast ratio at least 4.5:1"]],
["Buttons, forms and consistency","Buttons should look pressable and have clear labels such as 'Place order' (not 'Submit'). Make touch targets at least **44 x 44 px**. Show clear states: normal, pressed, disabled and error. In forms, put the label above the field and explain errors in plain words. **Consistency** means the same thing always looks and works the same way.",["Touch targets 44 x 44 px or bigger","Clear button labels","Consistent states and spacing"]]
],
tip:"Use only one primary button per screen. If everything stands out, nothing does.",
practical:{t:"Create a mini style guide",goal:"Define the colours, type, spacing and buttons for your project before designing screens.",
code:`STYLE GUIDE
Brand name:
Primary colour (10%):          Hex:
Secondary colour (30%):        Hex:
Neutral colours (60%):         Hex:
Error colour / Success colour: Hex:
Heading font:                  Size:
Body font:                     Size (min 16):
Spacing unit:                  8 px
Button: height 48 px, corner radius __ px, label style:
Input field: height 48 px, label above, border colour:`,
steps:["Copy the template on the left into a document or onto a Figma page.","Choose a primary colour that suits your project (for example orange for food) and pick a secondary and neutral set.","Test text colour against background with a free contrast checker such as webaim.org/resources/contrastchecker and adjust until it passes 4.5:1.","Choose one or two fonts from fonts.google.com and set heading and body sizes.","Draw or write the specifications for a primary button, a secondary button and an input field.","Check your style guide against the 60-30-10 rule and ask a friend if the style feels right for your users."],
check:["My style guide has colours, fonts, spacing and components","My text colours pass the contrast check","I used an 8-point spacing unit","My buttons are at least 44 px high"]},
quiz:[["What is a good minimum body text size on mobile?",["16 px","6 px","Whatever fits"],0],["What does the 60-30-10 rule describe?",["How to share colours","How to price apps","How to write code"],0],["What is a good touch target size?",["At least 44 x 44 px","10 x 10 px","1 x 1 px"],0]]},

{t:"Figma basics: design your screens",
learn:[
["Getting started with Figma","**Figma** is a free design tool that runs in the browser (figma.com). Create an account, then click New design file. The **canvas** is the large working area. On the left you will find **layers** and on the right the **properties panel**. Use the toolbar at the top for the Frame, Shape, Pen and Text tools. Press **F** for Frame, **R** for Rectangle, **T** for Text.",["F frame, R rectangle, T text","Layers on the left, properties on the right","Zoom with Ctrl and scroll"]],
["Frames, shapes and text","A **frame** is like a screen or artboard. Choose a phone preset (for example iPhone 14) from the right panel. Draw rectangles for cards and buttons, add rounded corners and fill colours. Use the Text tool for headings and labels. Hold **Shift** to keep shapes proportional, and use the smart guides (pink lines) to align neatly.",["Frames = screens","Corner radius for friendly buttons","Smart guides help alignment"]],
["Auto layout and components","**Auto layout** (Shift+A) makes a frame resize and space its contents automatically, like a button that grows when the text is longer. A **component** (Ctrl+Alt+K) is a reusable element. Create a button once, turn it into a component and use copies everywhere. Change the main component and every copy updates. Use **styles** to save colours and text sizes.",["Shift+A: auto layout","Ctrl+Alt+K: create component","Styles keep your design consistent"]]
],
tip:"Name your layers and frames clearly (Login screen, Primary button). It saves time later and impresses recruiters.",

const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');

const priceOf = c => { const p=S.settings&&S.settings.prices&&S.settings.prices[c.id]; return (p!==undefined&&p!==null&&p!==''&&Number.isFinite(+p))?+p:c.price; };
const amountOf = (c,e) => (e&&e.amount!=null&&Number.isFinite(+e.amount))?+e.amount:(c?priceOf(c):0);
const payCfg = () => Object.assign({},CONFIG.payment,(S.settings&&S.settings.payment)||{});

const ftime = d => new Date(d).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function ago(d){
  if(!d) return 'Never';
  const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60) return 'Just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' h ago';
  if(s<604800) return Math.floor(s/86400)+' d ago';
  return fdate(d);
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const code = () => 'SPD-'+Math.random().toString(36).slice(2,8).toUpperCase();
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const totalModules = COURSES.reduce((s,c)=>s+c.modules.length,0);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),3200); }
function go(h){ if(location.hash===h) route(); else location.hash=h; }
async function hash(s){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('spoiad:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  return btoa(unescape(encodeURIComponent('spoiad:'+s)));
}

const remote = {
  async session(){
    const { data:{ session } } = await sb.auth.getSession(); if(!session) return null;
    const p = await remote.profile(session.user.id);
    if(!p){ await new Promise(r=>setTimeout(r,600)); return remote.profile(session.user.id); }
    return p;
  },
  async profile(id){ const { data } = await sb.from('profiles').select('*').eq('id',id).maybeSingle(); return data||null; },
  async touch(){ try{ await sb.rpc('touch_me'); }catch(e){} },
  async signUp(name,email,pw){
    const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ data:{ name } } });
    if(error) return { error:error.message };
    return data.session ? {} : { confirm:true };
  },
  async signIn(email,pw){
    const { error } = await sb.auth.signInWithPassword({ email, password:pw });
    if(error) return { error:/confirm/i.test(error.message)?'Confirm your email first, then log in.':'Email or password is incorrect.' };
    return {};
  },
  async signOut(){ await sb.auth.signOut(); },
  async enrols(pid){ const { data } = await sb.from('enrollments').select('*').eq('user_id',pid); return data||[]; },
  async register(pid,cid){ const { error } = await sb.from('enrollments').insert({ user_id:pid, course_id:cid, ref:code() }); return { error:error&&error.message }; },
  async update(id,upd){ const { error } = await sb.from('enrollments').update(upd).eq('id',id); return { error:error&&error.message }; },
  async cancel(id){ const { error } = await sb.from('enrollments').delete().eq('id',id); return { error:error&&error.message }; },
  async log(pid,type,cid,detail){ try{ await sb.from('activity').insert({ user_id:pid, type, course_id:cid||null, detail:detail||null }); }catch(e){} },
  async adminData(){
    const [p,e,a] = await Promise.all([
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('enrollments').select('*').order('created_at',{ascending:false}),
      sb.from('activity').select('*').order('created_at',{ascending:false}).limit(500)
    ]);
    const err=p.error||e.error||a.error;
    return { profiles:p.data||[], enrols:e.data||[], activity:a.data||[], error:err&&err.message };
  },
  async setStatus(id,status){ const { error } = await sb.rpc('set_enrollment_status',{ p_id:id, p_status:status }); return { error:error&&error.message }; },
  async setLocked(id,locked){ const { error } = await sb.rpc('set_account_locked',{ p_user:id, p_locked:locked }); return { error:error&&error.message }; },
  async getSettings(){ const { data } = await sb.from('settings').select('key,value'); const o={}; (data||[]).forEach(r=>o[r.key]=r.value); return o; },
  async setSetting(key,value){ const { error } = await sb.rpc('set_setting',{ p_key:key, p_value:value }); return { error:error&&error.message }; },
  async verifyCert(id){
    const { data, error } = await sb.rpc('verify_certificate',{ p_cert:String(id||'').trim() });
    if(error||!data||!data.length) return null;
    const r=data[0]; return { name:r.student_name, course_id:r.course_id, completed_at:r.completed_at, cert_id:String(id).trim().toUpperCase() };
  }
};

const LDB = {
  get(){ try{ const d=JSON.parse(localStorage.getItem('spoiad_db'))||{}; return { users:d.users||[], enrols:d.enrols||[], activity:d.activity||[], settings:d.settings||{} }; }catch{ return {users:[],enrols:[],activity:[],settings:{}}; } },
  set(d){ localStorage.setItem('spoiad_db',JSON.stringify(d)); }
};
const pub = u => u && ({ id:u.id, name:u.name, email:u.email, role:u.role, locked:!!u.locked, last_seen:u.last_seen||null, created_at:u.created_at });
const local = {
  async session(){
    const id=localStorage.getItem('spoiad_sess'); const d=LDB.get(); const u=d.users.find(x=>x.id===id);
    if(!u) return null; u.last_seen=new Date().toISOString(); LDB.set(d); return pub(u);
  },
  async profile(id){ return pub(LDB.get().users.find(u=>u.id===id)) || null; },
  async touch(){},
  async signUp(name,email,pw){
    const d=LDB.get();
    if(d.users.some(u=>u.email===email)) return { error:'An account with this email already exists. Log in instead.' };
    const u={ id:uid(), name, email, pw:await hash(pw), role:d.users.length?'student':'admin', locked:false, last_seen:new Date().toISOString(), created_at:new Date().toISOString() };
    d.users.push(u); d.activity.push({ id:uid(), user_id:u.id, type:'signup', course_id:null, detail:null, created_at:u.created_at });
    LDB.set(d); localStorage.setItem('spoiad_sess',u.id); return {};
  },
  async signIn(email,pw){
    const u=LDB.get().users.find(x=>x.email===email);
    if(!u||u.pw!==await hash(pw)) return { error:'Email or password is incorrect.' };
    localStorage.setItem('spoiad_sess',u.id); return {};
  },
  async signOut(){ localStorage.removeItem('spoiad_sess'); },
  async enrols(pid){ return LDB.get().enrols.filter(e=>e.user_id===pid); },
  async register(pid,cid){
    const d=LDB.get(); if(d.enrols.some(e=>e.user_id===pid&&e.course_id===cid)) return { error:'Already registered.' };
    d.enrols.push({ id:uid(), user_id:pid, course_id:cid, status:'pending', ref:code(), amount:priceOf(course(cid)||{price:0}), done:[], progress:{}, cert_id:null, completed_at:null, last_activity:null, created_at:new Date().toISOString() });
    LDB.set(d); return {};
  },
  async update(id,upd){ const d=LDB.get(); const e=d.enrols.find(x=>x.id===id); if(e) Object.assign(e,upd); LDB.set(d); return {}; },
  async cancel(id){ const d=LDB.get(); d.enrols=d.enrols.filter(e=>e.id!==id); LDB.set(d); return {}; },
  async log(pid,type,cid,detail){ const d=LDB.get(); d.activity.push({ id:uid(), user_id:pid, type, course_id:cid||null, detail:detail||null, created_at:new Date().toISOString() }); LDB.set(d); },
  async adminData(){
    const d=LDB.get();
    return { profiles:d.users.map(pub).reverse(), enrols:d.enrols.slice().reverse(), activity:d.activity.slice().reverse().slice(0,500) };
  },
  async setStatus(id,status){
    const d=LDB.get(); const e=d.enrols.find(x=>x.id===id); if(!e) return { error:'Not found' };
    e.status=status;
    d.activity.push({ id:uid(), user_id:e.user_id, type:status==='active'?'payment_confirmed':'payment_revoked', course_id:e.course_id, detail:'by admin', created_at:new Date().toISOString() });
    LDB.set(d); return {};
  },
  async setLocked(id,locked){
    const d=LDB.get(); const u=d.users.find(x=>x.id===id); if(!u) return { error:'Not found' };
    if(u.role==='admin') return { error:'You cannot lock an admin account' };
    u.locked=locked;
    d.activity.push({ id:uid(), user_id:id, type:locked?'account_locked':'account_unlocked', course_id:null, detail:'by admin', created_at:new Date().toISOString() });
    LDB.set(d); return {};
  },
  async getSettings(){ return LDB.get().settings||{}; },
  async setSetting(key,value){ const d=LDB.get(); d.settings=d.settings||{}; d.settings[key]=value; LDB.set(d); return {}; },
  async verifyCert(id){
    const d=LDB.get(); const cid=String(id||'').trim().toUpperCase();
    const e=d.enrols.find(x=>x.cert_id===cid&&x.status==='active'); if(!e) return null;
    const u=d.users.find(x=>x.id===e.user_id);
    return { name:u?u.name:'', course_id:e.course_id, completed_at:e.completed_at, cert_id:cid };
  }
};

async function loadMe(){
  S.profile = await API.session();

async function loadSettings(){ try{ S.settings = (await API.getSettings()) || {}; }catch(e){ S.settings = S.settings || {}; } }
async function refreshMe(){
  if(!S.profile) return;
  const p = await API.profile(S.profile.id);
  if(!p){ await API.signOut(); S.profile=null; S.enrols={}; return; }
  S.profile = p; S.enrols = {};
  if(!p.locked){ (await API.enrols(p.id)).forEach(e=>S.enrols[e.course_id]=e); await loadSettings(); }
}

function qrSvg(text,x,y,size){
  try{
    if(typeof qrcode!=='function') return '';
    const q=qrcode(0,'M'); q.addData(text); q.make();
    const n=q.getModuleCount(), m=2, tot=n+m*2; let d='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
    return `<g transform="translate(${x},${y}) scale(${(size/tot).toFixed(4)})"><rect width="${tot}" height="${tot}" fill="#fff"/><path d="${d}" fill="#0E1B33"/></g>`;
  }catch(e){ return ''; }
}

function actText(a,byId){

    case 'signup': return `${who} created an account`;

const feedHtml = (list,byId) => list.length?`<ul class="feed">${list.map(a=>`<li><span class="dot ${dotClass(a.type)}"></span><div><div>${actText(a,byId)}</div><div class="note" title="${esc(ftime(a.created_at))}">${ago(a.created_at)}</div></div></li>`).join('')}</ul>`:'<p class="empty">No activity yet.</p>';

function adminTabs(a){
  const t=[['','Overview'],['students','Students'],['payments','Payments'],['activity','Activity'],['settings','Settings']];
  return `<div class="tabs2">${t.map(x=>`<a href="#/admin${x[0]?'/'+x[0]:''}" class="${a===x[0]?'on':''}">${x[1]}</a>`).join('')}</div>`;
}
function adminCtx(d){
  const byId={}; d.profiles.forEach(p=>byId[p.id]=p);
  const students=d.profiles.filter(p=>p.role!=='admin');
  const pending=d.enrols.filter(e=>e.status==='pending'), active=d.enrols.filter(e=>e.status==='active');
  const completed=d.enrols.filter(e=>e.status==='active'&&course(e.course_id)&&e.done.length>=course(e.course_id).modules.length);
  const week=Date.now()-7*86400000;
  const activeWeek=students.filter(p=>p.last_seen&&new Date(p.last_seen).getTime()>week).length;
  const revenue=active.reduce((s,e)=>s+amountOf(course(e.course_id),e),0);
  return { byId, students, pending, active, completed, activeWeek, revenue };
}

};

/* =========================================================
   Motion: scroll reveal, counters, rotating words, confetti
   ========================================================= */
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function countUp(el,to,suf){
  const dur=1100, t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/dur), v=Math.round(to*(1-Math.pow(1-k,3))); el.textContent=v+suf; if(k<1) requestAnimationFrame(f); })(t0);
}
function setupMotion(){
  if(reduceMotion() || !('IntersectionObserver' in window)) return;
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    const el=en.target; io.unobserve(el);
    if(el._num) countUp(el,el._num.to,el._num.suf);
    else { el.classList.add('in'); setTimeout(()=>{ el.style.transitionDelay=''; },1200); }
  }),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('#app .strip b, #app .stat b').forEach(el=>{
    const t=el.textContent.trim(); if(!/^\d+%?$/.test(t)) return;
    el._num={ to:parseInt(t,10), suf:t.endsWith('%')?'%':'' }; el.textContent='0'+el._num.suf; io.observe(el);
  });
  const sel='.page-head,.sec-head,.grid>*,.steps li,.feat>div,.band,.certprev>*,details,.two>*,.contact>*,.stat,.pcard';
  document.querySelectorAll('#app '+sel).forEach(el=>{
    if(el.closest('.hero')) return;
    const i=Array.prototype.indexOf.call(el.parentElement.children,el);
    el.classList.add('reveal'); el.style.transitionDelay=Math.min(i,8)*70+'ms'; io.observe(el);
  });
}
function startRot(){
  clearInterval(S.rotT);
  const el=$('#rot'); if(!el||reduceMotion()) return;
  let i=0;
  S.rotT=setInterval(()=>{
    if(!document.body.contains(el)){ clearInterval(S.rotT); return; }
    el.classList.add('out');
    setTimeout(()=>{ i=(i+1)%COURSES.length; el.textContent=COURSES[i].title; el.classList.remove('out'); },320);
  },2600);
}
function confetti(){
  if(reduceMotion()) return;
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#FFB400','#0F8B8D','#6D28D9','#BE185D','#157F4B'];
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%'; p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*0.9)+'s'; p.style.animationDuration=(2+Math.random()*2)+'s';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5200);
}

const TITLES = { courses:'Courses', about:'About', faq:'FAQ', contact:'Contact', login:'Log in', signup:'Create account', my:'My learning', admin:'Admin', learn:'Learn', cert:'Certificate', course:'Course', verify:'Verify a certificate' };
function paint(h,html,page){
  $('#shell').innerHTML = header(h) + `<div id="app" tabindex="-1">${html}</div>` + footer();
  const c = page==='course' ? course(h.split('/')[2]) : null;
  document.title = (c?c.title:(TITLES[page]||'Learn digital skills you can use')) + ' — ' + CONFIG.brand;
  window.scrollTo(0,0);
  bind();
  setupMotion();
  startRot();
  if(page==='cert' && S.celebrate){ S.celebrate=false; confetti(); }
}
async function route(){
  const tok=++routeTok;
  const h=location.hash.replace(/^#/,'')||'/';
  const [,page,a,b]=h.split('/');
  const guarded=['my','learn','cert','admin'];

  if(guarded.includes(page) && !S.profile){ S.returnTo='#'+h; location.hash='#/login'; return; }
  if((page==='login'||page==='signup') && S.profile){ location.hash='#/my'; return; }

  let html;
  if(S.profile && (guarded.includes(page)||['course','courses'].includes(page))){
    await refreshMe(); if(tok!==routeTok) return;
    if(!S.profile){ location.hash='#/login'; return; }
  }
  if(S.profile && S.profile.locked && (guarded.includes(page)||page==='course')){
    paint(h,viewLocked(),page); return;
  }
  if(page==='verify'){
    if(a){
      paint(h,loading('Checking certificate…'),page);
      const res=await API.verifyCert(decodeURIComponent(a)); if(tok!==routeTok) return;
      paint(h,viewVerify(decodeURIComponent(a),res),page);
    } else paint(h,viewVerify('',null),page);
    return;
  }
  if(page==='admin'){
    if(S.profile.role!=='admin') html=notFound();
    else {
      paint(h,loading('Loading students…'),page);
      const d=await API.adminData(); if(tok!==routeTok) return;
      S.ad=d;
      if(d.error) html=`<main><div class="wrap"><div class="panel"><h2>Could not load data</h2><p style="margin:.6rem 0">${esc(d.error)}</p><p class="note">Check that you ran the latest schema.sql and set your account as admin.</p></div></div></main>`;
      else if(!a) html=viewAdminOverview(d);
      else if(a==='students') html=viewAdminStudents(d);
      else if(a==='payments') html=viewAdminPayments(d);
      else if(a==='activity') html=viewAdminActivity(d);
      else if(a==='settings') html=viewAdminSettings();
      else if(a==='student') html=viewAdminStudent(d,b);
      else html=notFound();
    }
  } else {
    if(h==='/') html=viewHome();
    else if(page==='courses') html=viewCourses();
    else if(page==='course') html=viewCourse(a);
    else if(page==='about') html=viewAbout();
    else if(page==='faq') html=viewFaq();
    else if(page==='contact') html=viewContact();
    else if(page==='login') html=viewAuth('login');
    else if(page==='signup') html=viewAuth('signup');
    else if(page==='my') html=viewMy();
    else if(page==='learn') html=viewLearn(a,parseInt(b||'0',10)||0);
    else if(page==='cert') html=viewCert(a);
    else html=notFound();
  }
  paint(h,html,page||'home');
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){} ta.remove(); return Promise.resolve();
}

function updateReady(){
  const btn=$('#complete'); if(!btn) return;
  const parts=location.hash.split('/'), id=parts[2], idx=parseInt(parts[3]||'0',10)||0;
  const c=course(id), e=S.enrols[id]; if(!c||!e) return;
  const m=c.modules[idx]; if(!m) return;
  const s=mstate(e,idx), n=m.practical.check.length, need=[];
  if(s.c.length<n) need.push(`tick all practical results (${s.c.length} of ${n})`);
  if(!(s.q!=null&&s.q>=passAt(m))) need.push(`pass the quiz (${passAt(m)} of ${m.quiz.length} correct)`);
  const ok=e.done.includes(idx)||!need.length;
  btn.disabled=!ok;
  $('#needs').textContent = ok ? '' : 'To complete this module: '+need.join(' and ')+'.';
}

function bindQuiz(m,idx,e,id){
  const g=$('#gradeQuiz'); if(!g) return;
  g.onclick=async()=>{
    const picks=[];
    for(let qi=0;qi<m.quiz.length;qi++){
      const r=document.querySelector(`input[name="q${qi}"]:checked`);
      if(!r){ toast('Answer every question first.'); return; }
      picks.push(+r.value);
    }
    let score=0;
    m.quiz.forEach((x,qi)=>{
      const ok=picks[qi]===x[2]; if(ok) score++;
      document.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>{
        const lab=inp.closest('.opt'); lab.classList.remove('good','bad');
        if(+inp.value===x[2]) lab.classList.add('good'); else if(inp.checked) lab.classList.add('bad');
        inp.disabled=true;
      });
    });
    const pass=score>=passAt(m), res=$('#quizResult');
    res.className='result '+(pass?'good':'bad');
    res.textContent = pass ? `You scored ${score} of ${m.quiz.length}. Passed!` : `You scored ${score} of ${m.quiz.length}. You need ${passAt(m)} to pass. Green shows the right answers, so review and try again.`;
    g.textContent='Try again';
    g.onclick=()=>{ $('#quizBox').innerHTML=quizHtml(m,mstate(e,idx)); bindQuiz(m,idx,e,id); };
    const prev=mstate(e,idx).q, best=prev==null?score:Math.max(prev,score);
    const p=JSON.parse(JSON.stringify(e.progress||{})); const cur=p[idx]||{c:[],q:null}; cur.q=best; p[idx]=cur;
    await saveEnrol(e,{ progress:p, last_activity:new Date().toISOString() });
    logAct('quiz',id,`${m.t}|${score}/${m.quiz.length}`);
    updateReady();
  };
}

  });

  document.querySelectorAll('[data-copytext]').forEach(b=>b.onclick=async()=>{

  });

  if(vf) vf.onsubmit=ev=>{ ev.preventDefault(); const v=$('#vid').value.trim().toUpperCase(); if(v) go('#/verify/'+encodeURIComponent(v)); };

  const cf=$('#contactForm');
  if(cf) cf.onsubmit=e=>{ e.preventDefault(); const n=$('#cn').value.trim(), m=$('#cm').value.trim(); window.open(waGeneral(`Hello ${CONFIG.brand}, my name is ${n}.\n\n${m}`),'_blank','noopener'); };

  /* auth */

  if(sp) sp.onclick=()=>{ const i=$('#pw'); const show=i.type==='password'; i.type=show?'text':'password'; sp.textContent=show?'Hide':'Show'; };
  const f=$('#authForm');
  if(f) f.onsubmit=async ev=>{
    ev.preventDefault();
    const mode=f.dataset.mode, msg=$('#msg'), btn=$('#authBtn'); msg.className='msg'; msg.textContent='';
    const email=$('#email').value.trim().toLowerCase(), pw=$('#pw').value;
    if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent='Enter a valid email address.'; return; }
    if(pw.length<6){ msg.textContent='Password must be at least 6 characters.'; return; }
    btn.disabled=true;
    try{
      let r;
      if(mode==='signup'){
        const name=$('#name').value.trim();
        if(name.length<2){ msg.textContent='Enter your full name.'; return; }
        r=await API.signUp(name,email,pw);
      } else r=await API.signIn(email,pw);
      if(r.error){ msg.textContent=r.error; return; }
      if(r.confirm){ msg.className='msg good'; msg.textContent='Account created. Check your email to confirm it, then log in.'; return; }
      await loadMe();
      if(!S.profile){ msg.textContent='Could not load your profile. Run schema.sql in Supabase and try again.'; return; }
      if(mode==='login') logAct('login');
      toast(S.profile.locked?'Your account is locked.':(mode==='signup'?'Account created. Welcome to '+CONFIG.brand+'!':'Welcome back, '+S.profile.name.split(' ')[0]+'.'));
      const to=S.returnTo||'#/my'; S.returnTo=null; go(to);
    } finally { btn.disabled=false; }
  };

  /* enrolment */
  const cid=()=>location.hash.split('/')[2];
  const reg=$('#register');
  if(reg) reg.onclick=async()=>{
    reg.disabled=true;
    const r=await API.register(S.profile.id,cid());
    if(r.error){ toast('Could not register: '+r.error); reg.disabled=false; return; }
    logAct('register',cid());
    toast('Registered. Now pay on WhatsApp.'); route();
  };
  const cp=$('#checkPay');
  if(cp) cp.onclick=async()=>{ await route(); const e=S.enrols[cid()]; toast(e&&e.status==='active'?'Payment confirmed. Course unlocked!':'Not confirmed yet. We will unlock it after payment.'); };
  const cr=$('#cancelReg');
  if(cr) cr.onclick=async()=>{
    if(!confirm('Cancel this registration?')) return;
    const id=cid(), r=await API.cancel(S.enrols[id].id);
    if(!r.error) logAct('cancel',id);
    toast(r.error?'Could not cancel: '+r.error:'Registration cancelled.'); route();
  };

  /* learning: practical checklist, quiz, completion */
  const cm=$('#complete');
  if(cm){
    const parts=location.hash.split('/'), id=parts[2], idx=parseInt(parts[3]||'0',10)||0;
    const c=course(id), e=S.enrols[id], m=c&&c.modules[idx];
    if(c&&e&&m){
      document.querySelectorAll('[data-chk]').forEach(cb=>cb.onchange=async()=>{
        const i=+cb.dataset.chk;
        const p=JSON.parse(JSON.stringify(e.progress||{})); const cur=p[idx]||{c:[],q:null};
        cur.c = cb.checked ? [...new Set([...cur.c,i])].sort((x,y)=>x-y) : cur.c.filter(x=>x!==i);
        p[idx]=cur; e.progress=p; updateReady();
        await saveEnrol(e,{ progress:p, last_activity:new Date().toISOString() });
      });
      bindQuiz(m,idx,e,id);
      cm.onclick=async()=>{
        cm.disabled=true;
        const wasFinished=e.done.length>=c.modules.length;
        const wasDone=e.done.includes(idx);
        const done=[...new Set([...e.done,idx])].sort((x,y)=>x-y);

        if(finished && !e.cert_id){ upd.cert_id=certCode(); upd.completed_at=now; }

        if(r.error){ toast('Could not save progress: '+r.error); cm.disabled=false; return; }

        if(finished && !wasFinished){ logAct('course_complete',id,c.title); toast('Course complete. Well done!'); S.celebrate=true; go('#/cert/'+id); return; }
        if(idx<c.modules.length-1) go('#/learn/'+id+'/'+(idx+1));
        else go('#/course/'+id);
      };
      updateReady();
    }
  }

  /* admin */
  document.querySelectorAll('[data-approve],[data-revoke]').forEach(b=>b.onclick=async()=>{
    const approve=!!b.dataset.approve; b.disabled=true;
    const r=await API.setStatus(b.dataset.approve||b.dataset.revoke, approve?'active':'pending');
    toast(r.error?'Failed: '+r.error:(approve?'Payment confirmed. Course unlocked.':'Access revoked.')); route();
  });
  document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=async()=>{
    const lock=b.dataset.to==='true', name=b.dataset.name;
    if(!confirm(lock?`Lock ${name}'s account? They will be blocked from all courses until you unlock it.`:`Unlock ${name}'s account and restore access?`)) return;
    b.disabled=true;

    toast(r.error?'Failed: '+r.error:(lock?`${name}'s account is locked.`:`${name}'s account is unlocked.`)); route();
  });
  const pf=$('#payForm');
  if(pf) pf.onsubmit=async ev=>{
    ev.preventDefault();
    const v={ bank:$('#pbank').value.trim(), number:$('#pnum').value.replace(/\s+/g,''), name:$('#pname').value.trim(), note:$('#pnote').value.trim() };
    if(!v.bank){ toast('Enter the bank name.'); return; }
    if(!/^\d{10}$/.test(v.number)){ toast('The account number must be exactly 10 digits.'); return; }
    const r=await API.setSetting('payment',v);
    if(r.error){ toast('Could not save: '+r.error); return; }
    S.settings.payment=v; toast('Payment account saved.'); route();
  };
  const cfm=$('#certForm');
  if(cfm) cfm.onsubmit=async ev=>{
    ev.preventDefault();
    const v={ signatory:$('#csig').value.trim(), title:$('#ctitle').value.trim()||'Programme Director' };

  };
  const prf=$('#priceForm');

    ev.preventDefault();

    if(bad){ toast('Enter a valid price for every course.'); return; }
    const r=await API.setSetting('prices',v);
    if(r.error){ toast('Could not save: '+r.error); return; }
    S.settings.prices=v; toast('Prices saved.'); route();
  };
  const rf=$('#refresh'); if(rf) rf.onclick=()=>route();
  const ss=$('#stuSearch');
  if(ss) ss.oninput=()=>{ const t=ss.value.trim().toLowerCase(); document.querySelectorAll('#stuBody tr').forEach(r=>r.style.display=r.dataset.row.includes(t)?'':'none'); };
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    S.actGroup=b.dataset.act;
    document.querySelectorAll('[data-act]').forEach(x=>x.setAttribute('aria-pressed',x===b));

window.addEventListener('scroll',()=>{ const h=document.querySelector('header.top'); if(h) h.classList.toggle('scrolled',window.scrollY>8); },{passive:true});
(async function init(){
  $('#shell').innerHTML = header('/') + `<div id="app">${loading()}</div>`;
  await Promise.all([loadMe(), loadSettings()]);
  if(live) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && S.profile){ S.profile=null; S.enrols={}; route(); } });
  route();
})();
</script>
