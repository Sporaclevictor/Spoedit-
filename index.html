]});

COURSES.push({id:"video",cat:"Tech and creative",title:"Video Editing",color:"#0E7490",price:10000,level:"Beginner",hours:6,
blurb:"Shoot, cut and export videos for social media and events.",
outcome:"Shoot clean footage with a phone, edit it in CapCut, and export a polished 60-second promo video.",
modules:[
{t:"Shooting good footage",
learn:[
["Light, framing and steadiness","Good video starts before editing. **Light** matters most: film facing a window or in shade outdoors, and never with a bright window behind your subject. Hold the phone with two hands or rest it on something solid so the picture is steady. Use the **rule of thirds**: imagine a 3 by 3 grid and put your subject on a line, not in the centre.",["Natural light from the front or side","Clean your phone lens before filming","Landscape for YouTube, portrait for Reels and TikTok"]],
["Shot types and B-roll","Mix shots so your video feels alive: a **wide shot** shows the place, a **medium shot** shows a person from the waist up, and a **close-up** shows detail. **B-roll** is extra footage that covers the main story, such as hands working or products. Film each shot for at least 10 seconds so you have room to cut.",["Wide, medium and close-up","Film more B-roll than you think you need","Hold each shot still for 10 seconds"]],
["Clear audio","Viewers forgive average video but not bad sound. Film in a quiet room, stay close to the microphone and turn off fans. A cheap wired microphone or earphones with a mic placed near your mouth improves quality massively. Record a few seconds of room silence at the start to help remove noise later.",["Move close to the person speaking","Record a test and listen with earphones","Avoid wind: turn your back to it"]]
],
tip:"Always film a little more than you need. You can cut footage later, but you cannot add it.",
practical:{t:"Film a shot list",goal:"Film a set of practice clips using good light, framing and sound.",
steps:["Pick a simple subject such as your workspace, a meal, or a friend introducing themselves.","Clean your phone lens, switch on the grid lines in your camera settings and set the phone to landscape.","Film one wide shot, one medium shot and two close-ups. Hold each for at least 10 seconds.","Film 20 seconds of a person speaking close to the phone in a quiet place. Check that the sound is clear using earphones.","Film one clip in poor light (bright window behind) and one in good light and compare.","Delete unusable clips and keep your best six in one album called Spoiad Video."],
check:["I filmed wide, medium and close-up shots","The speaking clip has clear audio","I compared poor light with good light","I saved my best six clips in one folder or album"]},
quiz:[["Where should the light source be?",["In front of or beside the subject","Behind the subject","It does not matter"],0],["What is B-roll?",["Extra footage that supports the story","A kind of microphone","A video format"],0],["What improves audio most?",["Getting the microphone close and recording in a quiet place","Making the video longer","Adding music only"],0]]},

{t:"The editing timeline with CapCut",
learn:[
["Starting a project","CapCut is a free editor for phone and computer. Open it, tap **New project** and select your clips in the order you want. Tap **Add**. You will see the **preview** at the top, the **timeline** at the bottom and the **toolbar** under it. Clips sit on the timeline from left to right in the order they play.",["Preview: what you see","Timeline: where clips are arranged","Toolbar: tools for the selected clip"]],
["Trim, split and arrange","Tap a clip to select it. Drag its edges to **trim** the start or end. Move the white playhead line to a spot and tap **Split** to cut the clip in two. Select the unwanted part and tap **Delete**. Press and hold a clip then drag it to a new position to reorder. Cut out pauses, mistakes and boring parts first.",["Trim: shorten a clip from the edges","Split: cut at the playhead","Delete: remove unwanted parts"]],
["Speed, music and clip order","Open the **Speed** tool to slow down or speed up a clip. Tap **Audio > Sounds** to add music and drag the music to the start of the timeline. Lower the music volume so voices are clear. Keep your first three seconds exciting to hold attention.",["Start with the strongest moment","Keep shots short: 2 to 4 seconds in fast edits","Music should support, not fight, the voice"]]
],
tip:"Cut on movement. When someone starts to move, cut to the next shot and the edit will feel smooth.",
practical:{t:"Rough cut a 30-second video",goal:"Trim, split, reorder clips and add music in CapCut.",
steps:["Open CapCut and create a New project using your best six clips from Module 1.","Trim each clip to between 2 and 5 seconds, keeping only the best part.","Use Split to cut out at least one mistake or pause.","Reorder the clips so the video starts with your most interesting shot.","Add a music track from Audio > Sounds and lower the volume to about 30 percent.","Play the video from the start and trim until the total length is about 30 seconds. Save the project."],
check:["The video is about 30 seconds long","I used trim and split on my clips","The first shot is the most interesting","Music is added at a low volume"]},
quiz:[["What does Split do?",["Cuts a clip at the playhead","Adds music","Exports the video"],0],["Where should the strongest shot go?",["At the beginning","At the very end only","Nowhere"],0],["What should you do with music when someone speaks?",["Lower its volume","Make it louder","Stop the video"],0]]},

{t:"Titles, effects and colour",
learn:[
["Text and titles","Tap **Text > Add text** to put words on screen. Choose a clear, bold font and a size that is easy to read on a phone. Use contrast: white text with a thin dark outline or shadow works on almost any picture. Keep text on the screen long enough to read twice: roughly one second for every three words. Use **Auto captions** to create subtitles, then correct the mistakes.",["Short titles of 3 to 6 words","Place text in safe zones away from edges","Captions help people watching without sound"]],
["Transitions and effects","A **transition** connects two clips, such as Fade or Dissolve. Simple cuts are usually best. Use effects and filters lightly. If an effect is the first thing people notice, there is too much of it. Pick one style and stay consistent.",["Cut is the most professional transition","Use the same style across the video","Avoid heavy effects on every clip"]],
["Basic colour correction","Use **Adjust** to change brightness, contrast, saturation and temperature. Fix clips that are too dark or too pale. Make all clips look similar so they feel like one video. Filters can give a consistent look, but reduce their strength so skin tones stay natural.",["Match brightness between clips","Warm temperature for a friendly look","Do not oversaturate skin tones"]]
],
tip:"Add captions to every video. Most people watch social media with the sound off.",
practical:{t:"Add titles, captions and colour",goal:"Polish your rough cut with text, simple transitions and colour correction.",
steps:["Open your 30-second project in CapCut.","Add an opening title of 3 to 5 words and an end card with a call to action such as 'Follow for more'.","Use Auto captions on any speaking clip and correct every mistake by hand.","Add a simple Fade or Dissolve transition between two clips only. Keep the other cuts plain.","Select each clip and use Adjust to match brightness and contrast so they look alike.","Watch the full video on your phone at normal volume and then with the sound off. Fix any text that is too small."],
check:["There is an opening title and an end card","Captions are checked and correct","Only light transitions and effects are used","Clips look similar in colour and brightness"]},
quiz:[["How long should text stay on screen?",["Long enough to read twice","Half a second","Until the video ends"],0],["Which transition is usually the most professional?",["A simple cut","A spinning effect","A zoom blur on every clip"],0],["Why add captions?",["Many people watch without sound","They make video longer","They improve camera quality"],0]]},

{t:"Audio: voice, music and clean sound",
learn:[
["Voice-over","A voice-over is your voice recorded over the footage. In CapCut tap **Audio > Record**, hold the button and speak clearly. Hold the phone near your mouth in a quiet room and write a short script first. Speak slower than normal and smile: it shows in your voice. Record in short sentences so mistakes are easy to redo.",["Write a short script first","Record in a quiet room with soft furnishings","Do multiple takes and keep the best"]],
["Balancing volume","Voices should be louder than music. A good rule is voice near the top of the meter and music about 20 to 30 percent. Use **Volume** on each clip and **Fade in/Fade out** on music so it starts and ends smoothly. Use **Keyframes** if you need the music to lower only while someone talks.",["Voice first, music second","Fade music in at the start and out at the end","Listen on earphones and on the phone speaker"]],
["Cleaning sound","Tap **Noise reduction** on a speaking clip to remove background hiss. Do not push it too far or the voice will sound robotic. Remove long gaps of silence and breathing. Use music you are allowed to use: CapCut's library, YouTube Audio Library or Pixabay. Copyrighted songs can cause your video to be muted or removed.",["Use royalty-free music","Check the loudest and quietest parts","Avoid using the same track in every video"]]
],
tip:"Always edit with earphones on. Many audio problems are invisible on a phone speaker.",
practical:{t:"Record and mix a voice-over",goal:"Record a voice-over, balance it with music and reduce noise.",
code:`Hi, I am learning video editing with Spoiad.
In just a few weeks I have learned to shoot clear footage, cut clips, add titles and mix sound.
Watch this short video to see what I have made.
Follow me to see more.`,
steps:["Read the sample script on the left or write your own four-line script about what you are learning.","Open your project and tap Audio > Record. Record your voice-over in a quiet place close to the phone. Do at least two takes.","Delete the weaker take and trim the silence from the start and end of the good one.","Set voice volume high and music volume to about 25 percent. Add fade in and fade out on the music.","Apply Noise reduction to the voice clip and listen for any robotic sound.","Play the video with earphones, then through the phone speaker, and adjust if the voice is ever hard to hear."],
check:["I recorded and kept a clear voice-over","The voice is louder than the music","Music fades in and out","Noise reduction is applied but still sounds natural"]},
quiz:[["How loud should music be compared with the voice?",["Quieter than the voice","Louder than the voice","Exactly the same"],0],["Why use royalty-free music?",["To avoid copyright problems","It is always louder","It improves picture quality"],0],["What is a good way to check audio quality?",["Listen with earphones","Mute the video","Only check the picture"],0]]},

{t:"Export, share and project: a 60-second promo",
learn:[
["Export settings","When your edit is finished, tap **Export**. Choose **1080p** resolution and **30 fps** for most social media. Higher settings make larger files. Watch the entire exported video once before posting to catch any mistakes. Save a copy of the project so you can change it later.",["1080p, 30 fps is the standard","Check the whole video after exporting","Keep the project file for later changes"]],
["Platforms and file size","WhatsApp compresses video, so keep important detail large. For WhatsApp status, keep clips under 30 seconds per part. For TikTok, Instagram Reels and YouTube Shorts use vertical 9:16 and keep within 60 seconds. For YouTube use horizontal 16:9. Add a thumbnail image with a clear face and a short title.",["Vertical 9:16 for Reels, TikTok, Shorts","Horizontal 16:9 for YouTube","Short clips perform better for beginners"]],
["Plan a promo video","A promo has a hook (first 3 seconds), a promise (what the viewer gets), proof (examples or results) and a call to action. Write a one-line script for each shot, film exactly what you need and edit with a clear goal. Review with a friend and improve once before sharing publicly.",["Hook, promise, proof, call to action","Ask for honest feedback","Improve once, then publish"]]
],
tip:"Done is better than perfect. Export, share, learn from the response and make the next one better.",
practical:{t:"Your 60-second promo",goal:"Plan, film, edit and export a 60-second promo video for a business, event or yourself.",
steps:["Choose a topic: a small business, a school event, a service or your own skills.","Write a shot list of 8 to 10 shots following hook, promise, proof and call to action.","Film all shots using the techniques from Module 1.","Edit in CapCut: trim, arrange, add title, captions, music, voice-over if you like, and light colour correction.","Export in 1080p at 30 fps and watch the full video on your phone.","Show the video to two people, note their feedback, make one improvement and export the final version."],
check:["The video follows hook, promise, proof and call to action","It is 60 seconds or less with clear audio and captions","I exported in 1080p and watched the whole file","I got feedback and made one improvement"]},
quiz:[["Which resolution is a good standard for social media?",["1080p","144p","Any, quality does not matter"],0],["Which shape suits TikTok and Reels?",["Vertical 9:16","Horizontal 16:9","Square only"],0],["What comes first in a promo video?",["A hook","The credits","A long introduction"],0]]}
]});

COURSES.push({id:"marketing",cat:"Business",title:"Digital Marketing",color:"#B45309",price:9000,level:"Beginner",hours:6,
blurb:"Promote a business or brand using social media, content and ads.",
outcome:"Plan and run simple marketing for a business using social media, WhatsApp, email and small ad budgets.",
modules:[
{t:"Marketing basics",
learn:[
["What marketing really is","Marketing is helping the right people find, trust and choose what you offer. It is not only advertising. It includes your product, your price, where you sell and how you talk to customers. Digital marketing does this using phones, social media, WhatsApp, search and email.",["Right people, right message, right time","Trust comes before sales","Every post should have a purpose"]],
["Know your customer","You cannot sell to everyone. Describe one typical customer: age, location, what they need, what worries them and where they spend time online. This is called a **customer profile** or **persona**. For example: 'Amaka, 24, university student in Enugu, wants affordable braids, uses Instagram and WhatsApp daily.'",["Be specific, not 'everybody'","Talk to ten real customers if you can","Write their problems in their own words"]],
["Your value proposition","A **value proposition** is one sentence that explains what you offer, for whom and why it is better. Use this pattern: 'We help [customer] to [result] by [how].' Example: 'We help busy students get neat, affordable braids in under two hours with home service.' Use it on your bio, posts and posters.",["Say the benefit, not just the product","Be clear and honest","Make it easy to say out loud"]]
],
tip:"Start with one customer type and one product. Focus beats spreading yourself thin.",
practical:{t:"Customer profile and value proposition",goal:"Describe your ideal customer and write a one-sentence value proposition.",
steps:["Choose a real or imaginary small business: for example, snacks, tutoring, tailoring, phone repairs or graphic design.","Write a customer profile: name, age, location, daily routine, three needs, three worries and the social media they use.","List the three biggest problems your customer has that your business can solve.","Write a value proposition using the pattern 'We help ... to ... by ...'.","Read it aloud to a friend and ask if they understand what you sell and why it is good. Improve it once.","Save everything in a document called Marketing-Foundation."],
check:["My customer profile is specific, not everyone","I listed three real customer problems","My value proposition names who, what result and how","A friend understood it when I said it aloud"]},
quiz:[["What is a customer profile?",["A detailed description of your ideal customer","A shop sign","A price list"],0],["A strong value proposition explains...",["Who you help, what result and how","Only your price","Only your logo"],0],["Marketing is only advertising.",["True","False","Only on TV"],1]]},

{t:"Social media marketing",
learn:[
["Choose the right platforms","You do not need every platform. Choose where your customers already are. Instagram and TikTok suit visual products and younger customers. Facebook reaches families and local communities. WhatsApp is best for direct sales and support. LinkedIn suits professional services. Start with two platforms and do them well.",["Instagram: photos, short videos","TikTok: short, creative videos","Facebook: communities and local groups","WhatsApp Status: daily updates"]],
["Content that people want","Mix three kinds of posts: **value** (tips and how-to), **proof** (customer results, behind the scenes) and **offers** (what you sell and how to order). A good rule is 3 value or proof posts for every 1 offer post. Use clear photos, short videos, simple captions and a call to action such as 'Send us a WhatsApp message'.",["Teach, show, then sell","Use your own photos and videos","End with a clear next step"]],
["Plan with a content calendar","A **content calendar** is a table showing what you will post and when. Plan one week at a time. Write captions in advance, prepare images, and post at times when your customers are online. Reply to comments and messages within a few hours. Consistency beats occasional bursts.",["Post at least three times a week","Reply to every comment","Review what worked every Sunday"]]
],
tip:"Do not buy followers. Ten real, interested followers are worth more than a thousand fake ones.",
practical:{t:"One-week content calendar",goal:"Plan and create a week of social media content for a business.",
code:`Day\tPlatform\tType\tIdea\tCaption goal
Mon\tInstagram\tValue\tThree tips for ...\tTeach
Tue\tWhatsApp Status\tProof\tBefore and after photo\tShow results
Wed\tInstagram\tOffer\tNew product or service\tSell
Thu\tTikTok\tValue\t30 second how-to\tTeach
Fri\tInstagram\tProof\tCustomer message or photo\tBuild trust
Sat\tFacebook\tOffer\tWeekend special\tSell
Sun\tAll\tValue\tWeek recap or question\tEngage`,
steps:["Open Excel, Word or Google Sheets and recreate the calendar on the left (paste into Excel).","Replace the example ideas with ideas for your own business.","Write full captions for at least three posts, each with a call to action.","Create the pictures or videos for at least two of them using Canva or your phone.","Post one of them (or a draft shared privately with a friend) and observe the response for 24 hours.","Note what you learned: which post got the most likes, comments or messages?"],
check:["I have a seven-day plan with platform, type and idea","Three captions are fully written with a call to action","I created at least two images or videos","I noted what I learned from the response"]},
quiz:[["How many platforms should a beginner start with?",["Two, done well","All of them","None"],0],["What is a content calendar?",["A schedule of what to post and when","A type of camera","A bank statement"],0],["Which is a good ratio of posts?",["Three value or proof for every one offer","Offers only","No offers ever"],0]]},

{t:"WhatsApp Business and email marketing",
learn:[
["Set up WhatsApp Business","Download **WhatsApp Business** (free, separate from regular WhatsApp). Add a business name, profile photo or logo, description, address, hours, email and website. Create a **catalogue** with product photos, names, prices and descriptions. Customers can browse without asking you the same questions repeatedly.",["Use a clear business name and logo","Fill in opening hours and address","Add at least five catalogue items"]],
["Messages, labels and broadcasts","Create a **greeting message** for new chats, an **away message** for after hours and **quick replies** for common questions. Use **labels** (New customer, Pending payment, Paid) to organise chats. A **broadcast list** sends one message to many contacts individually. Only message people who have saved your number and agreed to hear from you.",["Use quick replies for price, delivery and payment details","Label chats so nobody is forgotten","Never spam or message strangers"]],
["Email marketing basics","Email lets you keep in touch with customers who really care. Collect addresses with permission, for example through a sign-up form or inquiry. Use a clear subject line (under 50 characters), a short message, one picture and one call to action. Send consistently, such as weekly or monthly, and always give people an easy way to unsubscribe.",["Ask permission first","Short subject lines get opened","One email, one main call to action"]]
],
tip:"Reply within minutes during business hours. Speed of reply is one of the strongest sales tools you have.",
practical:{t:"Set up your business messaging",goal:"Prepare WhatsApp Business messages, a catalogue plan and a first email.",
code:`Greeting:
Hello! Thanks for contacting [Business Name]. How can we help you today?

Away message:
Thank you for your message. We are currently closed and will reply by [time].

Quick reply /price:
Our prices: [Item 1] - [price], [Item 2] - [price]. Delivery: [details].

Quick reply /pay:
To pay, please send the amount to [account details] and send us your proof of payment.`,
steps:["Install WhatsApp Business on a phone (or study the setup screens in a tutorial if you do not have a spare number).","Complete the business profile: name, logo, description, hours, address.","Write the four messages on the left for your business and set them up as greeting, away message and quick replies.","Plan at least five catalogue items: take clear photos, write names, prices and descriptions.","Write a first customer email of under 120 words with a clear subject line and one call to action.","Send the email to yourself, read it on your phone, and fix anything unclear."],
check:["The profile is complete and professional","Greeting, away message and two quick replies are written","I planned five catalogue items with photos and prices","My email has a short subject line and one call to action"]},
quiz:[["What is a catalogue in WhatsApp Business?",["A list of products with photos and prices","A group chat","A phone brand"],0],["Who should receive broadcast messages?",["Only people who have agreed to hear from you","Any random number","Nobody"],0],["Good email subject lines are...",["Short and clear","Very long","Written in capitals"],0]]},

{t:"Ads and budgets",
learn:[
["How paid ads work","Platforms like Meta (Facebook and Instagram), TikTok and Google let you pay to show your message to chosen people. You select an **objective** (messages, traffic, sales), an **audience** (location, age, interests), a **budget** and **creative** (picture or video and text). You pay when people see or click, depending on the type of ad.",["Objective: what you want people to do","Audience: who should see it","Creative: the picture or video and text"]],
["Set a small test budget","Start small: a few thousand naira over three to seven days. Run two versions of the same ad with one difference, such as a different image or headline. This is a **test**. After it ends, keep the version that performed better and stop the other. Never spend money you cannot afford to lose, and never expect instant sales.",["Test one thing at a time","Judge after enough time, not after one hour","Increase budget slowly on winners"]],
["Write an ad that works","A strong ad has a hook in the first line, a clear benefit, proof (a result or review) and one call to action. Use a clear image or short video. Make sure the link opens a page or WhatsApp chat that matches the ad. Check that prices and phone numbers are right before you pay.",["Hook, benefit, proof, call to action","Match the ad to the landing page","Check for spelling mistakes"]]
],
tip:"Boosting a post that already has real engagement usually works better than boosting a weak one.",
practical:{t:"Plan a small ad test",goal:"Design an ad test with two versions and a budget plan, ready to launch.",
code:`Ad plan
Business:
Objective:
Audience (location, age, interests):
Daily budget:
Duration (days):
Version A headline / image:
Version B headline / image:
Call to action:
How I will measure success:`,
steps:["Copy the ad plan on the left into a document and fill it in for your business.","Write two versions of the ad: same offer, but with a different headline or different image.","Calculate the total budget: daily budget multiplied by days. Make sure you can afford it.","Create both ads as free drafts in Meta Ads Manager (or write them clearly on paper) without paying.","Decide in advance what a good result looks like, for example 'at least 10 WhatsApp messages' and write it down.","Ask a friend to read your ad and tell you what it offers, who it is for and what to do next."],
check:["The plan has objective, audience, budget and duration","I have two versions with only one difference","I know the total cost and can afford it","I wrote a clear measure of success"]},
quiz:[["What is an A/B test?",["Running two versions to see which works better","Spending your whole budget","Deleting an ad"],0],["How should you start with ads?",["With a small test budget","With all your savings","Without any plan"],0],["What should a good ad end with?",["A clear call to action","Nothing","A long story"],0]]},

{t:"Measuring results and project: a 2-week marketing plan",
learn:[
["What to measure","Measure only what helps you decide. **Reach** is how many people saw your content. **Engagement** is likes, comments, shares and messages. **Clicks** show interest. **Conversations** and **sales** are what really matter to a small business. Choose one main goal per period, such as '20 new WhatsApp enquiries this month'.",["Reach, engagement, clicks, conversations, sales","One goal at a time","Write numbers down weekly"]],
["Track in a simple sheet","Make a spreadsheet with columns: Date, Platform, Post or ad, Reach, Likes or clicks, Messages, Sales, Notes. Fill it in once a week. Compare the best and worst items and ask why. Do more of what works and stop what does not. Cost per result equals money spent divided by the number of results.",["A simple sheet beats complicated tools","Compare best and worst","Cost per result = spend divided by results"]],
["Marketing plan structure","A plan answers: Who is the customer? What is the offer? Which platforms? What content? What budget? What goal? How will we measure? Put dates beside every action. Review at the end and write one lesson for the next plan.",["Goal, audience, offer, channels, content, budget, metrics","Set dates and owners for each action","Review and write down one lesson"]]
],
tip:"Marketing is a loop: plan, post, measure, improve. Every loop makes you better.",
practical:{t:"Your two-week marketing plan",goal:"Create and start a real two-week marketing plan with a tracking sheet.",
code:`Date\tPlatform\tPost or ad\tReach\tLikes or clicks\tMessages\tSales\tNotes`,
steps:["Write a one-page plan: customer profile, value proposition, goal for two weeks (with a number), platforms and budget.","Create a content calendar for 14 days with at least 8 posts using the 3 to 1 value, proof and offer ratio.","Create the tracking sheet shown on the left in Excel or Google Sheets.","Prepare the content for the first three days and post it.","Fill in the tracking sheet after days 3, 7 and 14.","At the end write a short review: what worked, what did not and what you will change in the next plan."],
check:["My plan has a measurable goal and a budget","I have a 14-day content calendar","I filled in the tracking sheet at least three times","I wrote a review with one lesson"]},
quiz:[["Which result matters most to a small business?",["Conversations and sales","Number of hashtags","Font size"],0],["Cost per result is...",["Money spent divided by results","Followers divided by days","Sales plus budget"],0],["How many main goals should you focus on at a time?",["One","Ten","None"],0]]}
]});

COURSES.push({id:"dataentry",cat:"Business",title:"Data Entry and Office Skills",color:"#4338CA",price:4500,level:"Beginner",hours:5,
blurb:"Work accurately with data, forms and everyday office tools.",
outcome:"Enter, check and organise data accurately, write professional emails and prepare for office job applications.",
modules:[
{t:"Accuracy and speed",
learn:[
["Why accuracy comes first","In data entry one wrong digit can send money to the wrong person or ship the wrong item. Employers prefer a worker who is 99 percent accurate and steady over a fast worker who makes many mistakes. Aim for accuracy first. Speed grows naturally as you practise.",["99 percent accuracy is a common target","Slow down when you are tired","Fix the cause of mistakes, not only the mistake"]],
["Posture, keyboard and shortcuts","Sit with your back straight, feet flat, elbows at about 90 degrees and the screen at eye level. Keep wrists straight. Use shortcuts to save time: Ctrl+C, Ctrl+V, Ctrl+Z, Ctrl+F (find), Ctrl+S (save), Tab (next field) and Ctrl+Backspace (delete a word). Learn to use the number pad without looking.",["Take a short break every 30 minutes","Use Tab to move between form fields","Use Ctrl+F to find a record fast"]],
["Checking your own work","Build a checking habit: after each batch, compare your entries to the source documents. Read numbers out loud or in groups (0803 123 4567). Use a ruler or finger to follow the line. Check totals and counts match the original. A second look catches most mistakes.",["Compare source and screen line by line","Check totals and record counts","Use the spell check on text fields"]]
],
tip:"Check, then check again. Professionals build checking into every task.",
practical:{t:"Accuracy drill",goal:"Practise typing numbers and names from a source with zero errors, and measure your accuracy.",
code:`0803 456 7821  Adaobi Nwosu   Lagos      25,400
0814 220 9937  Musa Ibrahim   Kano       18,750
0906 118 4402  Funke Adeyemi  Ibadan     32,100
0701 555 3190  Chinedu Okoro  Enugu      12,600
0815 667 2208  Halima Bello   Abuja      41,900
0902 334 7714  Tolu Johnson   Lagos      9,850`,
steps:["Open a new Excel or Word document. Set your seating and posture as described in the lesson.","Type the six lines on the left exactly, one record per line (in Excel use one cell per column: phone, name, city, amount).","Do not use copy and paste. Type them manually without looking at the keyboard where you can.","Compare your work to the source line by line and count the number of mistakes.","Calculate accuracy: (total characters minus mistakes) divided by total characters. A quick guide: 0 mistakes means 100 percent.","Repeat the exercise a second time and try to improve your accuracy. Note your two scores."],
check:["I typed all six records manually","I compared my work to the source and counted mistakes","I repeated the drill and wrote down both scores","My second attempt had equal or fewer mistakes"]},
quiz:[["What should you focus on first?",["Accuracy","Speed only","Ignoring checks"],0],["Which key moves to the next field in many forms?",["Tab","Esc","Caps Lock"],0],["What is a good way to check your work?",["Compare it line by line to the source","Skip checking","Only check the first line"],0]]},

{t:"Working with forms and consistent data",
learn:[
["Types of data fields","A form is made of **fields**. Common types are text (names), numbers (age, quantity), dates, drop-downs, checkboxes and phone numbers. Required fields are often marked with a star and cannot be left blank. Always read field instructions before typing.",["Required fields must be filled","Use drop-downs exactly as given","Do not add extra symbols"]],
["Consistent formats","Agree one format and use it everywhere. Dates: 15/03/2026 (day/month/year) or 2026-03-15. Phone numbers: 0803 456 7821 (the same pattern every time). Names: capital first letters, no all-caps. Money: 25,400 with or without the currency symbol, but not mixed. Consistent data can be sorted, searched and counted correctly.",["One date format for the whole file","One pattern for phone numbers","No trailing spaces or double spaces"]],
["Common errors and how to avoid them","Typical mistakes: swapped digits (4521 instead of 4251), missed rows, duplicates, wrong capitalisation, and misspelled names. Prevent them by working in small batches, using lists of valid values, using **Data Validation** in Excel and checking for duplicates (Data > Remove Duplicates, but copy your data first).",["Swapped digits are the most common error","Always keep a backup before removing duplicates","Use Data Validation for fixed choices"]]
],
tip:"Decide your formats before entering a single record. Fixing 500 records later is painful.",

{t:"Spreadsheets for records",
learn:[
["Structure a record sheet","Use one sheet for one topic. Put headings in row 1, one record per row and one kind of detail per column. Do not leave empty rows or columns in your data. Avoid merged cells in data tables because they break sorting and filtering. Turn the range into a **Table** (Ctrl+T) so it grows automatically and each heading gets a filter.",["Headings in the first row","No blank rows or columns","Use Ctrl+T to make a Table"]],
["Data validation and drop-downs","**Data > Data Validation** limits what can be typed in a cell. Choose List and type options like Paid, Pending, Cancelled. Choose Whole number to accept only numbers between two limits. Add an input message and an error alert to guide users.",["List: a fixed set of choices","Whole number or Date for ranges","Error alerts stop wrong data"]],
["Find, filter and summarise","Press **Ctrl+F** to find. Use Table filters to see only certain records. Use `=COUNTIF()` to count records and `=SUMIF()` to add amounts for one category. A **PivotTable** (Insert > PivotTable) summarises thousands of rows into a small report in a few clicks.",["COUNTIF counts matching records","SUMIF adds matching amounts","PivotTable summarises large lists"]]
],

{t:"Email and professional communication",
learn:[
["Parts of a professional email","A good email has a clear **subject line**, a polite **greeting**, a short **body** and a proper **sign-off**. Use a professional email address, like firstname.lastname@gmail.com. Put your request in the first two lines. Keep paragraphs short and use a clear closing such as 'Kind regards' followed by your name and phone number.",["Subject: specific, e.g. 'Application for Data Entry Clerk'","Greeting: 'Dear Mr Bello,' or 'Dear Hiring Manager,'","Sign-off: 'Kind regards' and your name"]],
["Tone, attachments and etiquette","Write politely, avoid slang and capital letters and use correct spelling. Read your email before sending. Attach files with clear names (Ada-Obi-CV.pdf) and mention them in the body. Use **Reply All** only when everyone needs the answer. Reply within 24 hours on working days. Never send private information such as passwords or full card numbers by email.",["Mention attachments in the text","Name files clearly","Proofread before sending"]],
["Meetings, calls and messages","When you call, introduce yourself, state your reason and ask if it is a good time. In meetings, arrive early, mute your microphone when not speaking and take short notes. On WhatsApp for work, keep messages clear, use full sentences and avoid sending voice notes that are too long. Confirm important instructions in writing.",["Introduce yourself clearly on the phone","Take notes in meetings","Confirm important agreements in writing"]]
],
tip:"Imagine your email will be read by your future boss. Write accordingly.",
practical:{t:"Write three professional emails",goal:"Write a job application email, a follow-up and a polite request.",
code:`Subject: Application for Data Entry Clerk

Dear Hiring Manager,

I would like to apply for the Data Entry Clerk position advertised on [source]. I have completed training in Excel and data entry, with a typing accuracy of over 98 percent. My CV is attached.

Thank you for your time. I look forward to hearing from you.

Kind regards,
[Your name]
[Phone number]`,
steps:["Open a new email draft or a Word document.","Use the sample on the left as a model and write your own job application email for a role you like. Mention one real skill you have.","Write a follow-up email to send one week after applying. Keep it to three sentences and be polite.","Write a third email to your teacher or a colleague politely requesting a meeting or information. Include a clear subject line.","Check each email for spelling, tone, greeting, attachments and sign-off.","Ask a friend or teacher to read all three and tell you if the message is clear."],
check:["All three emails have clear subject lines","Each has a greeting, short body and sign-off","I mentioned attachments where needed","Someone else reviewed my emails"]},
quiz:[["Where should the main request be?",["In the first two lines","At the very end only","Hidden in a long paragraph"],0],["What is a professional email address like?",["firstname.lastname@gmail.com","coolboy123@mail.com","anything"],0],["Should you send passwords by email?",["No","Yes, always","Only on Friday"],0]]},

{t:"Getting job ready",
learn:[
["CV and cover letter","Your CV should fit on one page and list contact details, a short profile, skills, education and any experience or projects. Write a short **cover letter** of three paragraphs: why you are writing, why you are suitable and a polite close. Customise each application: use the company name and mention the skills they asked for.",["One page CV","Three-paragraph cover letter","Match your skills to the job advert"]],
["Finding jobs safely","Use trusted job portals, company websites, LinkedIn and recommendations from people you know. Never pay money to get a job and avoid adverts that ask for bank details or promise unrealistic pay. Check the company online, read reviews and confirm the address. Keep a list of the jobs you applied for, with dates and contact persons.",["Never pay to get a job","Verify the company before sharing personal details","Track applications in a spreadsheet"]],
["Interviews and first weeks","Prepare short answers for common questions: 'Tell me about yourself', 'Why do you want this job?' and 'What are your strengths?'. Dress neatly, arrive 15 minutes early and bring copies of your CV and certificates. Listen carefully, speak clearly and ask one or two questions. On the job, be punctual, learn quickly, ask when you do not understand and always double-check your work.",["Practise answers out loud","Arrive early and dressed neatly","Ask good questions at the end"]]
],
tip:"Treat your job search like a job: schedule time every day and track every application.",
practical:{t:"Job search toolkit",goal:"Create a tailored application pack and an application tracker.",
code:`Company\tJob title\tDate applied\tContact\tStatus\tFollow-up date`,
steps:["Find a real job advert that suits an entry-level data entry or office role. Copy the main requirements.","Update your CV so the top of the page matches the requirements (rewrite your profile and skills).","Write a three-paragraph cover letter for that job using the real company name.","Create the application tracker on the left in Excel and add this job and at least four more you could apply for.","Practise three common interview questions out loud and record yourself on your phone. Listen and improve.","Check that every document is saved as PDF with a clear name, for example Ada-Obi-CV.pdf."],
check:["My CV and cover letter are customised for one job","The tracker lists at least five jobs","I practised interview answers out loud","Documents are saved as PDFs with clear names"]},
quiz:[["How long should a starting CV usually be?",["One page","Six pages","No limit"],0],["What should you never do when job hunting?",["Pay money to get a job","Research the company","Track applications"],0],["When should you arrive for an interview?",["About 15 minutes early","After the start","Whenever"],0]]}
]});

COURSES.push({id:"computer",cat:"Foundations",title:"Computer Basics and Typing",color:"#0F8B8D",price:3000,level:"Beginner",hours:4,
blurb:"Start from zero: files, folders, internet safety and fast typing.",
outcome:"Use a computer confidently: manage files, type without looking, browse and email safely, and protect your accounts.",
modules:[
{t:"Parts of a computer and the desktop",
learn:[
["Hardware you can touch","**Hardware** is every physical part of a computer. The **monitor** shows the picture. The **keyboard** and **mouse** are input devices: they send information in. The **system unit** (or the body of a laptop) contains the **processor** (CPU), the computer's brain, **memory** (RAM) for work in progress, and **storage** (hard drive or SSD) that keeps files when the power is off. **Speakers** and **printers** are output devices.",["Input: keyboard, mouse, microphone, scanner","Output: monitor, speakers, printer","Storage keeps files, RAM holds what you are using now"]],
["Software and the operating system","**Software** is the set of instructions that tell hardware what to do. The **operating system** (Windows, macOS, Android) runs everything else. **Applications** such as Word, Chrome and WhatsApp run on top of it. Keep your software up to date because updates fix bugs and security problems.",["Operating system: Windows, macOS, Android, iOS","Applications: programs you use","Update regularly"]],
["The Windows desktop","The **desktop** is your main screen with icons. The **taskbar** at the bottom shows open programs and the clock. The **Start menu** opens apps and settings and contains the power button. Always shut down using **Start > Power > Shut down** so files close safely. Click, double-click and right-click do different things: right-click usually opens a menu of options.",["Left-click selects, double-click opens","Right-click shows more options","Always shut down properly"]]
],
tip:"If a computer freezes, wait a minute first. Force a restart only when nothing else works.",
practical:{t:"Computer parts and desktop tour",goal:"Name the parts of a computer and practise using the desktop.",
steps:["Look at a computer, laptop or phone you can use. Write down five hardware parts you can see and whether each is input, output or storage.","Open Start and find three applications. Open and close each one.","Right-click an empty area of the desktop and read the menu options. Click away without choosing anything.","Change the desktop background (Settings > Personalisation > Background).","Open Task Manager (Ctrl+Shift+Esc) and look at which apps are running. Close the window without ending any tasks.","Shut down the computer properly using Start > Power > Shut down, then turn it on again."],
check:["I listed five parts and classified them","I opened and closed three applications","I changed the desktop background","I shut down using the Start menu"]},
quiz:[["Which of these is an input device?",["Keyboard","Monitor","Speakers"],0],["Where are files kept when the power is off?",["Storage","RAM only","The screen"],0],["What is the correct way to turn off a computer?",["Start > Power > Shut down","Remove the plug","Close the lid only"],0]]},

{t:"Files and folders",
learn:[
["Understanding files and folders","A **file** holds information: a document, picture, video or song. A **folder** is a container that organises files, like a drawer in a filing cabinet. Folders can contain other folders (subfolders). The **File Explorer** (Windows key + E) lets you see all of them. The file name ends with an **extension** that tells the computer what type it is: `.docx` (Word), `.xlsx` (Excel), `.jpg` (picture), `.pdf` (document), `.mp3` (audio).",["File: your information","Folder: a container for files","Extension: .docx, .xlsx, .jpg, .pdf, .mp3"]],
["Create, rename, move, delete","Right-click inside a folder and choose **New > Folder** to create one. Right-click a file and choose **Rename** to change its name (press F2 as a shortcut). To **copy**, press Ctrl+C then Ctrl+V in the new place. To **move**, use Ctrl+X then Ctrl+V or drag the file. **Delete** sends items to the Recycle Bin, where you can restore them until you empty it.",["Ctrl+C copy, Ctrl+X cut, Ctrl+V paste","F2 renames","Recycle Bin: restore deleted items"]],
["Organising and backing up","Use clear names, e.g. 2026-03-Maths-Notes.docx. Group files in folders by subject or project. Keep your Desktop tidy. **Back up** important files: copy them to a USB drive or upload to cloud storage like Google Drive or OneDrive. Follow the **3-2-1 idea**: three copies, on two different kinds of storage, with one copy somewhere else.",["Name files so you can find them later","Back up important work weekly","Cloud storage protects against loss and theft"]]
],
tip:"If you cannot find a file, press the Windows key and type its name. Search is faster than browsing.",
practical:{t:"Build a clean folder system",goal:"Create, name, move, copy and back up files and folders.",
steps:["Open File Explorer (Windows key + E) and go to Documents. Create a folder called Spoiad.","Inside it create three subfolders: School, Projects, Personal.","Create a new text document in Projects (right-click > New > Text Document) and name it Practice.txt.","Copy Practice.txt into School, then rename the copy to School-Notes.txt.","Delete Practice.txt from Projects, open the Recycle Bin and restore it.","Copy the whole Spoiad folder to a USB drive or upload it to Google Drive as your backup."],
check:["I created the Spoiad folder with three subfolders","I renamed a copy of a file","I restored a deleted file from the Recycle Bin","I made a backup of the folder"]},
quiz:[["What does the .pdf extension tell you?",["The file type","The file size","The owner's name"],0],["Which shortcut copies a file?",["Ctrl+C","Ctrl+Z","Ctrl+P"],0],["Where can you restore a deleted file?",["Recycle Bin","Control Panel","Start menu"],0]]},

{t:"Touch typing",
learn:[
["Home row and finger positions","Touch typing means typing without looking at the keys. Place your fingers on the **home row**: A S D F for the left hand and J K L ; for the right. Feel the small bumps on F and J. Your thumbs rest on the spacebar. Each finger always returns to home after pressing a key.",["Left hand: A S D F","Right hand: J K L ;","Bumps on F and J guide your fingers"]],
["Posture and technique","Sit upright with feet flat and the screen at eye level. Keep wrists relaxed and floating, not resting on the table. Press keys lightly. Look at the screen, not the keyboard. Start slowly and focus on accuracy: speed will follow naturally. Type in a steady rhythm.",["Straight back, relaxed shoulders","Do not look at the keys","Accuracy before speed"]],
["Practising for speed","Practise **15 minutes every day**. Use free tools like Typing.com, Keybr or TypingClub. Learn row by row: home row, top row, bottom row, numbers, symbols. Measure your **WPM** (words per minute) and **accuracy**. A good beginner goal is 25 WPM with 95 percent accuracy. A job-ready goal is 40 WPM or more with 98 percent accuracy.",["Practise little and often","Track WPM and accuracy","Goal: 40 WPM with 98 percent accuracy"]]
],
tip:"Cover your hands with a cloth or a sheet of paper while practising. It stops you peeking.",
practical:{t:"Typing test and daily practice plan",goal:"Measure your typing speed and set up a 7-day practice routine.",
code:`Day\tTool\tMinutes\tWPM\tAccuracy
Day 1\tTyping.com\t15\t\t
Day 2\tTyping.com\t15\t\t
Day 3\tKeybr\t15\t\t
Day 4\tTypingClub\t15\t\t
Day 5\tTyping.com\t15\t\t
Day 6\tKeybr\t15\t\t
Day 7\tTest\t15\t\t`,
steps:["Take a free typing test on typing.com or 10fastfingers.com. Write your WPM and accuracy as your starting point.","Create the practice log shown on the left in Excel or a notebook.","Practise the home row drill for 15 minutes and record your results.","Each day practise a new row of keys for 15 minutes without looking at the keyboard.","On day 7 take the same typing test again and compare your scores.","Write one sentence about what improved and what you will work on next."],
check:["I recorded my starting WPM and accuracy","I completed seven practice sessions of about 15 minutes","I took the final test and compared scores","I wrote one goal for the next week"]},
quiz:[["Which keys do the left fingers start on?",["A S D F","Q W E R","Z X C V"],0],["What should you focus on first?",["Accuracy","Speed","Looking at the keyboard"],0],["How often should you practise?",["A little every day","Once a month","Never"],0]]},

{t:"Internet and email",
learn:[
["Browsers and searching","A **browser** such as Chrome, Edge or Firefox lets you visit websites. The **address bar** is for web addresses (URLs) and searches. Use specific keywords when you search: 'how to make a pivot table in Excel' is better than 'Excel'. Put quotes around an exact phrase. Check the website address before trusting the page and prefer trusted sources like .gov, .edu or well-known organisations.",["Address bar: type URLs or searches","Use specific keywords","Check who made the information"]],
["Creating and using email","Email needs an address like name@gmail.com. Create an account at gmail.com or outlook.com using your real name and a strong password. To send, click **Compose**, type the address in **To**, add a clear **Subject**, write your message and click **Send**. Use **Attach** (the paperclip) to include a file. **Cc** copies someone openly while **Bcc** copies them privately.",["To: main recipient","Subject: say what the message is about","Attach: paperclip icon"]],
["Downloading and online accounts","Download files only from trusted sites. Check the file type before opening it: avoid opening `.exe` files from email. Keep a list of the accounts you create (use a password manager or a notebook kept safely). Log out of accounts on shared computers. Learn to use online services such as Google Drive, Google Docs and video calls (Zoom or Google Meet).",["Download from trusted sources only","Log out on shared computers","Learn Google Drive and video calls"]]
],
tip:"If you must click a link in an email, hover over it first and check where it really goes.",
practical:{t:"Search, email and share a file",goal:"Search the web effectively, create or use an email account, and send an email with an attachment.",
steps:["Open a browser and search for 'free typing practice website'. Compare the first three results and decide which one looks most trustworthy and why.","Create a Gmail or Outlook account if you do not have one. Use a professional-style address and a strong password.","Compose an email to a friend or to yourself with the subject 'My first email from Spoiad'.","Attach the Practice.txt or School-Notes.txt file from the Files and folders practical.","Send it, then check that it arrived and open the attachment.","Reply to the email and add the sender to your contacts."],
check:["I compared three search results and judged their trustworthiness","I have a working email address","I sent an email with an attachment","I received it and replied"]},
quiz:[["Where do you type the recipient's address?",["To","Subject","Attach"],0],["Which is a better search?",["how to make a budget in Excel","Excel","budget"],0],["What should you do on a shared computer after using email?",["Log out","Leave it open","Write down your password on the screen"],0]]},

{t:"Staying safe online",
learn:[
["Strong passwords and two-step verification","A strong password is **long** (12 or more characters), **unique** for each important account and not based on your name or birthday. A good method is a passphrase of random words such as 'blue-mango-river-drum-47'. Turn on **two-step verification (2FA)** so a code from your phone is needed to log in. Never share passwords or codes, even with someone who says they are from the bank or WhatsApp.",["Long, unique and hard to guess","Turn on 2FA for email, WhatsApp and banking","Never share codes or passwords"]],
["Spotting scams and phishing","Scammers use fear, urgency and rewards to trick you. Warning signs: spelling mistakes, unknown sender, links that do not match the real company, requests for money or personal information, and 'you have won a prize'. Real banks never ask for your PIN, password or full card details by message. If in doubt, do not click: contact the company using its official number.",["Be suspicious of urgent messages","Never send money to claim a prize","Verify through official contact details"]],
["Protecting your device and privacy","Install updates and use an antivirus (Windows Security is built in and free). Download apps only from official stores. Be careful with public Wi-Fi: avoid banking on it. Think before you post: do not share your address, ID number, school timetable or live location. Check your privacy settings on social media and show profiles only to people you know.",["Update your device and apps","Avoid banking on public Wi-Fi","Limit personal details online"]]
],
tip:"If it feels urgent, pause. Scammers rely on you acting before you think.",
practical:{t:"Security checkup",goal:"Check and strengthen your accounts and device security.",
steps:["Write a new passphrase of four random words plus numbers and symbols. Do not reuse your old password.","Change the password of your main email account using that approach and write a hint (not the password) somewhere safe.","Turn on two-step verification for your email and WhatsApp (Settings > Account > Two-step verification).","Open Windows Security (or your phone's security settings) and check that updates and protection are on.","Look at three messages or emails (real or examples) and identify any scam warning signs.","Review your social media privacy settings and remove any personal details that strangers should not see."],
check:["My main email has a strong, unique password","Two-step verification is on for at least two accounts","I identified scam warning signs in three examples","I reviewed my privacy settings"]},
quiz:[["Which is the strongest password style?",["A long unique passphrase","Your birthday","12345678"],0],["What should you do with a message that says you won a prize and asks for money?",["Ignore and delete it","Send the money","Share it with everyone"],0],["Who should you give your WhatsApp verification code to?",["Nobody","Anyone who asks","Your neighbour"],0]]}
]});

COURSES.push({id:"data",cat:"Data and AI",title:"Data Analysis",color:"#0369A1",price:12000,level:"Beginner",hours:14,
blurb:"Turn raw numbers into clear answers using spreadsheets, pivot tables, SQL and dashboards.",
outcome:"Collect, clean and analyse data with spreadsheets and SQL, and present your findings in charts and a simple dashboard.",
modules:[
{t:"What data analysis is and how it works",
learn:[
["Data analysis in plain words","Data analysis means looking carefully at information to find answers that help people decide what to do. A shop owner who asks 'Which product makes me the most money?' is already doing data analysis. You do not need to be a maths genius. You need to be curious, careful and organised.",["Data = facts you have recorded (sales, scores, ages, prices)","Analysis = finding patterns and answers in those facts","Insight = a useful discovery you can act on"]],
["The five steps every analyst follows","Every analysis, big or small, follows the same path. Learn these five steps and you will always know what to do next.",["1. Ask: what question am I trying to answer?","2. Collect: where will the data come from?","3. Clean: fix mistakes and make it tidy","4. Analyse: calculate, sort, group and compare","5. Share: show the answer in a clear chart or short report"]],
["Rows, columns and types of data","Data usually lives in a table. Each **row** is one record (one sale, one student). Each **column** is one detail about it (date, product, price). Data comes in two main kinds: **numbers** (quantity, price, score) and **categories or text** (city, product name, gender). Knowing the kind tells you what you can do with it: you can add numbers, but you can only count or group categories.",["Row = one record","Column = one detail (also called a field)","Numbers can be added, categories can be counted"]]
],
tip:"A good question is specific. 'Which city bought the most notebooks in January?' is better than 'How are sales?'",
practical:{t:"Write a sharp question and plan your data",goal:"Turn a vague idea into a clear question and a plan for the data you need.",
steps:["Pick a topic you know: your weekly spending, a small shop's sales, your class test scores or your phone data use.","Write three questions you would like answered. Example: 'Which day do I spend the most?'","Choose the single best question: it should be specific and answerable with numbers.","List the columns you would need to record. Example: Date, Item, Category, Amount.","Open Google Sheets (sheets.google.com) or Excel and type those column names in row 1.","Add five sample rows with made-up values and save the file as My-First-Dataset."],
check:["I wrote one clear, specific question","I listed the columns I need","My sheet has headers in row 1 and five rows of data","I can say which columns are numbers and which are categories"]},
quiz:[["What is the first step of data analysis?",["Ask a clear question","Draw a chart","Delete data"],0],["In a data table, what does one row usually represent?",["One record","One title","One chart"],0],["Which of these is a category, not a number?",["City","Price","Quantity"],0]]},

{t:"Collecting and organising data",
learn:[
["Where data comes from","Data can come from things you record yourself, from forms and surveys, from files exported by apps (for example your bank or an online shop), and from free public sources such as government websites. Always note **where** your data came from and **when**, so people can trust your work.",["Google Forms collects answers into a Google Sheet automatically","Many apps let you export to CSV or Excel","Write the source and date on a notes sheet"]],
["The golden rules of tidy data","Tidy data is easy to analyse. Follow these rules: one row per record, one column per detail, one header row at the top, one type of value in each column, and no empty rows or merged cells inside your data. Put notes on a separate sheet, never inside the table.",["One row = one record","One column = one detail","Headers in row 1, no merged cells","Never mix text and numbers in one column"]],
["Getting set up in a spreadsheet","In Google Sheets or Excel: click row 1 and freeze it (View > Freeze) so headers stay visible. Format the Date column as a date and the price column as currency. Rename the sheet tab to something clear like Sales. Turn the range into a Table in Excel with Ctrl+T, or add a filter in Sheets with Data > Create a filter.",["Freeze the header row","Format dates and money correctly","Name your sheets clearly"]]
],
tip:"Spend time organising data properly at the start. Messy data creates wrong answers later.",

{t:"Cleaning data",
learn:[
["Why data needs cleaning","Real data is almost always messy. People type names in different ways, leave cells blank, enter a record twice or add extra spaces. If you analyse messy data, your answers will be wrong. Cleaning means finding these problems and fixing them in a careful, repeatable way.",["Duplicates: the same record twice","Inconsistent text: 'lagos', 'LAGOS', 'Lagos '","Missing values: blank cells","Wrong types: numbers stored as text"]],
["Your cleaning toolkit","Always **work on a copy** and keep the original safe. Useful functions: `=TRIM(A2)` removes extra spaces, `=PROPER(A2)` makes Names Like This, `=UPPER(A2)` makes capitals, `=CLEAN(A2)` removes hidden characters. Use Find and Replace (Ctrl+H) to fix repeated mistakes, and Data > Remove duplicates to delete repeated rows.",["TRIM + PROPER fix most name problems","Ctrl+H: Find and Replace","Data > Remove duplicates"]],
["Dealing with missing values","Do not guess. Decide on a rule and note it. You can leave blanks and ignore them in calculations, fill with a clear label like 'Unknown' for categories, or remove the row if it is useless. Never replace a missing number with 0 unless zero is truly the correct value, because it will pull averages down.",["Blank is not the same as zero","Write down every cleaning decision","Count how many rows you changed"]]
],
tip:"Add a new column for the cleaned version using a formula. Never overwrite the original column.",

{t:"Analysing data with formulas",
learn:[
["Start with the basics","Most questions can be answered with a few functions. `=SUM(range)` adds, `=AVERAGE(range)` finds the mean, `=MAX()` and `=MIN()` find the highest and lowest, `=COUNT()` counts numbers. Always select the range carefully so you include every row but not the header.",["=SUM(G2:G21)","=AVERAGE(D2:D21)","=MAX(G2:G21) and =MIN(G2:G21)"]],
["Answering questions with conditions","`=SUMIF(range, condition, sum_range)` adds only the rows that match. `=COUNTIF(range, condition)` counts them. For more than one condition use `=SUMIFS()` and `=COUNTIFS()`. This is how you answer questions like 'How much did Lagos make?'",["=SUMIF(F2:F21,\"Lagos\",G2:G21)","=COUNTIF(B2:B21,\"Notebook\")","=SUMIFS(G2:G21,F2:F21,\"Lagos\",C2:C21,\"Stationery\")"]],
["Percentages and comparisons","A share of the total is 'part divided by whole'. For example the share of Lagos is Lagos revenue divided by total revenue. Format the result as a percentage. Comparing parts with percentages is often clearer than comparing big numbers.",["Share = part / total","Format as % with the % button","Round sensibly"]]
],
tip:"After every formula, ask: does this answer look sensible? A quick estimate in your head catches mistakes.",
practical:{t:"Answer five questions about the Spoiad Shop",goal:"Use SUM, SUMIF, COUNTIF and percentages on your sales dataset.",
steps:["Open the Sales sheet from Module 2. Add a new sheet called Analysis.","In Analysis, put the labels in column A and a formula in column B for: Total revenue (=SUM(Sales!G2:G21)).","Add 'Lagos revenue' using SUMIF on the City column. Do the same for Abuja and Kano.","Add the share of each city: its revenue divided by total revenue. Format as percentages.","Add 'Notebook orders' using COUNTIF, and 'Electronics revenue' using SUMIF on the Category column.","Write one sentence under your results: which city is strongest and by how much?"],
check:["Total revenue is calculated with a formula","Revenue and share are shown for all three cities","I used COUNTIF and SUMIF correctly","I wrote a plain-English finding"]},
quiz:[["Which function adds only rows that match a condition?",["SUMIF","COUNT","MAX"],0],["How do you calculate a share of the total?",["Part divided by total","Part plus total","Total minus part"],0],["Which function counts rows that match a condition?",["COUNTIF","SUM","TRIM"],0]]},

{t:"Pivot tables: summarise in seconds",
learn:[
["What a pivot table does","A pivot table takes a long list and instantly summarises it. You drag fields into four areas: **Rows** (what to group by), **Columns** (a second grouping), **Values** (what to calculate) and **Filters** (what to include). Without any formulas you can answer: 'Total revenue per product, per city, per month'.",["Rows: groups down the side","Columns: groups across the top","Values: Sum, Count or Average","Filters: narrow the data"]],
["Creating one step by step","Click anywhere inside your data. In Excel choose Insert > PivotTable. In Google Sheets choose Insert > Pivot table. Place it on a new sheet. Drag Product into Rows and Revenue into Values. The table appears instantly. Change Sum to Average by clicking the value field settings. Drag City into Columns to compare cities side by side.",["Excel: Insert > PivotTable","Sheets: Insert > Pivot table","Always use a new sheet"]],
["Grouping and refreshing","Right-click a date in your pivot table and choose Group to group by month. Pivot tables do not update automatically when the data changes: in Excel click Refresh (right-click > Refresh). Use Slicers (Excel) to filter with buttons. Sort largest to smallest to find the winners fast.",["Group dates by month","Refresh after changing data","Sort largest to smallest"]]
],
tip:"If your pivot table shows Count instead of Sum for revenue, check that the column holds numbers, not text.",
practical:{t:"Pivot the Spoiad Shop sales",goal:"Build three pivot tables that answer real questions.",
steps:["Open your Sales sheet and click anywhere inside the data. Insert a pivot table on a new sheet called Pivots.","Pivot 1: Product in Rows, Sum of Revenue in Values. Sort from largest to smallest. Which product earns the most?","Create a second pivot table. Put City in Rows and Category in Columns, with Sum of Revenue in Values.","Create a third pivot table with Date in Rows. Group the dates by Months and show total Revenue.","Add a Filter on City to one of the pivots and view only Lagos.","Under each pivot write one sentence describing what it shows."],
check:["Three pivot tables exist on the Pivots sheet","One pivot compares cities and categories together","Dates are grouped by month","I wrote a short finding under each pivot"]},
quiz:[["Where do you drag the field you want to add up?",["Values","Filters","Title"],0],["What should you do when the source data changes?",["Refresh the pivot table","Delete the sheet","Nothing, it always updates"],0],["Why group dates by month?",["To see monthly totals","To make them bigger","To hide them"],0]]},

{t:"Statistics made simple",
learn:[
["Mean, median and mode","The **mean** is the usual average: add everything up and divide by how many. The **median** is the middle value when numbers are in order. The **mode** is the value that appears most. When a few extreme values exist, the median describes the typical case better than the mean. Example: salaries of 100k, 110k, 120k and 900k have a mean of 307k but a median of 115k.",["=AVERAGE(range)","=MEDIAN(range)","=MODE(range)"]],
["Spread: range and standard deviation","Two classes can have the same average but be very different. Spread tells you how far values are from the average. The **range** is the highest minus the lowest. **Standard deviation** (=STDEV(range)) is a single number showing typical distance from the mean: a small number means values are close together.",["Range = MAX - MIN","=STDEV(range)","Outliers are values far from the rest"]],
["Relationships and being honest","`=CORREL(range1, range2)` gives a number between -1 and 1 showing whether two things move together. Near 1 means they rise together, near -1 means one rises as the other falls, near 0 means little relationship. **Correlation is not proof of cause**: ice cream sales and sunburn rise together, but ice cream does not cause sunburn.",["Near 1: move together","Near 0: no clear link","Correlation does not prove cause"]]
],
tip:"Always look at the data in a chart before trusting a single average.",
practical:{t:"Study hours and exam scores",goal:"Calculate the main statistics and a correlation from two small lists.",
code:`Student\tHours\tScore
A\t1\t40
B\t2\t48
C\t3\t50
D\t4\t58
E\t5\t63
F\t6\t70
G\t7\t74
H\t8\t82
I\t2\t98`,
steps:["Paste the table into a new sheet called Stats.","Calculate the mean, median and mode of the Score column.","Calculate the range (MAX minus MIN) and standard deviation (STDEV) of Score.","Student I scored 98 with only 2 hours. Mark it as a possible outlier. Calculate the mean and median again without that row and compare.","Use =CORREL(B2:B10,C2:C10) to measure the relationship between hours and score. Then do it without student I.","Write three sentences: what changed, why the outlier matters, and why correlation does not prove cause."],
check:["Mean, median, range and standard deviation are calculated","I compared the results with and without the outlier","I calculated CORREL twice","I wrote an honest conclusion"]},
quiz:[["Which average is best when there are extreme values?",["Median","Mean always","Mode only"],0],["CORREL returns a value near 1. This means...",["The two lists rise together","One causes the other","There is no data"],0],["What does standard deviation measure?",["How spread out values are","The total","The largest value"],0]]},

{t:"SQL basics: asking databases questions",
learn:[
["What SQL is","SQL (say 'S-Q-L' or 'sequel') is the language used to ask questions of a database. A database stores data in tables like spreadsheets, but can hold millions of rows and be used by many people at once. Almost every company that uses data uses SQL, so it is one of the most valuable skills you can learn.",["Table = like a sheet","Query = a question you ask","Works in MySQL, PostgreSQL, SQLite and more"]],
["Your first queries","`SELECT` says what columns you want, `FROM` says which table, `WHERE` filters rows, and `ORDER BY` sorts. Every query ends with a semicolon. Try reading the query like a sentence: 'Select product and quantity from sales where city is Lagos.'",["SELECT * returns all columns","WHERE city = 'Lagos'","ORDER BY quantity DESC"],`SELECT * FROM sales;

SELECT product, quantity
FROM sales
WHERE city = 'Lagos'
ORDER BY quantity DESC;`],
["Summarising with GROUP BY","`GROUP BY` works like a pivot table. Use it with functions such as `SUM`, `COUNT`, `AVG`, `MIN` and `MAX`. Give results readable names with `AS`. Use `LIMIT` to show only the top rows.",["SUM, COUNT, AVG, MIN, MAX","AS gives a column a nicer name","LIMIT 3 shows the first three rows"],`SELECT product,
       SUM(quantity * unit_price) AS revenue
FROM sales
GROUP BY product
ORDER BY revenue DESC
LIMIT 3;`]
],
tip:"Write your query one clause at a time and run it often. Small steps make errors easy to find.",
